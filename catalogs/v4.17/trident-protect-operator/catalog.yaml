        version: v1
    description: |
      NetApp Trident Protect provides application-aware data protection for
      Kubernetes and OpenShift workloads that use NetApp Trident storage. It
      takes snapshots and backups of applications, including their Kubernetes
      resources and persistent volumes, restores them in place or to another
      cluster, and replicates them for disaster recovery.

      ## What this operator does

      The operator installs and manages one Trident Protect installation per
      cluster from a single cluster-scoped `TridentProtect` resource. It deploys
      the Trident Protect controller, CRDs, RBAC, webhooks and, on OpenShift,
      the required SecurityContextConstraints, and keeps them up to date when
      the operator is upgraded.

      ## Prerequisites

      * NetApp Trident 25.10 or later installed on the cluster, with a storage
        backend and StorageClass for the volumes you want to protect.
      * The Kubernetes volume snapshot CRDs and snapshot controller, plus a
        VolumeSnapshotClass for the Trident CSI driver.
      * An object storage bucket for backups, configured later as an AppVault.

      ## Getting started

      1. Install this operator from OperatorHub.
      2. Create one cluster-scoped `TridentProtect` resource. Its
         `spec.namespace` (default `trident-protect`) selects where the
         operator deploys Trident Protect.
      3. Create an AppVault for your bucket, then define Applications and
         protect them with Snapshots, Backups, Schedules, AppMirrors, etc.
      4. Optionally, enable `spec.connector.enabled: true` to connect to NetApp Console.
         Please reach out to support for assistance in automation for getting your Console credentials.

      ## Connecting to NetApp Console

      To manage the cluster from NetApp Console, create a Secret with your
      Console client credentials in the namespace named by `spec.namespace` and set
      `spec.connector.enabled: true` with the `spec.connector.registration`
      fields on the `TridentProtect` resource.

      See the [Trident Protect documentation](https://docs.netapp.com/us-en/trident/trident-protect/learn-about-trident-protect.html)
      for details.

    description: |
      **TenantTab needs a Denegra subscription, a Denegra pull secret and a Denegra licence.**
      Add the pull secret to the cluster before you click Install, and the licence after; to subscribe, write to info@denegra.ai.

      ## TenantTab

      A self-service AI platform portal for a Kubernetes cluster somebody already owns.

      ### Needs a Denegra subscription

      TenantTab is commercial software from Denegra, and both of these come with a subscription:

      - **A pull secret.** The images are private. Add the registry credential Denegra gives you
        to the cluster's global pull secret (`pull-secret` in `openshift-config`) before
        installing, or the operator cannot start. Denegra's install guide shows how.
      - **A licence.** Without one the portal runs in demo mode: it shows sample data and changes
        nothing on the cluster. Create the licence file Denegra sends as the Secret
        `tenanttab-license` (key `license.jwt`) in the portal's namespace, or upload it on the
        portal's Licence page. A licence that ends never stops running workloads.

      To subscribe, or for an evaluation licence, write to info@denegra.ai.

      Create one `TenantTab` resource and the portal appears in that namespace: a catalog teams
      order from, one-click deploys, model serving and an OpenAI-compatible gateway, RAG
      knowledge bases, cost visibility, and — optionally — multi-tenancy.

      ### What you get depends on what the cluster has

      TenantTab probes the cluster for OpenShift Virtualization, KServe, Prometheus, Qdrant,
      Velero and GPUs, and **hides the surfaces whose component is absent** rather than offering
      pages that can only fail. A probe that *fails* is treated as "unknown" and hides nothing —
      a feature that silently disappeared is not something a user can discover is missing. The
      full table is in the dashboard under Nodes → Cluster capabilities.

      So installing this on a bare cluster gives you a smaller product, not a broken one.

      ### Multi-tenancy

      On by default, and the portal does not become ready without it. The dashboard is granted
      impersonation and runs each tenant's session as `tenanttab:user:<name>`, so the **API
      server** decides which namespaces that session may touch. A tenant cannot get past that
      by getting past the UI.

      Tenants get their own namespaces, quotas (CPU, memory, storage, whole GPUs or MIG
      profiles), a catalog allow-list, an approval workflow, per-tenant cost and, if you want to
      charge for it, metered usage posted to a per-tenant ledger.

      ### Read this before installing

      The operator holds `escalate` and `bind` on ClusterRoles. It has to: Kubernetes refuses to
      let an account create a role granting permissions it does not itself hold, and the operator
      provisions the dashboard's ClusterRole. That makes **the operator as privileged as anything
      it can install**. The alternative — granting the operator the union of every permission the
      chart hands out — has to be kept in lockstep with the chart forever, and the edit that gets
      forgotten is the one that breaks an install at 2am.

      The portal it installs is a trusted component too, and its ServiceAccount is equivalent
      to cluster-admin. It may impersonate users and groups (it only ever uses `tenanttab:*`
      identities, but RBAC cannot express that limit, so it lives in the portal's code), it
      creates Roles and RoleBindings to provision tenants, and it starts catalog installs as a
      deployer account with broad access. Whoever takes over the portal takes the cluster.
      Give it its own namespace, put it behind SSO, and send its audit lines off the cluster.
      Permission to create or edit `TenantTab` resources is the same trust level: grant it only
      to people you would give cluster-admin.
      Setting `spec.deployer.enabled: false` removes the deployer account; catalog installs
      that need it then fail.

      Install it from a source you trust, and read what it actually grants:
      `deploy/helm/tenanttab/templates/rbac*.yaml` in the repository.

      ### On OpenShift specifically

      - **Velero** arrives through OADP in `openshift-adp`, not a namespace called `velero`. Set
        `spec.components.veleroNamespace`.
      - **Prometheus is authenticated** behind thanos-querier and TenantTab does not yet send a
        bearer token. Left unset, the probe reports Prometheus absent: Monitoring hides itself and
        the CPU/memory lines of the cost view read zero and say so, rather than inventing numbers.
        Cost metering is therefore partial on OpenShift until token support lands.
      - **Sign in with OpenShift** (`spec.openshift.oauth.enabled`): the cluster's own OAuth server,
        with the portal's ServiceAccount as the OAuth client, so no OAuthClient object is created.
        OpenShift groups map to roles and tenants. For SSO with portal-enforced MFA, point
        `spec.oidc.issuer` at the identity provider behind OpenShift instead.
      - **Console**: the portal appears in the console's application menu once `spec.route.host` is
        set, and `spec.openshift.consoleNotification` puts a maintenance banner across the console.
      - **restricted-v2 everywhere.** The dashboard image runs as a non-root user on a port above
        1024 and never writes to its filesystem; its pods state the restricted shape with no uid.
        Every workload the portal creates (catalog apps, platform services, deploys, previews,
        installer jobs) is shaped the same way, image builds run as OpenShift Builds, and cluster
        services OpenShift already provides (monitoring, GitOps, KServe through OpenShift AI,
        virtualization) are left to their Red Hat operators. No SCC exception is requested.

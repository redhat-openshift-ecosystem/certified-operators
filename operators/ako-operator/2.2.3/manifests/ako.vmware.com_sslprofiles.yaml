apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  creationTimestamp: null
  name: sslprofiles.ako.vmware.com
spec:
  group: ako.vmware.com
  names:
    kind: SSLProfile
    listKind: SSLProfileList
    plural: sslprofiles
    shortNames:
    - sslp
    singular: sslprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SSLProfile is the Schema for the sslprofiles API
          Represents SSL/TLS configuration for virtual services including cipher suites,
          protocol versions, and session management settings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of SSLProfile
            properties:
              acceptedCiphers:
                default: AES:3DES:RC4
                description: |-
                  AcceptedCiphers specifies cipher suites as defined by OpenSSL.
                  Format: https://www.openssl.org/docs/man1.1.1/man1/ciphers.html
                  Either AcceptedCiphers or CipherEnums must be specified (validation enforced).
                maxLength: 1024
                type: string
              acceptedVersions:
                description: |-
                  AcceptedVersions specifies the set of SSL/TLS versions accepted by the server.
                  Minimum of 1 item required. At least one SSL/TLS version must be specified.
                items:
                  description: SSLVersion defines the SSL/TLS version
                  properties:
                    type:
                      description: Type specifies the SSL/TLS version type
                      enum:
                      - SSL_VERSION_TLS1
                      - SSL_VERSION_TLS1_1
                      - SSL_VERSION_TLS1_2
                      - SSL_VERSION_TLS1_3
                      type: string
                  type: object
                minItems: 1
                type: array
              allowLegacyRenegotiation:
                default: false
                description: AllowLegacyRenegotiation allows backend servers to use
                  legacy renegotiation.
                type: boolean
              cipherEnums:
                description: |-
                  CipherEnums specifies cipher suites using enumerated values.
                  Provides an alternative to AcceptedCiphers for specifying allowed ciphers.
                  Either AcceptedCiphers or CipherEnums must be specified (validation enforced).
                items:
                  description: |-
                    AcceptedCipherEnum defines the accepted cipher suite enumeration for SSL/TLS connections.
                    Each cipher suite has associated security, performance, and compatibility ratings.

                    Security Score Mapping:
                      - SSL_SCORE_NOT_SECURE:   0.0
                      - SSL_SCORE_VERY_BAD:    20.0
                      - SSL_SCORE_BAD:         40.0
                      - SSL_SCORE_AVERAGE:     60.0
                      - SSL_SCORE_GOOD:        80.0
                      - SSL_SCORE_EXCELLENT:  100.0
                  enum:
                  - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
                  - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
                  - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
                  - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
                  - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
                  - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384
                  - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
                  - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384
                  - TLS_RSA_WITH_AES_128_GCM_SHA256
                  - TLS_RSA_WITH_AES_256_GCM_SHA384
                  - TLS_RSA_WITH_AES_128_CBC_SHA256
                  - TLS_RSA_WITH_AES_256_CBC_SHA256
                  - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA
                  - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA
                  - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
                  - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
                  - TLS_RSA_WITH_AES_128_CBC_SHA
                  - TLS_RSA_WITH_AES_256_CBC_SHA
                  - TLS_RSA_WITH_3DES_EDE_CBC_SHA
                  - TLS_AES_256_GCM_SHA384
                  - TLS_CHACHA20_POLY1305_SHA256
                  - TLS_AES_128_GCM_SHA256
                  - TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
                  - TLS_DHE_RSA_WITH_AES_256_GCM_SHA384
                  type: string
                type: array
              cipherSuites:
                default: TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
                description: |-
                  Ciphersuites specifies TLS 1.3 cipher suites as defined by OpenSSL.
                  Format: https://www.openssl.org/docs/man1.1.1/man1/ciphers.html
                maxLength: 512
                type: string
              description:
                description: Description provides additional information about the
                  SSL profile.
                type: string
              ecNamedCurve:
                default: auto
                description: |-
                  EcNamedCurve specifies Elliptic Curve Cryptography NamedCurves (TLS Supported Groups).
                  Format: RFC 8422-Section 5.1.1 and https://docs.openssl.org/master/man3/SSL_CTX_set1_curves/
                maxLength: 256
                type: string
              enableEarlyData:
                default: false
                description: EnableEarlyData enables early data processing for TLS
                  1.3 connections.
                type: boolean
              enableSslSessionReuse:
                default: true
                description: EnableSslSessionReuse enables SSL session re-use for
                  improved performance.
                type: boolean
              isFederated:
                default: false
                description: |-
                  IsFederated specifies whether the object is replicated to GSLB followers.
                  This field is immutable once set.
                type: boolean
              preferClientCipherOrdering:
                default: false
                description: |-
                  PreferClientCipherOrdering prefers the SSL cipher ordering presented by the client
                  during the SSL handshake over the one specified in the SSL Profile.
                type: boolean
              sendCloseNotify:
                default: true
                description: SendCloseNotify sends 'close notify' alert message for
                  a clean shutdown of the SSL connection.
                type: boolean
              signatureAlgorithm:
                default: auto
                description: |-
                  SignatureAlgorithm specifies signature algorithms as defined by RFC5246-Section 7.4.1.4.1.
                  Format: https://docs.openssl.org/master/man3/SSL_CTX_set1_sigalgs/
                maxLength: 256
                type: string
              sslSessionTimeout:
                default: 86400
                description: SslSessionTimeout specifies the amount of time in seconds
                  before an SSL session expires.
                format: int32
                type: integer
              type:
                default: SSL_PROFILE_TYPE_APPLICATION
                description: |-
                  Type specifies the SSL Profile Type.
                  This field is immutable once set.
                enum:
                - SSL_PROFILE_TYPE_APPLICATION
                - SSL_PROFILE_TYPE_SYSTEM
                type: string
            required:
            - acceptedVersions
            type: object
            x-kubernetes-validations:
            - message: acceptedVersions must have at least one SSL/TLS version
              rule: has(self.acceptedVersions) && size(self.acceptedVersions) > 0
            - message: Either acceptedCiphers or cipherEnums must be specified
              rule: has(self.acceptedCiphers) || (has(self.cipherEnums) && size(self.cipherEnums)
                > 0)
          status:
            description: Status defines the observed state of SSLProfile
            properties:
              backendObjectName:
                description: BackendObjectName is the name of the backend object
                type: string
              conditions:
                description: |-
                  Conditions is the list of conditions for the SSL profile
                  Supported condition types:
                  - "Programmed": Indicates whether the SSLProfile has been successfully
                    processed and programmed on the Avi Controller
                    Possible reasons for True: "Created", "Updated"
                    Possible reasons for False: "CreationFailed", "UpdateFailed", "UUIDExtractionFailed", "DeletionFailed", "DeletionSkipped"
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controller:
                description: Field is populated by AKO CRD operator as ako-crd-operator
                type: string
              lastUpdated:
                description: LastUpdated is the timestamp the object was last updated
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the observed generation by the
                  operator
                format: int64
                type: integer
              tenant:
                description: Tenant is the tenant where the SSL profile is created
                type: string
              uuid:
                description: UUID is unique identifier of the SSL profile object
                type: string
            required:
            - uuid
            type: object
        type: object
        x-kubernetes-validations:
        - message: SSLProfile name must be at most 256 characters
          rule: self.metadata.name.size() <= 256
        - message: spec.type is immutable
          rule: has(self.spec.type) && self.spec.type == oldSelf.spec.type
        - message: spec.isFederated is immutable
          rule: '!has(oldSelf.spec.isFederated) || self.spec.isFederated == oldSelf.spec.isFederated'
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

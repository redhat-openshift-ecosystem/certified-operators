apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  creationTimestamp: null
  name: mcpconfigurations.mcp.ai.randoli.io
spec:
  group: mcp.ai.randoli.io
  names:
    kind: MCPConfiguration
    plural: mcpconfigurations
    shortNames:
    - mcpconf
    singular: mcpconfiguration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .spec.transport
      name: Transport
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              allowedTools:
                description: Deprecated, superseded by tools. The tool names this
                  server may expose to the agents it is enabled for. Read only when
                  tools is absent, and then no tool of this server counts as one that
                  changes a system.
                items:
                  type: string
                type: array
              category:
                type: string
              headers:
                additionalProperties:
                  type: string
                type: object
              prompt:
                type: string
              sensitiveTools:
                description: 'Tools whose output is credentials, such as a secret
                  store read. Their values never reach the agent: key names and structure
                  pass and every value is replaced, and output that cannot be parsed
                  is withheld whole. Most servers need none of this, because a Secret
                  in any payload and any credential shaped key name are already blanked
                  for every server.'
                items:
                  type: string
                type: array
              tools:
                additionalProperties:
                  enum:
                  - read
                  - mutate
                  type: string
                description: 'The tools this server may expose, each with what it
                  does: read for a tool that only reads, mutate for a tool that changes
                  a system. The keys are the allow list, so a tool that is not named
                  here is not given to any agent. A mutate tool is refused until the
                  user approves that exact call, and read only agents are never given
                  one.'
                type: object
              transport:
                enum:
                - streamable_http
                - sse
                - stdio
                type: string
              type:
                type: string
              url:
                format: uri
                type: string
            required:
            - type
            - transport
            - url
            - prompt
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

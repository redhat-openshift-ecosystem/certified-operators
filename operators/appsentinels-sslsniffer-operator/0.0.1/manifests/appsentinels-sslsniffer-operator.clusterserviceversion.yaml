  description: |-
    ## AppSentinels SSL Sniffer Operator

    eBPF based SSL/TLS traffic sniffer for OpenShift and Kubernetes.
    Captures HTTP/HTTPS traffic from all applications without any code changes.

    ## Privileged Capabilities Justification

    privileged: true
      Required to load eBPF programs into the Linux kernel.

    SYS_ADMIN
      Required to load and attach eBPF programs to kernel hooks.

    SYS_PTRACE
      Required to read memory of other processes to intercept TLS traffic.

    hostPID: true
      Required to see all processes running on the node.

    hostPath (/sys, /sys/kernel/debug)
      Required to access kernel debug filesystem for eBPF.
  displayName: AppSentinels SSL Sniffer

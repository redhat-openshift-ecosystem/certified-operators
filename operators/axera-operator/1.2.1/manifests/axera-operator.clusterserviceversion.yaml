                # quay.io/axera/axera-operator:v1.2.1, pinned by digest (RELEASE-1.2.1.md, release steps)
                image: quay.io/axera/axera-operator@sha256:393b67ce91fca51986cf73841a4a3dd08ca804702d7e1e761a5633e1758f7191
                livenessProbe:

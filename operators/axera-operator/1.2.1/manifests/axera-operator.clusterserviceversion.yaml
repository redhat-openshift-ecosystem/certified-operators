spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Axera is the Schema for the axeras API — one CR deploys the whole
        platform.
      displayName: Axera
      kind: Axera
      name: axeras.platform.axerasecurity.com
      specDescriptors:
      - description: |-
          Leave out ClusterRoles axera-integration-extended (Istio routing writes, cluster-wide pods/log,
          changing any Namespace) and axera-integration-agent-deploy (AxeraFlow install from the UI:
          SCC, DaemonSet and RBAC create). For regulated installs: Mesh > Traffic deploy, automatic OVN
          ACL-logging annotation and AxeraFlow deploy from the UI then answer a refusal naming this
          switch. The largest grant left is pods/exec in the agent namespace for packet capture;
          namespacedRoles=never removes that too.
        displayName: Least-privilege integration RBAC
        path: integration.leastPrivilege
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: |-
          How the namespaced Roles render (pods/exec in the agent namespace "axera" for packet capture;
          with leastPrivilege, the pods/log Roles in the mesh and OVN namespaces). auto: when the
          namespace exists (the operator looks it up); always: without asking (the reconcile fails
          while a namespace is missing); never: not at all (packet capture then answers 403).
        displayName: Namespaced integration Roles
        path: integration.namespacedRoles
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:auto
        - urn:alm:descriptor:com.tectonic.ui:select:always
        - urn:alm:descriptor:com.tectonic.ui:select:never
      - description: |-
          Let Axera apply the router access-logging patch it renders to OpenShift IngressControllers
          (Settings > Integrations > Ingress & Load Balancers > Apply from Axera). On: Role and
          RoleBinding axera-integration-ingress-logging-<namespace> in openshift-ingress-operator give
          the integration identity get and patch on the IngressControllers listed in
          integration.ingressLoggingApply.ingressControllers (default [default]) and no other. Axera
          previews every apply with a server-side dry run, applies it with the previewed
          resourceVersion as precondition and keeps the pre-image for a rollback; only spec.logging is
          ever written, and the user who applies also needs Axera's IngressSetup:Write permission.
          Off (the default): Axera shows the patch and an admin applies it; turned off again, the
          next reconcile removes the Role and its binding.
        displayName: Apply router logging from Axera
        path: integration.ingressLoggingApply.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      version: v1alpha1
    - description: AxeraFlow deploys the network-flow agent (eBPF + flowlogs-pipeline)
        on one monitored cluster, shipping per-cluster flow topics to the central Kafka.
        Ready counts agent pods, not delivered telemetry (flowlogs-pipeline is probed
        on its health port only), so confirm on the broker that the topics grow. Like
        every agent kind it is reconciled only in the namespaces a cluster admin allows
        (axera, axera-flow and axera-process by default, unless a project request created
        them).
      displayName: Axera Flow Agent
      kind: AxeraFlow
      name: axeraflows.platform.axerasecurity.com
      version: v1alpha1
    - description: AxeraProcess deploys the process agent (an eBPF process sensor + fluent-bit)
        on one monitored cluster, shipping a per-cluster process topic to the central
        Kafka. The operator installs the sensor's CRDs when they are absent and upgrades
        a copy it installed itself when that copy is older (such as the v1.4.0 copies
        that operator 1.0 and 1.1.0 created); a copy another installation manages, or a
        newer one, is never changed. Like every agent kind it is reconciled only in the
        namespaces a cluster admin allows (axera, axera-flow and axera-process by default,
        unless a project request created them).
      displayName: Axera Process Agent
      kind: AxeraProcess
      name: axeraprocesses.platform.axerasecurity.com
      version: v1alpha1
    - description: AxeraForce deploys the combined flow+process "OneBox" agent (one
        DaemonSet) on one monitored cluster. The operator installs the process sensor's
        CRDs when they are absent and upgrades a copy it installed itself when that copy
        is older (such as the v1.4.0 copies that operator 1.0 and 1.1.0 created); a copy
        another installation manages, or a newer one, is never changed. Ready counts
        agent pods, not delivered telemetry (flowlogs-pipeline is probed on its health
        port only), so confirm on the broker that the topics grow. Like every agent kind
        it is reconciled only in the namespaces a cluster admin allows (axera, axera-flow
        and axera-process by default, unless a project request created them).
      displayName: Axera Force Agent (OneBox)
      kind: AxeraForce
      name: axeraforces.platform.axerasecurity.com
      specDescriptors:
      - description: |-
          Ship the north-south ingress lane (traffic entering the cluster from load balancers,
          external IPs, NodePorts and the router) to its own Kafka topic. Off by default.
          flowlogs-pipeline never creates a topic: create it on the broker first, with WRITE
          for the agent's Kafka user and READ for Radar's consumer group, and list it in the
          platform's kafka.ingressTopics.
        displayName: Ingress lane
        path: flow.ingress.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Kafka topic of the ingress lane (default ingress-flows). It must
          already exist on the broker and differ from every other topic the agent writes.
        displayName: Ingress topic
        path: flow.ingress.topic
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      version: v1alpha1
  description: |
    # Axera Microsegmentation & NDR Operator

    Axera is a Kubernetes-native **microsegmentation** and **Network Detection &
    Response (NDR)** platform for Red Hat OpenShift. This operator deploys and
    lifecycle-manages the entire Axera platform — API, radar, network-policy
    watcher, allow/drop monitor, frontend console, and (optionally) in-cluster
    PostgreSQL, Kafka and an on-prem Ollama AI assistant — from a single `Axera`
    custom resource.

    ## What it does
    - **One CR, whole platform.** Create an `Axera` resource and the operator
      reconciles all of the platform's workloads, services, routes, RBAC, SCC and
      NetworkPolicies into your namespace.
    - **Least-privilege NetworkPolicy from observed traffic.** Axera watches real
      east-west and egress traffic and synthesizes default-deny NetworkPolicy.
    - **Seamless upgrades.** Bump `spec.version` and the operator rolls every
      component to the new image tag; status reports per-component health.
    - **Deep insights.** The operator exposes platform-health Prometheus metrics
      and ships a ServiceMonitor + PrometheusRule (not-ready, component-down,
      upgrade-stuck, no-managed-policies alerts), and reflects live health and
      managed-policy count into the CR status.
    - **Backup & restore.** Built-in Backup & Restore of the platform databases
      (internal OR external) — scheduled + ad-hoc `pg_dump` / `pg_restore` with
      download and point-in-time restore, driven from the in-product Backup &
      restore page; the storage backing (PVC or NFS) is set via `spec.backup`.
    - **On-prem AI incident triage.** Provider-agnostic; everything stays in the
      cluster — suitable for air-gapped and regulated environments.

    ## Getting started
    Create an `Axera` CR (see the sample). The operator surfaces progress on the CR
    status (`Phase`, `Ready`, conditions, per-component health and the console URL).

    Then register the cluster in the console (Clusters → add a Kubernetes cluster)
    with URL `https://kubernetes.default.svc` and the token of the platform's one
    integration identity, ServiceAccount `axera-integration-sa`:
    `oc -n <namespace> get secret axera-sa-token -o jsonpath='{.data.token}' | base64 -d`.
    `spec.integration.leastPrivilege: true` withholds the grants on objects Axera
    does not own (Istio routing writes, cluster-wide pod logs, namespace changes,
    agent install from the console).

    > **Upgrading from 0.x:** the second ServiceAccount `axera-integration` of
    > earlier releases is no longer created. A cluster registered with its token
    > keeps working — while it exists the operator binds it to the base integration
    > role and to pod logs in the mesh namespaces, never to the extended rights.
    > Re-register the cluster with the `axera-sa-token` token, then delete
    > ServiceAccount `axera-integration`. `spec.mesh.rbac` is ignored from 1.0.0; an
    > explicit opt-out there is reported by the `DeprecatedSettings` condition.

    > **Upgrading from 1.1.1 or earlier:**
    > 1. Upgrade the operator. It upgrades the process-sensor CRDs it installed itself
    >    (tracingpolicies, tracingpoliciesnamespaced, podinfo; the v1.4.0 copies that
    >    operator 1.0 and 1.1.0 created) to the v1.7.1 schema, and never changes a copy
    >    another installation manages or a newer one. Besides new fields,
    >    TracingPolicyNamespaced gains the CEL rule `!has(self.spec.hostSelector)`: the
    >    operator holds that CRD back while a namespaced policy sets a hostSelector
    >    (Axera renders none; check your own policies).
    > 2. In a window without policy changes, move the agents to the v1.7.1 process
    >    sensor and fluent-bit 4.2.8. A stored `spec.images` block freezes every image in
    >    it (all four of an AxeraForce, both of an AxeraProcess): the API server fills the
    >    block with the defaults of the release that admitted it, and a stored value
    >    changes only when that field is edited or removed. Where the block only
    >    repeats stock images of an older release (for example ebpfAgent
    >    v1.11.3-community, flp v1.11.5-community, shipper
    >    cr.fluentbit.io/fluent/fluent-bit:3.1.9, tetragon v1.4.0), remove it so the
    >    current defaults apply:
    >    `oc -n <ns> patch axeraforce <name> --type json -p '[{"op":"remove","path":"/spec/images"}]'`
    >    (the same for an axeraprocess). Keep an explicit block only where images are
    >    deliberately mirrored, and set its `tetragon` and `shipper` to the current
    >    images. `spec.updateStrategy.type: OnDelete` lets you try the change on one
    >    node first.
    > 3. The agent kinds (AxeraForce, AxeraProcess, AxeraFlow) run privileged on every
    >    node, so they are reconciled only in the namespaces a cluster admin allows:
    >    axera, axera-flow and axera-process, unless the operator's environment variable
    >    `AXERA_AGENT_NAMESPACES` (comma-separated, or `*` for any namespace; set it in
    >    the Subscription's `spec.config.env`) says otherwise. The variable replaces the
    >    default list, so name every namespace that holds an agent. A default name counts
    >    only for a namespace created directly (`oc create namespace`): one created
    >    through a project request (`oc new-project`, the console's Create Project,
    >    self-provisioning) carries the `openshift.io/requester` annotation, and any user
    >    allowed to request projects can create an unused name, so it is reconciled only
    >    when the variable names it. List only namespaces that exist and that cluster
    >    admins control. The upgrade itself changes nothing for agents that already
    >    exist: while the variable is unset, an agent created before this release first
    >    started on the cluster (recorded in ConfigMap `axera-operator-agent-boundary` in
    >    the operator's namespace) is still reconciled wherever it is. Only agents created
    >    afterwards are held to the list; such an agent outside it, or in a default
    >    namespace a project request created, reports `NamespaceNotAllowed` and is left as
    >    it is until its namespace is allowed. Setting the variable makes the list strict
    >    for every agent, so list the existing ones first with
    >    `oc get axeraforces,axeraprocesses,axeraflows -A`.
    >
    > The north-south ingress lane (`spec.flow.ingress`) is off by default: create its
    > Kafka topic before turning it on.

    > Container images are pulled from a private registry — provide a pull secret
    > via `spec.imagePullSecret`.
  displayName: Axera Microsegmentation & NDR

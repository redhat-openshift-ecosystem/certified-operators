                    type: boolean
                  enableProcessNs:
                    default: false
                    type: boolean
                  exportFileMaxBackups:
                    default: 3
                    type: integer
                  exportFileMaxSizeMb:
                    default: 50
                    type: integer
                  usePerfRingBuffer:
                    description: |-
                      Make the process sensor deliver its events through the perf ring buffer instead of the
                      BPF ring buffer, which the validated sensor image uses on kernels that offer it (5.11-class
                      programs). A fallback only, for nodes where events are lost (the metrics endpoint on port
                      2112 counts them, ringbuf_events_lost_total) or the sensor's memory grows after the image

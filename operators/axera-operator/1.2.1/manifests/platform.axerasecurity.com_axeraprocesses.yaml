      openAPIV3Schema:
        description: AxeraProcess is the Schema for the process agent — one CR per
          monitored cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AxeraProcessSpec is the process agent (Cilium Tetragon + fluent-bit shipper) for
              one monitored cluster. It renders into the `axera-process` namespace and ships a
              per-cluster process topic to the central Kafka. Mirrors deploy/Axera-Process.

              The process sensor's CRDs (tracingpolicies, tracingpoliciesnamespaced, podinfo) come
              with the operator, in the schema of the validated sensor image (v1.7.1): it creates
              them when they are absent and upgrades a copy it installed itself when that copy is
              older (the v1.4.0 copies operator 1.0 and 1.1.0 created). A copy another installation
              manages, or a newer one, is never changed, and none is deleted with the agent. The
              TracingPolicyNamespaced CRD is held back while a namespaced policy sets
              spec.hostSelector, which the v1.7.1 schema forbids.
            properties:
              capture:
                description: |-
                  On-demand packet-capture sidecar (image + on/off). Exposed so a disconnected
                  cluster can point it at a mirror instead of relying on an ImageTagMirrorSet.
                properties:
                  enabled:
                    description: |-
                      Deploy the capture sidecar and its pods/exec Role. Unset: true on AxeraForce, false on
                      AxeraFlow and AxeraProcess — the Axera API captures only from the AxeraForce agent
                      (label app=axera-agent in namespace "axera"), so their sidecar was a privileged
                      container nothing ever used. Set false on AxeraForce to refuse pods/exec entirely (the
                      platform's integration.namespacedRoles=never does not reach this Role); the rest of
                      the agent is unaffected.
                    type: boolean
                  image:
                    default: quay.io/openshift/origin-network-tools:latest
                    description: |-
                      Packet-capture sidecar image (mirror it for disconnected installs). Upstream
                      rewrites both `latest` and its version tags, so in an air-gapped estate pin
                      this by digest — a tag is not a pin here.
                    type: string
                  integrationNamespaces:
                    description: |-
                      Namespaces, besides the agent's own, whose axera-integration-sa may exec into the capture
                      sidecar (RoleBinding axera-capture-exec-agent). Set it to the namespace of a central Axera that was
                      NOT installed by this operator on the same cluster (e.g. a Helm install in axera-central):
                      that platform captures with the token it registered for this cluster. A central Axera CR on
                      the same cluster is added automatically. Read by AxeraForce only.
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                type: object
              clusterName:
                description: |-
                  Identity of THIS cluster. The process topic defaults to "<clusterName>-process".
                  Cluster identity is carried ONLY by the topic name (Radar maps topic → cluster),
                  so a wrong topic silently misattributes every event. REQUIRED.
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                type: string
              createSCC:
                default: true
                description: Create the OpenShift SecurityContextConstraints (privileged
                  + hostNetwork).
                type: boolean
              images:
                description: Tetragon + fluent-bit shipper images.
                properties:
                  shipper:
                    default: quay.io/axera/fluent-bit:4.2.8
                    description: |-
                      fluent-bit shipper image (classic config). 4.2.8 is the validated baseline:
                      3.1.9 failed SCRAM-SHA-512 logins against some brokers.
                    type: string
                  tetragon:
                    default: quay.io/cilium/tetragon:v1.7.1
                    description: |-
                      Tetragon image for the btf-check init container and the tetragon container.
                      v1.7.1 is the validated baseline; v1.4.0 also works with the selector-less
                      TracingPolicy (rollback). The API server stores this default in a CR that has an
                      images block, so such a CR keeps the image it holds until this field is changed or
                      removed: editing other fields of the CR does not change it.
                    type: string
                type: object
              installTracingPolicy:
                default: true
                description: Apply the observe-only tcp_connect TracingPolicy (requires
                  the Tetragon CRDs).
                type: boolean
              kafka:
                description: Central Kafka the process shipper produces to.
                properties:
                  bootstrapServers:
                    description: |-
                      The central Kafka the agent produces to: one host:port, or a comma-separated host:port
                      list. The fluent-bit shipper (process lane) is given the whole list. flowlogs-pipeline
                      (flow lanes) takes ONE address and panics at start on a list, so it is given only the
                      FIRST entry and finds the other brokers through that broker's metadata: list first a
                      broker (or a bootstrap name that resolves to every broker) that is always reachable.
                    minLength: 1
                    type: string
                  caCert:
                    description: |-
                      Broker CA certificate (PEM) for TLS trust. Rendered into the agent's kafka
                      Secret and referenced by the writers' caCertPath / ssl.ca.location.
                    type: string
                  compression:
                    description: |-
                      Producer compression of every writer of the agent: flowlogs-pipeline
                      (encode.kafka.compression) and the fluent-bit shipper (rdkafka.compression.codec).
                      none | gzip | snappy | lz4 | zstd. Unset: lz4. Radar's consumers decompress every codec.
                      flowlogs-pipeline parses its config strictly and knows the setting from v1.11.4 on: with
                      an older FLP image, or the Axera rebuild (axera-flowlogs-pipeline:v1, AxeraFlow's default),
                      the unset default leaves the flow writers uncompressed and an explicit codec other than
                      none fails the render. zstd on the shipper needs a fluent-bit built with libzstd.
                      Changing it rolls the agent pods.
                    enum:
                    - none
                    - gzip
                    - snappy
                    - lz4
                    - zstd
                    type: string
                  createSecret:
                    default: true
                    description: |-
                      Create the agent's kafka Secret (CA + SASL creds) from the values above
                      (default true), or set false to bring your OWN pre-created Secret and keep
                      credentials out of the CR. When false, pre-create the Secret with keys:
                        ca.crt, username, password
                      named per kind: axera-flow-kafka (flow), axera-process-kafka (process); the
                      force/OneBox agent uses TWO Secrets — kafka-ca (key ca.crt) + kafka-sasl
                      (keys username, password). With Ssl or SaslSsl and insecureSkipVerify false, every
                      agent kind then verifies the broker against that Secret's ca.crt, so it must hold the
                      broker's CA (also for a broker whose certificate a public CA signed).
                    type: boolean
                  insecureSkipVerify:
                    default: false
                    description: Skip broker certificate verification (dev / self-signed
                      only).
                    type: boolean
                  saslMechanism:
                    default: ScramSha512
                    description: |-
                      SASL/SCRAM mechanism (only used for the Sasl* protocols). The chart maps this
                      ONE value to the FLP (`scramSHA512`) and fluent-bit (`SCRAM-SHA-512`) spellings —
                      it is never emitted verbatim. ScramSha256 works for AxeraProcess only:
                      flowlogs-pipeline knows plain and SCRAM-SHA-512 alone, so on AxeraForce and
                      AxeraFlow a Sasl* protocol with ScramSha256 fails the render (status RenderFailed)
                      instead of shipping a flow writer that cannot log in.
                    enum:
                    - Plain
                    - ScramSha256
                    - ScramSha512
                    type: string
                  saslPassword:
                    description: |-
                      SASL password. Leading and trailing whitespace is trimmed when the operator
                      writes it into the agent's Secret (createSecret: true). A pre-created Secret
                      (createSecret: false) must hold the bare values with no trailing newline (as
                      `echo | base64` or --from-file adds): flowlogs-pipeline trims them, but the
                      fluent-bit shipper reads them verbatim, and its login then fails exactly like a
                      wrong password.
                    type: string
                  saslUsername:
                    description: |-
                      SASL username. Leading and trailing whitespace is trimmed when the operator
                      writes it into the agent's Secret (createSecret: true).
                    type: string
                  securityProtocol:
                    default: Plaintext
                    description: Wire security. Plaintext | Ssl | SaslPlaintext |
                      SaslSsl.
                    enum:
                    - Plaintext
                    - Ssl
                    - SaslPlaintext
                    - SaslSsl
                    type: string
                required:
                - bootstrapServers
                type: object
              process:
                description: |-
                  What the agent exports besides the tcp_connect kprobes (spec.process.execExport)
                  and how the shipper buffers it (spec.process.shipperQueueMaxKbytes).
                properties:
                  execExport:
                    default: false
                    description: |-
                      Ship Tetragon's PROCESS_EXEC events next to the tcp_connect kprobes (exec visibility).
                      Off: only binaries that open a connection are seen, so a tool that runs without
                      connecting (pip3 --version) and the runtime-exec detector (sudo, nsenter, unshare,
                      crictl) stay dark, and Process Activity says so. On: the export-allowlist carries
                      PROCESS_EXEC with its own field-filter; the highest-volume Tetragon stream, so expect
                      more broker traffic on clusters with high process churn. The operator re-applies the
                      Tetragon ConfigMap on every reconcile, so this field is the only lever.
                    type: boolean
                  shipperQueueMaxKbytes:
                    default: 16384
                    description: |-
                      Upper bound, in KiB, of the shipper's Kafka producer queue
                      (rdkafka.queue.buffering.max.kbytes). While the broker is unreachable or refuses
                      the login, fluent-bit (Retry_Limit false) keeps producing into this queue; with
                      librdkafka's own default (1 GiB) the shipper grew about 1 MiB/s at 2000 events/s
                      and was OOMKilled at its 128Mi limit. 16384 (16 MiB) held it at about 83 MiB.
                      Raise it only together with the shipper's memory limit (spec.resources.shipper).
                      Minimum 1024, so one maximum-size Kafka message (message.max.bytes, 1 MB) still fits.
                    format: int32
                    minimum: 1024
                    type: integer
                type: object
              processTopic:
                description: Process topic override. Default "<clusterName>-process".
                type: string
              resources:
                description: |-

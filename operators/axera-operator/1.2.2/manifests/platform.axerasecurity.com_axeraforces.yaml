                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              submariner:
                description: |-
                  Cross-cluster (Submariner) intercluster flow capture. OMIT for a single-cluster
                  install; when set, an independent FLP branch keeps flows touching the Submariner
                  global CIDR (default 242.0.0.0/8) and ships them to a dedicated topic
                  (default intercluster-flows). Additive to — and independent of — multiCluster.
                properties:
                  clusterGlobalCidr:
                    description: |-
                      THIS cluster's own Globalnet SLICE (the sub-range the broker assigned this
                      cluster, e.g. 242.0.0.0/24), NOT the mesh-wide range above. Declared in the
                      FLP multi_cluster_division so this cluster's own Globalnet-SNATed egress is
                      attributed to it. Peer slices come from multiCluster.peers[].globalCidr.
                      Omit for the legacy single-slice behaviour. Slices must not overlap.
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                    type: string
                  globalCidr:
                    default: 242.0.0.0/8
                    description: |-
                      Submariner global CIDR — the MESH-WIDE globalnet range (Broker
                      `--globalnet-cidr-range`). Any endpoint in it is a cross-cluster flow; used
                      for the blanket "Reserved" enrich label. Must match the mesh.
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                    type: string
                  topic:
                    default: intercluster-flows
                    description: Kafka topic for the cross-cluster (intercluster)
                      flows.
                    type: string
                type: object
              tolerations:
                description: |-
                  Scheduling overrides for the agent DaemonSet.

                  Tolerations: when OMITTED the agent keeps the default single `{operator: Exists}`
                  toleration (runs on EVERY node, incl. tainted control-plane/infra — the usual OneBox
                  posture). Set your own list to restrict which taints it tolerates (this REPLACES the
                  tolerate-all default).
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              updateStrategy:
                description: |-
                  How the agent DaemonSet replaces its pods after a change to them (an image, a setting,
                  rotated Kafka credentials). Unset: RollingUpdate, one node at a time. To try a change on one
                  node first (a canary): set type OnDelete, make the change, delete the agent pod on one node,
                  check that node, then set type back to RollingUpdate (or remove updateStrategy) and the other
                  nodes follow one by one. While type is OnDelete no agent pod is replaced by itself: every later
                  change, including a configuration change the operator makes, reaches a node only when its pod
                  is deleted.
                properties:
                  maxUnavailable:
                    default: 1
                    description: |-
                      RollingUpdate only: how many nodes may be without a running agent pod at the same time during
                      a rollout. Default 1. A new pod never starts next to the old one on a node (maxSurge 0): the
                      agent listens on node ports, so the two would collide.
                    format: int32
                    minimum: 1
                    type: integer
                  type:
                    default: RollingUpdate
                    description: |-
                      RollingUpdate (the default) replaces the agent pods node by node after every change; OnDelete
                      replaces a node's pod only when that pod is deleted.
                    enum:
                    - RollingUpdate
                    - OnDelete
                    type: string
                type: object
            required:
            - clusterName
            - kafka
            - podCIDR
            type: object
            x-kubernetes-validations:
            - message: 'kafka.saslMechanism ScramSha256 is not supported on AxeraForce:
                flowlogs-pipeline logs in with Plain or ScramSha512 only, so use ScramSha512
                (AxeraProcess supports ScramSha256)'
              rule: '!(has(self.kafka.securityProtocol) && self.kafka.securityProtocol
                in [''SaslPlaintext'',''SaslSsl''] && has(self.kafka.saslMechanism)
                && self.kafka.saslMechanism == ''ScramSha256'')'
          status:
            description: AgentStatus is the DaemonSet-centric observed state shared
              by every agent kind.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredScheduled:
                description: Nodes the agent DaemonSet wants a pod on.
                format: int32
                type: integer
              numberReady:
                description: |-
                  Agent pods currently Ready. Ready is not delivery: the only probes are
                  flowlogs-pipeline's TCP checks of its health port 28080; the eBPF agent, Tetragon
                  and the fluent-bit shipper have none. A pod is therefore Ready while a writer cannot reach
                  the broker, fails the login, or writes to a topic that does not exist. Confirm
                  delivery on the broker (the topic's offsets keep growing) or in Radar.
                format: int32
                type: integer
              observedGeneration:
                description: Generation last reconciled.
                format: int64
                type: integer
              phase:
                description: |-
                  Coarse phase: Pending | Ready | Degraded. Ready means every agent pod is Ready, which
                  does not prove that telemetry reaches Kafka (see numberReady).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

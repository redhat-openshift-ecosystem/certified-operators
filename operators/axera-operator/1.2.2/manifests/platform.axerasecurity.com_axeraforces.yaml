        description: |-
          AxeraForce is the Schema for the combined flow+process (OneBox) agent — one CR
          per monitored cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AxeraForceSpec is the combined flow+process "OneBox" agent for one monitored
              cluster: a single DaemonSet in the `axera` namespace running the eBPF agent +
              flowlogs-pipeline + Tetragon + fluent-bit shipper as sidecars, sharing one
              ServiceAccount / RBAC / SCC and ONE Kafka endpoint. Mirrors deploy/Axera-OneBox.

              The OneBox invariant: both writers share one broker + one credential set, so the
              Kafka block is hoisted to the top level (not split under flow/process).

              The process sensor's CRDs (tracingpolicies, tracingpoliciesnamespaced, podinfo) come
              with the operator, in the schema of the validated sensor image (v1.7.1): it creates
              them when they are absent and upgrades a copy it installed itself when that copy is
              older (the v1.4.0 copies operator 1.0 and 1.1.0 created). A copy another installation
              manages, or a newer one, is never changed, and none is deleted with the agent. The
              TracingPolicyNamespaced CRD is held back while a namespaced policy sets
              spec.hostSelector, which the v1.7.1 schema forbids.

              A Sasl* securityProtocol with saslMechanism ScramSha256 is refused (flowlogs-pipeline knows
              Plain and SCRAM-SHA-512 only); AxeraProcess, whose shipper is fluent-bit alone, supports it.

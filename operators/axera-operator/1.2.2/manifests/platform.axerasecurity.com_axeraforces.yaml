              auditForwarder:
                description: |-
                  Audit forwarder for NetworkPolicy "Modified By" attribution of changes made ON
                  THIS monitored cluster — posts this cluster's API audit events to the CENTRAL
                  Axera. Default off. See AgentAuditForwarder.

                  Health: while enabled, the status carries the condition AuditForwarderReady: False without
                  a targetUri or internalToken, when no control-plane node runs a forwarder (a hosted control
                  plane has none), or while a forwarder pod is not Ready. Ready pods are not delivery: each
                  forwarder serves its own metrics on pod port 9598 (oc port-forward <pod> 9598, then
                  curl -s localhost:9598/metrics), where a growing
                  vector_component_errors_total{component_id="axera_audit"}, or
                  vector_http_client_responses_total with a status other than 200, means events are not
                  reaching the central API.
                properties:
                  caCert:
                    description: |-
                      CA certificate (PEM) to trust for the central Route's TLS. OpenShift routers
                      commonly serve a self-signed/enterprise wildcard the forwarder won't trust by
                      default — without this (or insecureSkipVerify) every POST fails
                      "certificate verify failed" and events are dropped. Central's router CA:
                        oc -n openshift-ingress-operator get secret router-ca -o jsonpath='{.data.tls\.crt}' | base64 -d
                    type: string
                  enabled:
                    default: false
                    description: |-
                      Deploy the forwarder on this cluster. Default false (opt-in; it is a privileged,
                      control-plane DaemonSet).
                    type: boolean
                  image:
                    default: docker.io/timberio/vector:0.40.1-debian
                    description: Vector image (mirror for disconnected installs).
                    type: string
                  insecureSkipVerify:
                    default: false
                    description: Skip TLS verification of the central Route (test/self-signed
                      only — prefer caCert).
                    type: boolean
                  internalToken:
                    description: |-
                      Shared Internal token (the platform's Internal__Token) to authenticate to
                      /api/Internal/Audit. Plaintext in the CR; the chart mounts it into the forwarder.
                      The agent has no axera-app-secret, so it must be supplied here.
                    type: string
                  targetUri:
                    description: |-
                      Central Axera audit ingest URL — REQUIRED when enabled. The agent is remote, so use
                      the central API's public Route, e.g.
                      https://api-axera-central.apps.<clusterDomain>/api/Internal/Audit
                    type: string
                type: object
              capture:
                description: |-
                  On-demand packet-capture sidecar (image + on/off). Exposed so a disconnected
                  cluster can point it at a mirror instead of relying on an ImageTagMirrorSet.
                properties:
                  enabled:
                    description: |-
                      Deploy the capture sidecar and its pods/exec Role. Unset: true on AxeraForce, false on
                      AxeraFlow and AxeraProcess — the Axera API captures only from the AxeraForce agent
                      (label app=axera-agent in namespace "axera"), so their sidecar was a privileged
                      container nothing ever used. Set false on AxeraForce to refuse pods/exec entirely (the
                      platform's integration.namespacedRoles=never does not reach this Role); the rest of
                      the agent is unaffected.
                    type: boolean
                  image:
                    default: quay.io/openshift/origin-network-tools:latest
                    description: |-
                      Packet-capture sidecar image (mirror it for disconnected installs). Upstream
                      rewrites both `latest` and its version tags, so in an air-gapped estate pin
                      this by digest — a tag is not a pin here.
                    type: string
                  integrationNamespaces:
                    description: |-
                      Namespaces, besides the agent's own, whose axera-integration-sa may exec into the capture
                      sidecar (RoleBinding axera-capture-exec-agent). Set it to the namespace of a central Axera that was
                      NOT installed by this operator on the same cluster (e.g. a Helm install in axera-central):
                      that platform captures with the token it registered for this cluster. A central Axera CR on
                      the same cluster is added automatically. Read by AxeraForce only.
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                type: object
              clusterName:
                description: Identity of THIS cluster (flow ClusterName + default
                  topics).
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                type: string
              clusterPublicIP:
                description: |-
                  This cluster's own public/egress IP as a /32 (multi_cluster_division self-label).
                  Only meaningful when multiCluster is set.
                pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/32$
                type: string
              createSCC:
                default: true
                description: |-
                  Create the OpenShift SecurityContextConstraints (privileged + hostNetwork).
                  Disable on vanilla Kubernetes or if a cluster admin pre-creates it. It does not
                  choose the flow pipeline's CNI: with flow.ingress on, FLP always declares
                  OVN-Kubernetes (kubeConfig.managedCNI [ovn], which indexes each node's ovn-k8s-mp0
                  address as that node, so a hostNetwork router's or the kubelet's pod-bound traffic
                  reads as node-sourced); on another CNI that index finds nothing.
                type: boolean
              extraLocalNetworkCIDRs:
                description: |-
                  Additional on-prem / corporate network CIDRs, beyond localNetworkCIDR, that
                  must also carry the LocalNetwork enrichment label. Every listed range counts
                  as internal (not egress) — same label as localNetworkCIDR, just more ranges.
                  Mirrors extraPodCIDRs for the pod network; use it to add e.g. a second
                  RFC1918 block such as 172.16.0.0/12 alongside 10.0.0.0/8.
                items:
                  type: string
                type: array
              extraPodCIDRs:
                description: |-
                  Additional in-cluster pod/service CIDRs to also label as ClusterSubnet, for when
                  the cluster's pod network was WIDENED / a second range was added after install.
                  Each is appended to the FLP ClusterSubnet enrichment alongside podCIDR; a flow
                  whose endpoint isn't in any ClusterSubnet is treated as leaving the cluster.
                items:
                  type: string
                type: array
              flow:
                description: Flow-specific knobs.
                properties:
                  direction:
                    default: both
                    description: 'Capture direction: ingress | egress | both.'
                    enum:
                    - ingress
                    - egress
                    - both
                    type: string
                  dnsTopic:
                    description: |-
                      Kafka topic for the DNS records when dnsVisibility is on.
                      Defaults to "<clusterName>-dns".
                    type: string
                  dnsVisibility:
                    default: false
                    description: |-
                      DNS VISIBILITY — OFF by default, and deliberately separate from
                      enableDnsTracking. enableDnsTracking only tells the eBPF agent to parse DNS;
                      this switch is what actually carries those records through the pipeline and
                      ships them to their own Kafka topic for the DNS screens.

                      It costs real resources: every DNS query/response becomes a record that the
                      east-west flow lane does not carry (it excludes UDP 53/5353), so the agent, the
                      pipeline and the broker all carry extra volume on a busy cluster. Turn it on when
                      you want name-level visibility, not by default.

                      Requires enableDnsTracking to remain true — with DNS parsing off there is
                      nothing for this branch to ship.
                    type: boolean
                  enableDnsTracking:
                    default: true
                    type: boolean
                  enablePktDrops:
                    default: false
                    description: |-
                      Packet-drop tracking (the kernel's skb:kfree_skb tracepoint). On: the ingress lane's records
                      (flow.ingress) carry what the kernel dropped of each flow and why (pkt_drop_packets,
                      pkt_drop_bytes, pkt_drop_cause), so an inbound attempt a NetworkPolicy refused shows up
                      there; the other lanes do not carry the drop fields. Off by default.
                      Needs Linux 5.14 or newer on every node the agent runs on: below that (and on real-time
                      kernels before 5.14.0-292) the hook is skipped, and where the tracepoint should exist but
                      cannot be attached the eBPF agent fails to start, so check the nodes' kernel first. Changing
                      it rolls the agent pods.
                    type: boolean
                  enablePktTranslation:
                    default: true
                    type: boolean
                  enableRtt:
                    default: true
                    type: boolean
                  excludeInterfaces:
                    default: lo
                    description: Interfaces to exclude from capture.
                    type: string
                  externalTopic:
                    default: external-flows
                    description: External / egress-flow topic (FLP `out3`).
                    type: string
                  ingress:
                    description: |-
                      North-south ingress lane: records whose destination is in the cluster (a pod, a node,
                      a DNATed Service VIP, an ingressVipCIDRs address) and whose source is not a pod —
                      clients behind load balancers, external IPs, NodePorts, hostPorts and the router — go
                      through their own FLP branch (cluster_in_ingress → out5) to their own topic, which
                      Radar reads through the platform's kafka.ingressTopics. The lane keeps TCP, UDP and
                      ICMP echo requests whatever udp says. OFF by default: flowlogs-pipeline never creates a
                      topic, so create it on the broker first, with WRITE for the agent's Kafka user and READ
                      for Radar's consumer group (the FLP writer is synchronous, so a missing topic or ACL
                      can hold back the other flow lanes too). The lane needs a flowlogs-pipeline with
                      with()/without() in keepEntryQuery (v1.9.0 or later): enabling it while images.flp is
                      the Axera rebuild (axera-flowlogs-pipeline:v1) or a flowlogs-pipeline tagged below
                      v1.9 fails the render.
                    properties:
                      enabled:
                        default: false
                        description: Ship the ingress lane. Default false.
                        type: boolean
                      topic:
                        default: ingress-flows
                        description: |-
                          Kafka topic of the ingress lane (FLP out5). It must already exist on the broker and
                          differ from every other topic the agent writes.
                        maxLength: 249
                        minLength: 1
                        pattern: ^[a-zA-Z0-9._-]+$
                        type: string
                    type: object
                  ingressVipCIDRs:
                    description: |-
                      Ingress VIP CIDRs for the ingress lane, rendered as the FIRST FLP subnet label
                      (IngressVip) when ingress.enabled is true; ignored while the lane is off. List the
                      addresses FLP cannot attribute to a pod, node or Service ClusterIP that clients enter
                      through: an OpenShift IPI ingress VIP (bare metal, vSphere, Nutanix, OpenStack —
                      `oc get infrastructure cluster -o jsonpath='{.status.platformStatus}'` lists its
                      ingressIPs) and, unless enablePktTranslation is on, a MetalLB or kube-vip LoadBalancer
                      pool, Service externalIPs, or a cloud balancer that delivers to its frontend IP. A
                      client → VIP record reaches the ingress lane only through this label. It heads the
                      list because FLP labels an address with the first matching entry, and an IPI VIP lies
                      in the machine network (localNetworkCIDR).
                    items:
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                      type: string
                    type: array
                  topic:
                    description: Per-cluster flow topic (FLP `out`). Defaults to clusterName.
                    type: string
                  udp:
                    default: true
                    description: |-
                      UDP flows — ON by default. East-west UDP (except DNS 53/5353, which dnsVisibility carries)
                      and all UDP on the external and intercluster lanes reach Radar, so policy generation sees
                      UDP services. false keeps the flow lanes TCP-only: less Kafka and Radar volume, but UDP
                      services never appear and generated policies cannot open their ports.
                    type: boolean
                type: object
              images:
                description: Container images (four containers + init).
                properties:
                  ebpfAgent:
                    default: quay.io/netobserv/netobserv-ebpf-agent:v1.11.3-community
                    type: string
                  flp:
                    default: quay.io/netobserv/flowlogs-pipeline:v1.11.5-community
                    description: |-
                      OneBox needs a SASL-capable FLP (the community build; the Axera rebuild lacks
                      the kafka `sasl` encoder field).
                    type: string
                  shipper:
                    default: quay.io/axera/fluent-bit:4.2.8
                    description: |-
                      fluent-bit shipper image (classic config). 4.2.8 is the validated baseline:
                      3.1.9 failed SCRAM-SHA-512 logins against some brokers.
                    type: string
                  tetragon:
                    default: quay.io/cilium/tetragon:v1.7.1
                    description: |-
                      Tetragon image for the btf-check init container and the tetragon container.
                      v1.7.1 is the validated baseline; v1.4.0 also works with the selector-less
                      TracingPolicy (rollback). The API server stores this default in a CR that has an
                      images block, so such a CR keeps the image it holds until this field is changed or
                      removed: editing other fields of the CR does not change it.
                    type: string
                type: object
              kafka:
                description: |-
                  SHARED central Kafka for BOTH writers (flow FLP + process shipper). One broker,
                  one credential set — the OneBox invariant.
                properties:
                  bootstrapServers:
                    description: |-
                      The central Kafka the agent produces to: one host:port, or a comma-separated host:port
                      list. The fluent-bit shipper (process lane) is given the whole list. flowlogs-pipeline
                      (flow lanes) takes ONE address and panics at start on a list, so it is given only the
                      FIRST entry and finds the other brokers through that broker's metadata: list first a
                      broker (or a bootstrap name that resolves to every broker) that is always reachable.
                    minLength: 1
                    type: string
                  caCert:
                    description: |-
                      Broker CA certificate (PEM) for TLS trust. Rendered into the agent's kafka
                      Secret and referenced by the writers' caCertPath / ssl.ca.location.
                    type: string
                  compression:
                    description: |-
                      Producer compression of every writer of the agent: flowlogs-pipeline
                      (encode.kafka.compression) and the fluent-bit shipper (rdkafka.compression.codec).
                      none | gzip | snappy | lz4 | zstd. Unset: lz4. Radar's consumers decompress every codec.
                      flowlogs-pipeline parses its config strictly and knows the setting from v1.11.4 on: with
                      an older FLP image, or the Axera rebuild (axera-flowlogs-pipeline:v1, AxeraFlow's default),
                      the unset default leaves the flow writers uncompressed and an explicit codec other than
                      none fails the render. zstd on the shipper needs a fluent-bit built with libzstd.

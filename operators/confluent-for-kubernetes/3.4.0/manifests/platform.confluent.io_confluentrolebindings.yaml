apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    platform.confluent.io/app-version: 3.4.0
    platform.confluent.io/chart-version: v0.2038.1
  creationTimestamp: null
  name: confluentrolebindings.platform.confluent.io
spec:
  group: platform.confluent.io
  names:
    categories:
      - all
      - confluent-platform
      - confluent
    kind: ConfluentRolebinding
    listKind: ConfluentRolebindingList
    plural: confluentrolebindings
    shortNames:
      - cfrb
      - confluentrolebinding
    singular: confluentrolebinding
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.state
          name: Status
          type: string
        - jsonPath: .status.kafkaClusterID
          name: KafkaClusterID
          type: string
        - jsonPath: .status.principal
          name: Principal
          type: string
        - jsonPath: .status.role
          name: Role
          type: string
        - jsonPath: .status.kafkaRestClass
          name: KafkaRestClass
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - jsonPath: .status.kafkaCluster
          name: KafkaCluster
          priority: 1
          type: string
        - jsonPath: .status.clusterRegistryName
          name: ClusterRegistryName
          priority: 1
          type: string
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: ConfluentRolebinding is the schema for the ConfluentRolebinding API.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of the ConfluentRolebinding.
              properties:
                clustersScopeByIds:
                  description: |-
                    clustersScopeByIds specify the scope of the Confluent component cluster(s) via cluster id(s).
                    When kafkaClusterId is the logical cluster id of a LogicalKafkaCluster in the rolebinding's
                    namespace, that LogicalKafkaCluster owns the rolebinding, as it owns one that names it
                    through kafkaClusterRef, and deleting the LogicalKafkaCluster deletes the rolebinding.
                  properties:
                    cmfId:
                      description: cmfId specifies the CMF(Confluent Manager for apache Flink) id.
                      minLength: 1
                      type: string
                    connectClusterId:
                      description: connectClusterId specifies the Connect cluster id.
                      minLength: 1
                      type: string
                    flinkEnvironmentId:
                      description: FlinkEnvironmentId specifies the Flink Environment id.
                      minLength: 1
                      type: string
                    kafkaClusterId:
                      description: kafkaClusterId specifies the id of the Kafka cluster id.
                      minLength: 1
                      type: string
                    ksqlClusterId:
                      description: ksqlClusterId specifies the ksqlDB cluster id.
                      minLength: 1
                      type: string
                    schemaRegistryClusterId:
                      description: schemaRegistryClusterId specifies the Schema Registry cluster id.
                      minLength: 1
                      type: string
                  type: object
                clustersScopeByRegistryName:
                  description: clustersScopeByRegistryName specifies the unique cluster name you registered in the cluster registry.
                  minLength: 1
                  type: string
                kafkaClusterRef:
                  description: |-
                    kafkaClusterRef references the cluster this rolebinding is scoped to. When its
                    kind is `LogicalKafkaCluster`, the rolebinding is scoped to that tenant (logical
                    cluster) of a multi-tenant Kafka: the reconciler resolves the referenced
                    LogicalKafkaCluster to its logical cluster id and uses that as the Kafka cluster
                    scope, removing the need to hand-write the generated lkc-id in clustersScopeByIds.
                    The MDS endpoint is still resolved through kafkaRestClassRef. When unset (or kind
                    `Kafka`), behavior is unchanged.

                    It supplies the Kafka cluster scope, so it cannot be combined with
                    clustersScopeByRegistryName, clustersScopeByIds.cmfId or
                    clustersScopeByIds.kafkaClusterId. It can be combined with the remaining entries of
                    clustersScopeByIds - schemaRegistryClusterId, ksqlClusterId, connectClusterId and
                    flinkEnvironmentId - which MDS identifies relative to the Kafka cluster in scope.
                  properties:
                    kind:
                      description: |-
                        kind selects which kind of cluster this reference resolves to. The only
                        permitted values are `Kafka` and `LogicalKafkaCluster`.

                        The field is optional and exists only to break a name collision. When it is
                        unset, both a `Kafka` and a `LogicalKafkaCluster` of the given name are looked
                        for in the given namespace: exactly one match resolves the reference, no match
                        is rejected as an unknown cluster reference, and a name that matches both is
                        rejected as ambiguous, asking for `kind` to be set.

                        Day1ClusterRef is shared by many references, but this field is honored
                        only for `KafkaTopic.spec.kafkaClusterRef` and
                        `ConfluentRolebinding.spec.kafkaClusterRef` today, where
                        `LogicalKafkaCluster` targets a tenant (logical cluster) of a
                        multi-tenant Kafka. Every other reference that embeds Day1ClusterRef
                        (for example `schemaRegistryClusterRef` or `connectClusterRef`) ignores
                        this field and always resolves to its own component's cluster type.
                      enum:
                        - Kafka
                        - LogicalKafkaCluster
                      type: string
                    name:
                      description: name specifies the name of the Confluent Platform component cluster.
                      type: string
                    namespace:
                      description: namespace specifies the namespace where the Confluent Platform component cluster is running.
                      type: string
                  required:
                    - name
                  type: object
                kafkaRestClassRef:
                  description: kafkaRestClassRef references the KafkaRestClass that defines the Kafka REST API connection information.
                  properties:
                    name:
                      description: name specifies the name of the KafkaRestClass application resource.
                      minLength: 1
                      type: string
                    namespace:
                      description: namespace specifies the namespace of the KafkaRestClass.
                      type: string
                  required:
                    - name
                  type: object
                principal:
                  description: RolebindingPrincipal defines the principal(user/group) the rolebinding belongs to.
                  properties:
                    name:
                      description: name specifies the name of the principal.
                      minLength: 1
                      type: string
                    type:
                      description: type specifies the type of the principal. Valid options are `user` and `group`.
                      enum:
                        - user
                        - group
                      type: string
                  required:
                    - name
                    - type
                  type: object
                resourcePatterns:
                  description: resourcePatterns specify the qualified resources associated with this rolebinding.
                  items:
                    description: ResourcePattern specifies the qualified resource info associated with this rolebinding.
                    properties:
                      name:
                        description: name specifies the name of the resource associated with this rolebinding.
                        minLength: 1
                        type: string
                      patternType:
                        description: |-
                          patternType specifies the pattern of the resource. Valid options are
                          `PREFIXED` or `LITERAL`. The default value is `LITERAL`.
                        enum:
                          - PREFIXED
                          - LITERAL
                        type: string
                      resourceType:
                        description: |-
                          resourceType refers to the type of the resource.
                          Valid options are `Topic`, `Group`, `Subject`, `KsqlCluster`, `Cluster`, `TransactionalId`, `FlinkEnvironment`, `FlinkApplication` etc.
                        minLength: 1
                        type: string
                    required:
                      - name
                      - resourceType
                    type: object
                  type: array
                role:
                  description: role specifies the name of the role.
                  minLength: 1
                  type: string
              required:
                - principal
                - role
              type: object
              x-kubernetes-validations:
                - message: 'kafkaClusterRef and clustersScopeByRegistryName cannot both be set: a cluster registry name selects the whole scope, leaving the referenced cluster with no effect'
                  rule: '!has(self.kafkaClusterRef) || !has(self.clustersScopeByRegistryName)'
                - message: 'kafkaClusterRef and clustersScopeByIds.cmfId cannot both be set: a CMF scope replaces the Kafka cluster scope, leaving the referenced cluster with no effect'
                  rule: '!has(self.kafkaClusterRef) || !has(self.clustersScopeByIds) || !has(self.clustersScopeByIds.cmfId)'
                - message: 'kafkaClusterRef and clustersScopeByIds.kafkaClusterId cannot both be set: both declare the Kafka cluster scope, so set exactly one'
                  rule: '!has(self.kafkaClusterRef) || !has(self.clustersScopeByIds) || !has(self.clustersScopeByIds.kafkaClusterId)'
            status:
              description: status is the observed state of the ConfluentRolebinding.
              properties:
                appState:
                  default: Unknown
                  description: appState is the current state of the rolebinding application.
                  enum:
                    - Unknown
                    - Created
                    - Failed
                    - Deleted
                  type: string
                clusterRegistryName:
                  description: clusterRegistryName is the cluster registry name the rolebinding associated with.
                  type: string
                clustersScope:
                  description: |-
                    clustersScope is the cluster-id scope (clustersScopeByIds) last successfully applied
                    by this rolebinding. It is the immutable-scope baseline and the stable resolved scope
                    used for cross-CR sibling matching. It records only user-declared scope intent, never
                    the discovery-resolved Kafka cluster id.
                  properties:
                    cmfId:
                      description: cmfId specifies the CMF(Confluent Manager for apache Flink) id.
                      minLength: 1
                      type: string
                    connectClusterId:
                      description: connectClusterId specifies the Connect cluster id.
                      minLength: 1
                      type: string
                    flinkEnvironmentId:
                      description: FlinkEnvironmentId specifies the Flink Environment id.
                      minLength: 1
                      type: string
                    kafkaClusterId:
                      description: kafkaClusterId specifies the id of the Kafka cluster id.
                      minLength: 1
                      type: string
                    ksqlClusterId:
                      description: ksqlClusterId specifies the ksqlDB cluster id.
                      minLength: 1
                      type: string
                    schemaRegistryClusterId:
                      description: schemaRegistryClusterId specifies the Schema Registry cluster id.
                      minLength: 1
                      type: string
                  type: object
                conditions:
                  description: conditions are the latest available observations of the rolebinding's state.
                  items:
                    description: Condition represent the latest available observations of the current state.
                    properties:
                      lastProbeTime:
                        description: lastProbeTime shows the last time the condition was evaluated.
                        format: date-time
                        type: string
                      lastTransitionTime:
                        description: lastTransitionTime shows the last time the condition was transitioned from one status to another.
                        format: date-time
                        type: string
                      message:
                        description: message shows a human-readable message with details about the transition.
                        type: string
                      reason:
                        description: reason shows the reason for the last transition of the condition.
                        type: string
                      status:
                        description: status shows the status of the condition, one of `True`, `False`, or `Unknown`.
                        type: string
                      type:
                        description: type shows the condition type.
                        type: string
                    type: object
                  type: array
                kafkaCluster:
                  description: |-
                    kafkaCluster is the cluster the rolebinding belongs to, which is a Kafka or, for a
                    rolebinding scoped to a tenant of a multi-tenant Kafka, a LogicalKafkaCluster. The
                    format is: `<cluster namespace>/<cluster name>`.
                  type: string
                kafkaClusterID:
                  description: kafkaClusterID is the id of the Kafka cluster.
                  type: string
                kafkaRestClass:
                  description: 'kafkaRestClass is the kafkaRestClass this rolebinding uses. The format is: `<kafkaRestClass namespace>/<kafkaRestClass name>`.'
                  type: string
                lastDriftCheckTime:
                  description: |-
                    lastDriftCheckTime is when CFK last compared this rolebinding's live MDS grants against
                    spec (platform.confluent.io/enable-drift-correction). Used to pace live checks to
                    platform.confluent.io/drift-check-interval-seconds instead of every reconcile.
                  format: date-time
                  type: string
                mdsClusterID:
                  description: |-
                    mdsClusterID is the cluster id the MDS at mdsEndpoint reported for itself when the
                    rolebinding was last applied. It identifies the MDS that holds the binding, which is
                    not the cluster the binding is scoped to whenever that is a tenant of a multi-tenant
                    Kafka or a cluster managed through a centralized MDS.
                  type: string
                mdsEndpoint:
                  description: mdsEndpoint is the MDS endpoint.
                  type: string
                observedGeneration:
                  description: observedGeneration is the most recent generation observed for this Confluent component.
                  format: int64
                  type: integer
                principal:
                  description: 'principal is the principal the rolebinding belongs to. The format is: `<principal type>:<principal name>`.'
                  type: string
                resolvedClusterRef:
                  description: |-
                    resolvedClusterRef is the cluster spec.kafkaClusterRef was bound to. From then on it
                    is what identifies the cluster this rolebinding is scoped to, including while the
                    rolebinding is being deleted and the cluster may already be gone. It is unset for a
                    rolebinding that names no cluster through spec.kafkaClusterRef.
                  properties:
                    kind:
                      description: 'kind is the kind the reference resolved to: `Kafka` or `LogicalKafkaCluster`.'
                      enum:
                        - Kafka
                        - LogicalKafkaCluster
                      type: string
                    name:
                      description: name is the name of the cluster the reference resolved to.
                      type: string
                    namespace:
                      description: |-
                        namespace is the namespace the resolved cluster is running in. It is the
                        reference's own namespace when it sets one, otherwise the namespace of the
                        application resource that holds the reference.
                      type: string
                  type: object
                resourcePatterns:
                  description: resourcePatterns are the resource patterns this rolebinding is associated with.
                  items:
                    description: ResourcePattern specifies the qualified resource info associated with this rolebinding.
                    properties:
                      name:
                        description: name specifies the name of the resource associated with this rolebinding.
                        minLength: 1
                        type: string
                      patternType:
                        description: |-
                          patternType specifies the pattern of the resource. Valid options are
                          `PREFIXED` or `LITERAL`. The default value is `LITERAL`.
                        enum:
                          - PREFIXED
                          - LITERAL
                        type: string
                      resourceType:
                        description: |-
                          resourceType refers to the type of the resource.
                          Valid options are `Topic`, `Group`, `Subject`, `KsqlCluster`, `Cluster`, `TransactionalId`, `FlinkEnvironment`, `FlinkApplication` etc.
                        minLength: 1
                        type: string
                    required:
                      - name
                      - resourceType
                    type: object
                  type: array
                role:
                  description: role is the role this rolebinding is associated with.
                  type: string
                roleLevel:
                  description: |-
                    roleLevel records whether the binding CFK manages for this rolebinding is a role-level
                    (pattern-less) binding. It is the durable classifier that distinguishes a binding created
                    role-level from a resource-scoped binding whose resourcePatterns were all removed, so a
                    remove-all is never re-interpreted as a role-level grant on a later reconcile. It is a
                    pointer so the operator can tell "explicitly classified" from "never set": a nil value means
                    the rolebinding was last written by an operator that predates this field (pre-upgrade), where
                    a pattern-less binding is treated as role-level so a legacy role-level grant is revoked on
                    delete rather than orphaned.
                  type: boolean
                state:
                  description: state is the state of this rolebinding.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

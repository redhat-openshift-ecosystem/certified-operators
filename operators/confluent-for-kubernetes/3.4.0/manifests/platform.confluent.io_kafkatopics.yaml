apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    platform.confluent.io/app-version: 3.4.0
    platform.confluent.io/chart-version: v0.2038.1
  creationTimestamp: null
  name: kafkatopics.platform.confluent.io
spec:
  group: platform.confluent.io
  names:
    categories:
      - all
      - confluent-platform
      - confluent
    kind: KafkaTopic
    listKind: KafkaTopicList
    plural: kafkatopics
    shortNames:
      - kt
      - topic
    singular: kafkatopic
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.replicas
          name: Replicas
          type: string
        - jsonPath: .status.partitionCount
          name: Partition
          type: string
        - jsonPath: .status.state
          name: Status
          type: string
        - jsonPath: .status.kafkaClusterID
          name: ClusterID
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - jsonPath: .status.kafkaCluster
          name: KafkaCluster
          priority: 1
          type: string
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: KafkaTopic is the schema for the Kafka Topic API.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of the KafkaTopic.
              properties:
                configs:
                  additionalProperties:
                    type: string
                  description: |-
                    configs is a map of string key and value pairs that are used to pass the configuration settings for the topic.
                    More info: https://docs.confluent.io/current/installation/configuration/topic-configs.html.
                  type: object
                  x-kubernetes-map-type: granular
                kafkaClusterRef:
                  description: kafkaClusterRef specifies the name of the Kafka cluster.
                  properties:
                    kind:
                      description: |-
                        kind selects which kind of cluster this reference resolves to. The only
                        permitted values are `Kafka` and `LogicalKafkaCluster`.

                        The field is optional and exists only to break a name collision. When it is
                        unset, both a `Kafka` and a `LogicalKafkaCluster` of the given name are looked
                        for in the given namespace: exactly one match resolves the reference, no match
                        is rejected as an unknown cluster reference, and a name that matches both is
                        rejected as ambiguous, asking for `kind` to be set.

                        Day1ClusterRef is shared by many references, but this field is honored
                        only for `KafkaTopic.spec.kafkaClusterRef` and
                        `ConfluentRolebinding.spec.kafkaClusterRef` today, where
                        `LogicalKafkaCluster` targets a tenant (logical cluster) of a
                        multi-tenant Kafka. Every other reference that embeds Day1ClusterRef
                        (for example `schemaRegistryClusterRef` or `connectClusterRef`) ignores
                        this field and always resolves to its own component's cluster type.
                      enum:
                        - Kafka
                        - LogicalKafkaCluster
                      type: string
                    name:
                      description: name specifies the name of the Confluent Platform component cluster.
                      type: string
                    namespace:
                      description: namespace specifies the namespace where the Confluent Platform component cluster is running.
                      type: string
                  required:
                    - name
                  type: object
                kafkaRest:
                  description: kafkaRest specifies the Kafka REST API configuration.
                  properties:
                    authentication:
                      description: authentication specifies the REST API authentication mechanism.
                      properties:
                        basic:
                          description: basic specifies the basic authentication settings for the REST API client.
                          properties:
                            debug:
                              description: debug enables the basic authentication debug logs for JaaS configuration.
                              type: boolean
                            directoryPathInContainer:
                              description: |-
                                directoryPathInContainer allows to pass the basic credential through a directory path in the container.
                                More info: https://docs.confluent.io/operator/current/co-authenticate.html#basic-authentication
                              minLength: 1
                              type: string
                            ignoreRoles:
                              description: |-
                                IgnoreRoles specifies whether to ignore the roles specified in the basic authentication.
                                The default value is `false`.
                              type: boolean
                            restrictedRoles:
                              description: |-
                                restrictedRoles specify the restricted roles on the server side only.
                                Changes will be only reflected in Control Center.
                                This configuration is ignored on the client side configuration.
                              items:
                                type: string
                              minItems: 1
                              type: array
                            roles:
                              description: |-
                                roles specify the roles on the server side only.
                                This configuration is ignored on the client side configuration.
                              items:
                                type: string
                              type: array
                            secretRef:
                              description: |-
                                secretRef defines secret reference to pass the required credentials.
                                More info: https://docs.confluent.io/operator/current/co-authenticate.html#basic-authentication
                              maxLength: 30
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                          type: object
                        bearer:
                          description: bearer specifies the bearer authentication settings for the REST API client.
                          properties:
                            directoryPathInContainer:
                              description: |-
                                directoryPathInContainer specifies the directory path in the container
                                where the credential is mounted.
                              minLength: 1
                              type: string
                            secretRef:
                              description: |-
                                secretRef specifies the name of the secret that contains the credential.
                                More info: https://docs.confluent.io/operator/current/co-authenticate.html#bearer-authentication
                              maxLength: 30
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                          type: object
                        oauth:
                          description: oauth specifies the OAuth authentication settings for the REST API client.
                          properties:
                            configuration:
                              description: configuration specifies the OAuth server settings.
                              properties:
                                audience:
                                  description: audience specifies the audience claim in the JWT payload.
                                  minLength: 1
                                  type: string
                                clientAssertion:
                                  description: clientAssertion specifies the client assertion settings for OAuth token retrieval
                                  properties:
                                    clientId:
                                      description: clientId specifies the clientId to be passed in the jaas configs
                                      minLength: 1
                                      type: string
                                    jwtTokenFile:
                                      description: jwtTokenFile specifies the file containing the JWT token
                                      properties:
                                        directoryPathInContainer:
                                          description: |-
                                            directoryPathInContainer specifies the directory path in the container where
                                            the JWT token file is mounted
                                          minLength: 1
                                          type: string
                                        secretRef:
                                          description: secretRef references the secret containing the JWT token file
                                          maxLength: 30
                                          minLength: 1
                                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                          type: string
                                      type: object
                                    localClientAssertion:
                                      description: |-
                                        localClientAssertion specifies the local client assertion settings using private key file
                                        for OAuth token retrieval
                                      properties:
                                        audience:
                                          description: audience specifies the audience claim in the JWT
                                          minLength: 1
                                          type: string
                                        includeJtiClaim:
                                          description: includeJtiClaim specifies whether to include the JTI claim in the JWT
                                          type: boolean
                                        includeNbfClaim:
                                          description: nbfClaim specifies the not-before claim in the JWT
                                          type: boolean
                                        issuer:
                                          description: issuer specifies the issuer claim in the JWT
                                          minLength: 1
                                          type: string
                                        privateKeyFile:
                                          description: privateKeyFile specifies the private key file configurations for signing the JWT
                                          properties:
                                            directoryPathInContainer:
                                              description: |-
                                                directoryPathInContainer specifies the directory path in the container where
                                                the private key file is mounted with the name private-key
                                              minLength: 1
                                              type: string
                                            encryptedPrivateKey:
                                              description: |-
                                                encryptedPrivateKey boolean value indicating whether the private key is encrypted using a passphrase or not. If true, cfk
                                                operator will look for private-key-passphrase file containing key: value pair with key as privateKeyPassphrase and
                                                value as the passphrase in the same secret/directory as the private key file.
                                              type: boolean
                                            includeAssertionTemplate:
                                              description: |-
                                                includeAssertionTemplate boolean value indicating whether to include additional header and payload claims
                                                in the client assertion or not. If true, cfk
                                                operator will look for assertion-template.json file in the same secret/directory as the private key file.
                                              type: boolean
                                            secretRef:
                                              description: secretRef references the secret containing the private key file with the name private-key
                                              maxLength: 30
                                              minLength: 1
                                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                              type: string
                                          type: object
                                        subject:
                                          description: subject specifies the subject claim in the JWT
                                          minLength: 1
                                          type: string
                                        tokenLifetime:
                                          description: tokenLifetime specifies the lifetime of the token
                                          format: int32
                                          type: integer
                                      type: object
                                  type: object
                                expectedIssuer:
                                  description: expectedIssuer specifies the expected issuer in the JWT payload.
                                  minLength: 1
                                  type: string
                                groupsClaimName:
                                  description: groupsClaimName specifies the name of claim in token for identifying the groups of subject in the JWT payload.
                                  minLength: 1
                                  type: string
                                jwksEndpointUri:
                                  description: |-
                                    jwksEndpointUri specifies the uri for the JSON Web Key Set (JWKS).
                                    It is used to get set of keys containing the public keys used to verify any JWT issued by the IdP's Authorization Server.
                                  minLength: 1
                                  type: string
                                loginConnectTimeoutMs:
                                  description: LoginConnectTimeoutMs sets connect timeout with IDP in ms
                                  format: int32
                                  type: integer
                                loginReadTimeoutMs:
                                  description: LoginReadTimeoutMs sets read timeout with IDP in ms
                                  format: int32
                                  type: integer
                                loginRetryBackoffMaxMs:
                                  description: LoginRetryBackoffMaxMs sets max retry backoff with IDP in ms
                                  format: int32
                                  type: integer
                                loginRetryBackoffMs:
                                  description: LoginRetryBackoffMs sets retry backoff with IDP in ms
                                  format: int32
                                  type: integer
                                scope:
                                  description: |-
                                    scope is optional and required only when your identity provider doesn't have
                                    a default scope or your groups claim is linked to a scope.
                                  minLength: 1
                                  type: string
                                subClaimName:
                                  description: subClaimName specifies name of claim in JWT to use for the subject.
                                  minLength: 1
                                  type: string
                                tokenEndpointUri:
                                  description: |-
                                    tokenBaseEndpointUri specifies the base uri for token endpoint.
                                    This is required for OAuth for inter broker communication along with
                                    clientId & clientSecret in JassConfig or JassConfigPassthrough
                                  minLength: 1
                                  type: string
                              type: object
                            directoryPathInContainer:
                              description: directoryPathInContainer allows to pass the basic credential through a directory path in the container.
                              minLength: 1
                              type: string
                            secretRef:
                              description: secretRef defines secret reference to pass the required credentials.
                              maxLength: 30
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                          required:
                            - configuration
                          type: object
                        sslClientAuthentication:
                          description: sslClientAuthentication enables the clients side mtls for the REST API client.
                          type: boolean
                        type:
                          description: type specifies the REST API authentication type. Valid options are `basic`, `bearer`, `mtls` and `oauth`.
                          enum:
                            - basic
                            - bearer
                            - mtls
                            - oauth
                          type: string
                      required:
                        - type
                      type: object
                    endpoint:
                      description: endpoint specifies where Confluent REST API is running.
                      minLength: 1
                      pattern: ^https?://.*
                      type: string
                    kafkaClusterID:
                      description: |-
                        kafkaClusterID specifies the id of Kafka cluster.
                        It takes precedence over using the Kafka REST API to get the cluster id.
                      minLength: 1
                      type: string
                    tls:
                      description: "tls specifies the custom TLS structure for the application resources,\n\t// e.g. connector, topic, schema, of the Confluent Platform components.\n\t// +optional"
                      properties:
                        directoryPathInContainer:
                          description: |-
                            directoryPathInContainer contains the directory path in the container where
                            `keystore.jks`, `truststore.jks`, `jksPassword.txt` keys are mounted.
                          minLength: 1
                          type: string
                        jksPassword:
                          description: jksPassword specifies the secret name that contains the JKS password.
                          properties:
                            secretRef:
                              description: |-
                                secretRef references the name of the secret containing the JKS password.
                                More info: https://docs.confluent.io/operator/current/co-network-encryption.html#configure-user-provided-tls-certificates
                              maxLength: 30
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                          required:
                            - secretRef
                          type: object
                        secretRef:
                          description: |-
                            secretRef specifies the secret name that contains the certificates.
                            More info about certificates key/value format: https://docs.confluent.io/operator/current/co-network-encryption.html#configure-user-provided-tls-certificates
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      type: object
                  type: object
                kafkaRestClassRef:
                  description: kafkaRestClassRef references the KafkaRestClass which defines Kafka REST API connection information.
                  properties:
                    name:
                      description: name specifies the name of the KafkaRestClass application resource.
                      minLength: 1
                      type: string
                    namespace:
                      description: namespace specifies the namespace of the KafkaRestClass.
                      type: string
                  required:
                    - name
                  type: object
                name:
                  description: |-
                    name specifies the topic name. If not configured, the KafkaTopic CR name is used
                    as the topic name.
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9\._\-]*$
                  type: string
                partitionCount:
                  description: |-
                    partitionCount specifies the number of partitions for the topic.
                    If not configured, it will be defaulted to the partition count that Kafka REST V3 API supports.
                  format: int32
                  type: integer
                replicas:
                  description: |-
                    replicas specifies the replication factor for the topic.
                    If not configured, it will be defaulted to the replication factor that Kafka REST V3 API supports.
                  format: int32
                  type: integer
              type: object
            status:
              description: status defines the observed state of the KafkaTopic.
              properties:
                appState:
                  default: Unknown
                  description: appState is the current state of the topic application.
                  enum:
                    - Unknown
                    - Created
                    - Failed
                    - Deleted
                  type: string
                appliedConfigs:
                  additionalProperties:
                    type: string
                  description: |-
                    appliedConfigs is the set of topic config keys/values CFK applied on the broker as of
                    the last successful reconcile. It is the baseline used to detect a key removed from
                    spec.configs, so it can be reset to its broker default instead of being orphaned.
                  type: object
                conditions:
                  description: conditions are the latest available observed states of the topic.
                  items:
                    description: Condition represent the latest available observations of the current state.
                    properties:
                      lastProbeTime:
                        description: lastProbeTime shows the last time the condition was evaluated.
                        format: date-time
                        type: string
                      lastTransitionTime:
                        description: lastTransitionTime shows the last time the condition was transitioned from one status to another.
                        format: date-time
                        type: string
                      message:
                        description: message shows a human-readable message with details about the transition.
                        type: string
                      reason:
                        description: reason shows the reason for the last transition of the condition.
                        type: string
                      status:
                        description: status shows the status of the condition, one of `True`, `False`, or `Unknown`.
                        type: string
                      type:
                        description: type shows the condition type.
                        type: string
                    type: object
                  type: array
                kafkaCluster:
                  type: string
                kafkaClusterID:
                  description: kafkaClusterID is the id of the Kafka cluster.
                  type: string
                kafkaRestEndpoint:
                  description: kafkaRestEndpoint is the endpoint of the Kafka REST API.
                  type: string
                lastDriftCheckTime:
                  description: |-
                    lastDriftCheckTime is when CFK last compared the topic's live broker configs against
                    spec.configs (platform.confluent.io/enable-drift-correction). Used to pace live checks
                    to platform.confluent.io/drift-check-interval-seconds instead of every reconcile.
                  format: date-time
                  type: string
                observedGeneration:
                  description: observedGeneration is the most recent generation observed for this Confluent component.
                  format: int64
                  type: integer
                partitionCount:
                  description: partitionCount is the partition count of the topic.
                  format: int32
                  type: integer
                replicas:
                  description: replicas is the replication factor of the topic.
                  format: int32
                  type: integer
                replicationFactorChange:
                  description: |-
                    ReplicationFactorChange surfaces progress of an in-flight or completed
                    replication-factor change driven through spec.replicas.
                  properties:
                    action:
                      description: |-
                        Action is the SBC operation State refers to (Change or Cancellation). It is what
                        distinguishes a completed change (reached target) from a completed cancellation
                        (stopped before target), which share State=Completed.
                      enum:
                        - Change
                        - Cancellation
                      type: string
                    errorCode:
                      description: |-
                        ErrorCode is SBC's error_code for a Failed state (0 when none). It is the durable
                        signal for whether a failure is retryable: CFK re-drives most Failed changes, but a
                        non-retryable code (invalid RF, insufficient brokers) is terminal. Persisting it,
                        rather than only the human-readable errorMsg, lets an operator (and CFK) reason about
                        the failure without parsing prose.
                      format: int32
                      type: integer
                    history:
                      description: History is a capped, append-only record of state transitions (max 50 entries, enforced in controller code).
                      items:
                        description: ReplicationFactorChangeHistoryEntry is one recorded state transition.
                        properties:
                          action:
                            description: |-
                              Action is the SBC operation this entry's State refers to (Change or Cancellation),
                              recorded so history reads unambiguously — a Completed line is a reached-target change
                              or a settled cancellation depending on this field.
                            enum:
                              - Change
                              - Cancellation
                            type: string
                          errorCode:
                            description: ErrorCode is SBC's error_code for a Failed entry (0 when none).
                            format: int32
                            type: integer
                          errorMsg:
                            type: string
                          reason:
                            description: |-
                              Reason is a human-readable explanation for a transition SBC's state doesn't convey on
                              its own — set on a cancellation entry to say why the change was stopped (a user hold or
                              a retarget to a new spec.replicas). Empty for ordinary lifecycle transitions.
                            type: string
                          retryCount:
                            description: |-
                              RetryCount is the number of transient-failure retries that accrued while the change
                              sat in THIS entry's state, before it transitioned out. Scoping it per entry (rather
                              than only as a single status-wide counter) makes it clear which state the retries
                              happened in — e.g. a Failed entry carrying retryCount=8.
                            format: int32
                            type: integer
                          state:
                            description: |-
                              ReplicationFactorChangeState is the lifecycle state of an RF change. Pending, InProgress,
                              Completed and Failed mirror SBC's wire states 1:1 — CFK persists SBC's state verbatim and
                              adds no state of its own. A successful cancellation is reported by SBC as COMPLETED; what
                              distinguishes it from a change that reached its target is the Action field, not the state.
                              So Completed means "the operation finished": for Action=Change it reached the target RF, for
                              Action=Cancellation the change was stopped and the RF stays where it landed. Read State
                              together with Action to know which.
                            enum:
                              - Pending
                              - InProgress
                              - Completed
                              - Failed
                            type: string
                          targetReplicationFactor:
                            format: int32
                            type: integer
                          transitionTime:
                            format: date-time
                            type: string
                        required:
                          - state
                          - targetReplicationFactor
                          - transitionTime
                        type: object
                      type: array
                    lastTransitionTime:
                      description: LastTransitionTime moves only on a real state write, not on every poll.
                      format: date-time
                      type: string
                    retryCount:
                      description: RetryCount counts transient-failure retries for the active target.
                      format: int32
                      type: integer
                    state:
                      description: State is the current lifecycle state of the change, mirrored from SBC.
                      enum:
                        - Pending
                        - InProgress
                        - Completed
                        - Failed
                      type: string
                    targetReplicationFactor:
                      description: |-
                        TargetReplicationFactor is the RF this change is currently driving toward — the
                        value last submitted to SBC, which may lag spec.replicas during a retarget.
                      format: int32
                      type: integer
                  required:
                    - state
                    - targetReplicationFactor
                  type: object
                resolvedClusterRef:
                  description: |-
                    resolvedClusterRef is the cluster spec.kafkaClusterRef was bound to. From then on it
                    is what identifies the cluster hosting this topic, including while the topic is being
                    deleted and the cluster may already be gone. It is unset for a topic that names no
                    cluster through spec.kafkaClusterRef.
                  properties:
                    kind:
                      description: 'kind is the kind the reference resolved to: `Kafka` or `LogicalKafkaCluster`.'
                      enum:
                        - Kafka
                        - LogicalKafkaCluster
                      type: string
                    name:
                      description: name is the name of the cluster the reference resolved to.
                      type: string
                    namespace:
                      description: |-
                        namespace is the namespace the resolved cluster is running in. It is the
                        reference's own namespace when it sets one, otherwise the namespace of the
                        application resource that holds the reference.
                      type: string
                  type: object
                state:
                  description: state is the state of the topic.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

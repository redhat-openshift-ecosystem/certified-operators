              AuthFailureRateThreshold is the percentage threshold (0-100) for the high CSM Authorization failure-rate alert (P4.AUTH.2).
              The value is divided by 100 when substituted into Prometheus expressions.
              This field is only read when set under spec.modules[name=authorization].metrics.prometheusRule.
            displayName: Authorization Failure Rate Threshold
            path: modules[0].metrics.prometheusRule.authFailureRateThreshold
          - description: |-
              AuthLatencyQuantile is the quantile percentage (0-100) used for the high CSM Authorization latency alert (P4.AUTH.7).
              The value is divided by 100 when substituted into Prometheus expressions (e.g., 95 for 95th percentile).
              This field is only read when set under spec.modules[name=authorization].metrics.prometheusRule.
            displayName: Authorization Latency Quantile
            path: modules[0].metrics.prometheusRule.authLatencyQuantile
          - description: |-
              AuthLatencyThresholdSeconds is the latency threshold in seconds for the high CSM Authorization latency alert (P4.AUTH.7).
              This field is only read when set under spec.modules[name=authorization].metrics.prometheusRule.
            displayName: Authorization Latency Threshold Seconds
            path: modules[0].metrics.prometheusRule.authLatencyThresholdSeconds
          - description: |-
              ConnectivitySuccessRatio is the minimum percentage of successful array connectivity checks
              below which the RES-02 CSMResiliencyConnectivityLost alert fires.
              This field is only read when set under spec.modules[name=resiliency].metrics.prometheusRule.
              Setting it under spec.driver.metrics.prometheusRule has no effect on resiliency alerts.
            displayName: Connectivity Success Ratio
            path: modules[0].metrics.prometheusRule.connectivitySuccessRatio
          - description: Enabled creates a PrometheusRule CR for Prometheus Operator
              integration.
            displayName: Module PrometheusRule Enabled
            path: modules[0].metrics.prometheusRule.enabled
          - description: |-
              RPOThresholdSeconds is the replication lag threshold in seconds used by the
              CSMReplicationLagExceeded (REP-01) and CSMReplicationRPOViolation (REP-02) alerts.
              Applies when the CSM Replication module is enabled. Default: 300 (5 minutes).
            displayName: RPO Threshold Seconds
            path: modules[0].metrics.prometheusRule.rpoThresholdSeconds
          - description: |-
              SRDFLagSeconds is the SRDF replication lag threshold in seconds for the
              PowerMaxSRDFLagExceeded (REP-12) alert.
              Applies when the CSM Replication module is enabled with PowerMax SRDF.
              Default: 300 (5 minutes).
            displayName: SRDF Lag Seconds
            path: modules[0].metrics.prometheusRule.srdfLagSeconds
          - description: |-
              SRDFMinBandwidth is the minimum acceptable SRDF replication bandwidth in bytes per second.
              Used by the PowerMaxSRDFBandwidthDegraded (REP-07) alert.
              Applies when the CSM Replication module is enabled with PowerMax SRDF.
              Default: 10485760 (10 MB/s).
            displayName: SRDF Minimum Bandwidth
            path: modules[0].metrics.prometheusRule.srdfMinBandwidth
          - description: ServiceMonitor configures optional Prometheus Operator ServiceMonitor
              creation
            displayName: Module ServiceMonitor Configuration
            path: modules[0].metrics.serviceMonitor
          - description: |-
              Enabled creates a ServiceMonitor CR for Prometheus Operator integration
              Requires the Prometheus Operator CRDs to be installed in the cluster
            displayName: ServiceMonitor Enabled
            path: modules[0].metrics.serviceMonitor.enabled
          - description: |-
              InsecureSkipVerify skips TLS certificate verification when Prometheus scrapes the metrics endpoint
              Only applies when tlsCertSecret is set
            displayName: ServiceMonitor Insecure Skip Verify
            path: modules[0].metrics.serviceMonitor.insecureSkipVerify
          - description: Interval is the Prometheus scrape interval for the metrics
              endpoint
            displayName: ServiceMonitor Scrape Interval
            path: modules[0].metrics.serviceMonitor.interval
          - description: |-
              ScrapeTimeout is the Prometheus scrape timeout for the metrics endpoint
              Default value: "" (unset; Prometheus uses its global scrape_timeout)
            displayName: ServiceMonitor Scrape Timeout
            path: modules[0].metrics.serviceMonitor.scrapeTimeout
          - description: |-
              TLSCertSecret is the name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS
              When set the operator mounts the secret and configures HTTPS automatically
            displayName: Module Metrics TLS Cert Secret
            path: modules[0].metrics.tlsCertSecret
          - description: Name is name of ContainerStorageModule modules
            displayName: Name
            path: modules[0].name
          - description: RetainImageRegistryPath is the boolean flag used to retain
              image registry path
            displayName: Retain Image Registry Path
            path: retainImageRegistryPath
          - description: |-
              Upgrade is the upgrade policy for the CSM CR.
              When set to "auto", the operator will automatically upgrade the CSM resource
              to the latest supported version.
              If the auto upgrade fails, the operator will automatically rollback to the
              previous version.
            displayName: Upgrade Policy
            path: upgrade

        version: v1
  description: "Dell Container Storage Modules (CSM) Operator is a Kubernetes Operator
    which can be used to install and manage Dell’s CSI drivers and CSM modules. By
    using Dell CSM Operator, enterprises can quickly and easily deploy the CSM modules
    for CSI drivers making it easy for DevOps teams to build and optimize their Kubernetes
    workloads using enterprise grade storage while consistently aligning with the
    desired outcomes of the organization.\nThis operator is available as both community
    and certified operator for Openshift and as a community operator for upstream
    Kubernetes.\nOperator can be deployed via OperatorHub.io. using Operator Lifecycle
    Manager (OLM)\n\n### About Dell CSM\n\nDell CSM brings powerful enterprise storage
    features and functionality to Kubernetes for easier adoption of cloud native workloads,
    improved productivity and scalable operations.\nCSM delivers software modules
    for storage management that provide developers access to build automation for
    enhanced IT needs and other critical enterprise storage features.\nCurrently,
    the following modules are available as part of Dell CSM. *\tObservability - Delivers
    a high-level view of the storage capacity   and performance usage via Grafana
    dashboards to the Kubernetes users\n*\tReplication - Enables array replication
    capabilities for Kubernetes users\n*\tAuthorization - Provides both storage and
    Kubernetes administrators the ability   to apply RBAC for Dell CSI Drivers\n*\tResiliency
    - Designed to make Kubernetes applications more resilient to   node failures\n\nThese
    modules are available for various storage platforms in the Dell portfolio, such
    as Dell PowerStore, Dell PowerMax, Dell PowerFlex, Dell PowerScale, and Dell Unity
    XT.\n\nFor more information, visit [Dell’s Container Storage Module web page](https://www.dell.com/en-us/dt/solutions/kubernetes-containers/kubernetes-storage.htm)\n\nAdditional
    Materials\n*\t[Documentation](https://dell.github.io/csm-docs)\n*\t[CSM Solution
    Brief](https://www.delltechnologies.com/asset/en-us/products/storage/briefs-summaries/csm-solution-brief.pdf)\n"

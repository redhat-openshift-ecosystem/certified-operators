                      - name: GLOBAL_CONFIG_NAME
                        value: default
                      - name: GLOBAL_CONFIG_NAMESPACE
                        value: docling-operator
                      - name: LEADER_ELECTION_ENABLED
                        value: "true"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 500m
                        memory: 128Mi
                      requests:
                        cpu: 10m
                        memory: 64Mi
                serviceAccountName: docling-deploy-controller-manager
                terminationGracePeriodSeconds: 10
  customresourcedefinitions:

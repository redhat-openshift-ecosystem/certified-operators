spec:
  displayName: Docling Operator
  description: |
    ## Overview

    The Docling Operator deploys and manages [Docling Serve](https://github.com/docling-project/docling-serve)
    as a scalable document conversion API service on Kubernetes and OpenShift clusters.

    A `DoclingCluster` custom resource describes the full deployment: the Ray cluster
    used for distributed document processing, the Docling Serve API, optional network
    policy, TLS integration via cert-manager, and an optional persistent Valkey cache.

    ## Features

    - **Docling Serve API** — HTTP API for document conversion backed by Ray workers
    - **KubeRay integration** — manages a child `RayCluster` for distributed processing
    - **Valkey cache** — optional persistent cache/queue as a StatefulSet
    - **NetworkPolicy** — optional egress guard for Ray pods
    - **cert-manager TLS** — Ray client certificate management
    - **Multi-tenant** — each `DoclingCluster` is one isolated deployment; multiple instances per cluster are supported

    ## Prerequisites

    The following operators/components must be installed before deploying this operator:

    - [KubeRay Operator](https://github.com/ray-project/kuberay)
    - [KServe](https://kserve.github.io/website/)
    - [cert-manager](https://cert-manager.io/)
    - NVIDIA GPU Operator

    ## Usage

    Create a `DoclingClusterConfig` for shared defaults, then create one or more
    `DoclingCluster` resources. Each `DoclingCluster` provisions its own isolated
    Ray cluster, Docling Serve deployment, and optional Valkey instance.

      - name: doclingclusterconfigs.docling.docling-project.io
        version: v1alpha1
        kind: DoclingClusterConfig
        displayName: Docling Cluster Config
        description: >-
          Provides shared default configuration inherited by DoclingCluster instances.
          Does not own any instance resources directly.

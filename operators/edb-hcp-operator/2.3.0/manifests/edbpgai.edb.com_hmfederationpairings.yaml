  name: hmfederationpairings.edbpgai.edb.com
spec:
  group: edbpgai.edb.com
  names:
    kind: HMFederationPairing
    listKind: HMFederationPairingList
    plural: hmfederationpairings
    singular: hmfederationpairing
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.peerDomain
      name: PeerDomain
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HMFederationPairing is the Schema for the hmfederationpairings
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HMFederationPairing
            properties:
              adopted:
                description: |-
                  Adopted indicates whether this pairing was created by the adoption pass
                  for bucket-bootstrapped federations. It is set to true on adopted pairings
                  and false on all other pairings.

                  Deprecated: use Source instead. A bool cannot express the roster
                  provenance that full-mesh federation adds. The mutating webhook keeps this
                  field in sync with Source (Adopted == (Source == adopted)) for the
                  transition window; it is removed at a later API revision.
                type: boolean
              peerDomain:
                description: |-
                  PeerDomain is the portal domain of the peer
                  (e.g. "portal-eks-secondary.aws.hcp.enterprisedb.network").

                  Required with TokenSecretRef: the operator dials the peer's
                  https://<PeerDomain>:<PeerPort>/federation/pair endpoint. On the side
                  that serves the endpoint it is the peer's trust domain, learned from the
                  bundle pushed to it.
                type: string
              peerPort:
                description: |-
                  PeerPort is the HTTPS port the peer's portal is reachable on: the global
                  portal_port behind a load balancer, or the istio gateway's
                  ingress_https_node_port when the peer is exposed via NodePort. Empty
                  means 443. It is only used with TokenSecretRef.
                type: string
                x-kubernetes-validations:
                - message: peerPort must be a valid TCP port (1-65535)
                  rule: self == '' || (self.matches('^[0-9]{1,5}$') && int(self) >=
                    1 && int(self) <= 65535)
              role:
                description: |-
                  Role was the role of the Hybrid Manager holding this pairing.

                  Deprecated: ignored, and no longer set by the operator. This member's
                  role is its HybridControlPlane's spec.clusterGroups.role. It is accepted
                  so clients that still send it keep working, and is removed at a later
                  API revision.
                enum:
                - primary
                - secondary
                type: string
              source:
                description: |-
                  Source records how this pairing came to exist: manual (token exchange),
                  adopted (back-filled by the adoption pass for bucket-bootstrapped
                  federations), or roster (created by the member-side roster reconciler).

                  Provenance drives reconcile behaviour: adopted and roster
                  pairings are token-less and converge without dialing the peer, while a
                  pairing carrying a TokenSecretRef drives the join exchange. Only roster
                  pairings are garbage-collected by the roster reconciler.

                  The mutating webhook defaults it from the deprecated Adopted bool and
                  mirrors it back, so either field alone is enough during the transition
                  window. When both are set and disagree, Source wins.
                enum:
                - manual
                - adopted
                - roster
                type: string
              tokenSecretRef:
                description: |-
                  TokenSecretRef references the Secret holding the bearer token used to
                  dial the peer's /federation/pair endpoint, which makes this the side that
                  dials. Empty on the pairing the operator records when a peer joins this
                  member, and on adopted and roster pairings.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
            x-kubernetes-validations:
            - message: peerDomain is required with tokenSecretRef
              rule: '!has(self.tokenSecretRef) || (has(self.peerDomain) && size(self.peerDomain)
                > 0)'
          status:
            description: status defines the observed state of HMFederationPairing
            properties:
              lastTransitionTime:
                description: LastTransitionTime is when State last changed.
                format: date-time
                type: string
              message:
                description: |-
                  Message provides additional human-readable detail about the current
                  state, especially for Failed / Expired.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled
                  into status.
                format: int64
                type: integer
              state:
                description: State is the current lifecycle state of the pairing.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:

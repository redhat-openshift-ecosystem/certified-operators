                    description: Name is the name of the preflight check resource
                      this is the status of
                    type: string
                  phase:
                    description: Phase indicates the current phase of preflight checks
                    type: string
                  totalChecks:
                    description: TotalChecks is the number of checks the resource
                      has
                    type: integer
                required:
                - failedChecks
                - totalChecks
                type: object
              recovery:
                description: |-
                  Recovery reports the progress of the control-plane recovery driven by
                  spec.recoveryFrom. Kept after spec.recoveryFrom is removed, which stops a
                  recovery from being requested twice, except for the recovery of an
                  installed Hybrid Manager, which the demotion ends and the recovery
                  controller clears. Owned by the recovery controller.
                properties:
                  ignoredPreflightFailures:
                    description: |-
                      IgnoredPreflightFailures are the preflight checks that failed while the
                      preflight was not enforced, each with its message, which the recovery went
                      on despite.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  installed:
                    description: |-
                      Installed records that the Hybrid Manager was installed when the recovery
                      started (InstalledBeforeRecovery), which its status no longer tells once
                      the installation has run.
                    type: boolean
                  lastTransitionTime:
                    description: LastTransitionTime is when the phase last changed.
                    format: date-time
                    type: string
                  message:
                    description: Message carries detail about the current phase, especially
                      for failures.
                    type: string
                  pgManagementNamespace:
                    description: |-
                      PGManagementNamespace is the namespace beacon's Postgres management
                      resources are in, read off the Locations the backup holds once
                      RestoreLocations has restored them. RestorePGManagement scopes all of
                      its Restores to it.
                    type: string
                  phase:
                    description: |-
                      Phase is the current phase of the recovery: Preparing, Prepared and
                      Restoring while it runs, Failed while a stage waits to be retried, and
                      Completed once the control plane is recovered.
                    type: string
                  removedDatabases:
                    description: |-
                      RemovedDatabases are the internal databases the RemoveInternalDatabases stage
                      deleted to recover them, recorded before deleting them. The installation
                      recreates them, and the recovery waits for each to be back.
                    items:
                      description: RemovedDatabase is an internal database a takeover
                        deleted to recover it.
                      properties:
                        archivePrefix:
                          description: |-
                            ArchivePrefix is where in this Hybrid Manager's own bucket its backups
                            are, read from the Cluster's own configuration. It is deleted with it.
                          type: string
                        name:
                          description: Name of the CNPG Cluster.
                          type: string
                        namespace:
                          description: Namespace of the CNPG Cluster.
                          type: string
                      required:
                      - archivePrefix
                      - name
                      - namespace
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  restoredSecrets:
                    description: |-
                      RestoredSecrets are the secrets RestoreSecrets created or overwrote, as
                      "namespace/name", whose readers are restarted once the recovery is
                      prepared.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  skippedStages:
                    description: |-
                      SkippedStages are the restore stages the recovery left out, each with why:
                      what is installed or what the backup holds cannot support them. A stage
                      recorded here is not run again.
                    items:
                      description: SkippedStage is a restore stage the recovery left
                        out.
                      properties:
                        reason:
                          description: Reason says why.
                          type: string
                        stage:
                          description: Stage is the stage left out.
                          type: string
                      required:
                      - reason
                      - stage
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  sourceBackup:
                    description: |-
                      SourceBackup is the Velero backup the recovery restores from, recorded by
                      RestoreLocations as it creates its Restore and never changed after. Every
                      later stage restores from it, so the whole control plane comes back from
                      the same point in time.
                    type: string
                  stage:
                    description: |-
                      Stage is the stage of the recovery currently in flight, or the one that
                      failed when the phase is Failed.
                    type: string
                  takeoverFrom:
                    description: |-
                      TakeoverFrom is the portal domain of the member the takeover outranks, the
                      author of the folder recovered, recorded when the preflight passes. The
                      Claim stage yields to a record naming anyone but it or this member, and
                      FlipTopology removes it from this member's federation.
                    type: string
                type: object
              scenarios:
                description: |-
                  Scenarios records which scenarios the target version defines, once the
                  operator has settled spec.scenarios against that version's scenarios.json.
                properties:
                  defined:
                    description: |-
                      Defined is every scenario the scenarios.json of Version defines, sorted:
                      the key set of hcpScenarios and HCP_SCENARIOS_INSTALLED.
                    items:
                      type: string
                    type: array
                  dependencies:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: |-
                      Dependencies maps each scenario of Defined that depends on others at
                      runtime to the defined scenarios it directly depends on, sorted. The
                      operator adds those back to spec.scenarios, so dropping one that a listed
                      scenario still needs is not a removal.
                    type: object
                  installed:
                    description: |-
                      Installed is the scenarios the operator has settled and rendered, sorted.
                      Removing one of them from spec.scenarios needs the
                      edbpgai.edb.com/confirm-scenario-removal annotation, because uninstalling
                      its components may lose data. It is only rewritten once a removal is
                      confirmed, so it is what the removal is measured against.
                    items:
                      type: string
                    type: array
                  observedGeneration:
                    description: |-
                      ObservedGeneration is the generation of the spec whose scenarios were
                      settled against Version: names the version does not define dropped, and
                      the scenarios a listed one depends on added. When it is behind
                      metadata.generation, spec.scenarios may not be settled yet.
                    format: int64
                    type: integer
                  version:
                    description: Version is the spec.version whose scenarios.json
                      Defined comes from.
                    type: string
                required:
                - observedGeneration
                - version
                type: object
              specHash:
                description: SpecHash is the hash of the HCP spec.
                type: string
              topologyHash:
                description: |-
                  TopologyHash is the hash of the LAST-DEPLOYED effective cluster-group
                  topology; it is the watermark compared against the current topology to
                  decide whether a re-render is needed. status.effectiveClusterGroups holds
                  the CURRENT resolved topology (persisted eagerly), which is why both exist.
                type: string
            type: object
        type: object

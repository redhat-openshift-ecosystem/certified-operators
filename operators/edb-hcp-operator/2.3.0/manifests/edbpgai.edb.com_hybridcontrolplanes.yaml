apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: edb-hcp-operator
    control-plane: edb-hcp-operator
  name: hybridcontrolplanes.edbpgai.edb.com
spec:
  group: edbpgai.edb.com
  names:
    kind: HybridControlPlane
    listKind: HybridControlPlaneList
    plural: hybridcontrolplanes
    shortNames:
    - hcp
    singular: hybridcontrolplane
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .status.effectiveClusterGroups.role
      name: Role
      type: string
    - jsonPath: .status.effectiveClusterGroups.primary.domainName
      name: Primary
      priority: 1
      type: string
    - jsonPath: .status.preflightChecks.phase
      name: Preflight
      priority: 1
      type: string
    - jsonPath: .status.postflightChecks.phase
      name: Postflight
      priority: 1
      type: string
    - jsonPath: .status.recovery.phase
      name: Recovery
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Fenced")].status
      name: Fenced
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="FederationTopologyConflict")].status
      name: TopologyConflict
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HybridControlPlane is the Schema for the hybridcontrolplanes
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HybridControlPlaneSpec defines the desired state of HybridControlPlane
            properties:
              beaconAgent:
                description: BeaconAgent is the configurations for the k8s beacon
                  agent supplied on the appliance.
                properties:
                  accessKey:
                    description: The access key to use for connecting to the beacon
                      server.
                    type: string
                  applianceProviderEnabled:
                    description: Bool to indicate that this agent should enable appliance
                      based ingestions.
                    type: boolean
                  beaconDBConnected:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      Bool to indicate if the agent sould connect to beacon db.
                    type: boolean
                  beaconServerAddress:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      Address that the agent can use to reach the beacon server.
                    type: string
                  forceUpdateInterval:
                    description: |-
                      ForceUpdateInterval is how often the agent force-sends schema information
                      even when no change was detected, as a liveness/staleness guard. Defaults to
                      1h (the beacon-agent chart default) when unset.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  inCluster:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      Bool to indicate if the dispatcher should be configured for talking to an in kube cluster server.
                    type: boolean
                  location:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      The id of the location with which this agent is associated.
                    type: string
                  logLevel:
                    description: LogLevel is the log level for the beacon agent.
                    type: string
                  plaintext:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      Bool to indicate that the agent should use plaintext communication with the beacon server.
                    type: boolean
                  providers:
                    description: List of providers configured for the agent.
                    items:
                      type: string
                    type: array
                  provisioning:
                    description: Provisioning is the configurations for the PG provisioning.
                    properties:
                      imageDiscovery:
                        description: |-
                          Deprecated: use spec.registry.discovery.enabled instead. Still honored
                          when spec.registry.discovery.enabled is unset.
                          ImageDiscovery is a bool to indicate whether to use image discovery via registry.
                        type: boolean
                      imagesetDiscoveryAllowInsecureRegistry:
                        description: |-
                          Deprecated: use spec.registry.tls.dangerousSkipTLSVerify instead. Still
                          honored when spec.registry.tls.dangerousSkipTLSVerify is unset.
                          ImagesetDiscoveryAllowInsecureRegistry: Bool to indicate whether connections to the image registry should allow insecure (non-TLS) communication while discovery of images.
                        type: boolean
                      imagesetDiscoveryAuthenticationType:
                        description: |-
                          Deprecated: use spec.registry.discovery.authenticationType instead.
                          Still honored when spec.registry.discovery.authenticationType is unset.
                          ImagesetDiscoveryAuthenticationType indicates type of authentication to use to connect to registry
                          while discovery of images. Supported options: token, basic, eks_managed_identity and gke_workload_identity.
                        type: string
                      imagesetDiscoveryCACerts:
                        description: |-
                          Deprecated: use spec.registry.tls.caCerts instead. Still honored when
                          spec.registry.tls.caCerts is unset.
                          NOTE: in operator v2.1.0 this field had no effect — the upm-beacon chart
                          only consumed the componentsParameters.upm-beacon
                          imageset_discovery_ca_certs parameter (the documented workaround for
                          HM 1.4). Since the unified-registry change (UPM-118802) the effective CA
                          bundle is backfilled into that parameter at render time, so this field
                          now works as originally intended.
                          ImagesetDiscoveryCACerts is a PEM-encoded CA certificate bundle that the
                          beacon-agent image-discovery scanner trusts (in addition to system roots)
                          when connecting over HTTPS to a registry served with a private/internal CA.
                          The beacon-agent component materializes this value into a Secret it mounts.
                          Relevant when imagesetDiscoveryAllowInsecureRegistry is false. Updating this
                          value rotates the trusted CA.
                        type: string
                      imagesetDiscoveryContainerRegistryProvider:
                        description: |-
                          Deprecated: use spec.registry.discovery.provider instead. Still honored
                          when spec.registry.discovery.provider is unset.
                          ImagesetDiscoveryContainerRegistryProvider: Specifies the container registry provider for the registry specified using imagesetDiscoveryContainerRegistryURL. Default "oci"
                          Supported options:
                            oci: set if your container registry provider is fully OCI compliant(https://github.com/opencontainers/distribution-spec/blob/main/spec.md) including /v2/_catalog endpoint.
                            gitlab: set if your container registry provider is gitlab.com (https://docs.gitlab.com/user/packages/container_registry/)
                        type: string
                      imagesetDiscoveryContainerRegistryURL:
                        description: |-
                          Deprecated: use spec.registry.discovery.url instead. Still honored when
                          spec.registry.discovery.url is unset.
                          ImagesetDiscoveryContainerRegistryURL: Specifies the container registry URL from which postgresql images to be discovered.
                          Examples: (CR = Container Registry)
                            - Azure CR       -> myregistry.azurecr.io
                            - AWS ECR        -> 123456079902.dkr.ecr.us-east-1.amazonaws.com
                            - GCP GAR        -> us-east1-docker.pkg.dev
                            - EDB Repos 2.0  -> docker.enterprisedb.com/pgai-platform
                        type: string
                      loadBalancersEnabled:
                        description: |-
                          Deprecated: field will not be supported in the future.
                          LoadBalancersEnabled is a flag to indicate if the agent environment supports load balancer services.
                        type: boolean
                      nodePortDomain:
                        description: |-
                          Deprecated: field will not be supported in the future.
                          NodePortDomain is used by the node port if load balancers are not enabled.
                        type: string
                      nodeSelector:
                        additionalProperties:
                          type: string
                        description: |-
                          NodeSelector: Node selector for PostgreSQL cluster pods.
                          Defines which nodes PostgreSQL cluster pods can be scheduled on based on node labels.
                          Contains key-value pairs of node labels as a simple map.
                          Example: kubernetes.io/os: linux, kubernetes.io/arch: amd64, node-type: database.
                        type: object
                      openshift:
                        description: Openshift is a bool to indicate if the agent
                          is running on openshift environment.
                        type: boolean
                      operandSetVersions:
                        description: |-
                          OperandSetVersions: List of Hybrid Manager operand set versions to be whitelisted for provisioning.
                          Version patterns can use regex syntax. Example: 1\.1\.[0-9]+
                        items:
                          type: string
                        type: array
                      provider:
                        description: |-
                          Deprecated: field will not be supported in the future.
                          Provider is the provider of the environment in which this agent is running if relevant.
                        type: string
                      topologySpreadConstraints:
                        description: |-
                          TopologySpreadConstraints: List of topology spread constraints for PostgreSQL cluster pods.
                          Each constraint defines rules for how pods are distributed across topology domains.
                          Fields: maxSkew (max difference in pod count), topologyKey (node label key),
                          whenUnsatisfiable (DoNotSchedule/ScheduleAnyway), podSelector (MatchDatabasePods).
                        items:
                          properties:
                            maxSkew:
                              format: int32
                              type: integer
                            podSelector:
                              type: string
                            topologyKey:
                              type: string
                            whenUnsatisfiable:
                              type: string
                          type: object
                        type: array
                    type: object
                  schemaPollInterval:
                    description: |-
                      SchemaPollInterval is how often the agent polls and streams table/schema
                      information for the database. Defaults to 1m (the beacon-agent chart default) when unset.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  tlsInsecure:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      If true, will allow the agent to skip verification of the beacon tls certificate.
                    type: boolean
                  transparentDataEncryptionMethods:
                    description: |-
                      List of TDE Encryption Methods for the agent.
                      Supported options: passphrase, aws_kms, azure_kms, gcp_kms, hashicorp_vault.
                      Default values: passphrase, hashicorp_vault.
                    items:
                      type: string
                    type: array
                required:
                - provisioning
                type: object
              beaconServer:
                description: BeaconServer is the configurations for the k8s beacon
                  server supplied on the appliance.
                properties:
                  additionalTrustDomains:
                    description: |-
                      Deprecated: we don't use this field anymore.
                      AdditionalTrustDomains is a list of additional trust domains for the beacon server.
                    items:
                      type: string
                    type: array
                  enableEDBUsageReporting:
                    description: EnableEDBUsageReporting is to enable usage telemetry
                      collection
                    type: boolean
                  hybridManagerInstallation:
                    description: |-
                      HybridManagerInstallation is the identifier of the Hybrid Manager instance installed,
                      to be used when collecting usage telemetry.
                    type: string
                  logLevel:
                    description: LogLevel is the log level for the beacon server.
                    type: string
                type: object
              clusterGroups:
                description: |-
                  ClusterGroups is the configuration of the topology of a group of HM clusters
                  a clusterGroup can either be a `standalone`, meaning a group with a single member
                  or it can consist of a primary and one or more secondary clusters
                properties:
                  primary:
                    description: |-
                      Primary is the primary cluster's portal domain.

                      Deprecated: the primary domain is derived automatically from the
                      accepted primary announcement and the HMFederationPairing resources.
                      A value set here is honored on a secondary until it accepts an
                      announcement naming another member, then only while it names the
                      accepted primary and that primary's pairing is not Synced; never while
                      it names a departed primary. It will be removed in a future API version.
                    properties:
                      domainName:
                        type: string
                    type: object
                  role:
                    default: standalone
                    enum:
                    - primary
                    - secondary
                    - standalone
                    type: string
                  secondaries:
                    description: |-
                      Secondaries lists the secondary clusters' portal domains.

                      Deprecated: secondaries are derived automatically from the
                      HMFederationPairing resources. Values set here are still honored
                      (unioned with the pairing-derived list, less the primary and departed
                      primaries) but will be removed in a future API version.
                    items:
                      properties:
                        domainName:
                          type: string
                      type: object
                    type: array
                type: object
              componentsParameters:
                additionalProperties:
                  additionalProperties:
                    x-kubernetes-preserve-unknown-fields: true
                  type: object
                description: ComponentsParameters is a map of parameters that will
                  be used by specific components.
                type: object
              disabledComponents:
                description: DisabledComponents is a list of components that will
                  not be deployed.
                items:
                  type: string
                type: array
              dryRun:
                description: DryRun is a flag to indicate whether to dry-run the HCP
                  deployment.
                type: boolean
              flavour:
                description: The environment where the HCP will be deployed.
                enum:
                - eks
                - rhos
                - kind
                - gke
                - rke
                - aks
                - microk8s
                - nkp
                type: string
              globalParameters:
                additionalProperties:
                  type: string
                description: GlobalParameters is a list of parameters that will be
                  used by all components.
                type: object
              hmRegistryRef:
                description: |-
                  HMRegistryRef is a reference to the hybrid manager registry instance.
                  When specified, the registry information does not need to be provided
                  manually: the following fields are populated automatically (overriding
                  manual edits) based on the referred HMRegistry instance:

                  - .spec.registry.url
                  - .spec.registry.tls.dangerousSkipTLSVerify
                  - .spec.registry.discovery.url
                  - .spec.registry.discovery.provider
                  - .spec.registry.discovery.authenticationType
                  - .status.hmRegistryURIs.cri
                  - .status.hmRegistryURIs.kube

                  The deprecated counterparts (.spec.imageRegistry,
                  .spec.kappController.dangerousSkipTLSVerify and the
                  .spec.beaconAgent.provisioning imagesetDiscovery fields) are kept in
                  sync as mirrors during the deprecation window. Fields the HMRegistry
                  cannot derive (registry.imagePullSecrets, registry.tls.caCerts,
                  registry.discovery.enabled, registry.discovery.credentialsSecretName)
                  remain user-managed.
                properties:
                  name:
                    description: Name is the name of the HMRegistry instance to refer
                      to.
                    type: string
                type: object
              imagePullSecrets:
                description: |-
                  Deprecated: use spec.registry.imagePullSecrets instead. Still honored
                  when spec.registry.imagePullSecrets is unset.
                  ImagePullSecrets is a list of references to secrets
                  which point to the registry where the HCP images are stored.
                items:
                  description: |-
                    SecretReference represents a Secret Reference. It has enough information to retrieve secret
                    in any namespace
                  properties:
                    name:
                      description: name is unique within a namespace to reference
                        a secret resource.
                      type: string
                    namespace:
                      description: namespace defines the space within which the secret
                        name must be unique.
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              imageRegistry:
                description: |-
                  Deprecated: use spec.registry.url instead. Still honored when
                  spec.registry.url is unset.
                  ImageRegistry is the registry where the HCP images are stored.
                type: string
              kappController:
                description: |-
                  KappController exposes kapp-controller TLS/CA trust settings. When set,
                  the operator reflects these values into the kapp-controller-config Secret
                  that kapp-controller reads at startup.
                properties:
                  caCerts:
                    description: |-
                      Deprecated: use spec.registry.tls.caCerts instead. Still honored when
                      spec.registry.tls.caCerts is unset.
                      CACerts is a PEM-encoded CA cert bundle that kapp-controller will trust
                      in addition to the system roots when contacting private registries.
                    type: string
                  dangerousSkipTLSVerify:
                    description: |-
                      Deprecated: use spec.registry.tls.dangerousSkipTLSVerify instead. Still
                      honored when spec.registry.tls.dangerousSkipTLSVerify is unset.
                      DangerousSkipTLSVerify, when true, tells kapp-controller to treat the
                      configured HCP image registry host as insecure: TLS certificate
                      verification is disabled AND plaintext HTTP fallback is permitted —
                      despite the name, this is not merely a certificate-check skip. Intended
                      for environments where the image registry is served with a self-signed
                      or internally-signed certificate. Prefer CACerts when possible.
                    type: boolean
                type: object
              pgai:
                description: |-
                  Deprecated: PGAI field is no longer used and will be removed in a future version.
                  PGAI is the configurations for Postgres AI (pgAI) portal authentication.
                properties:
                  portal:
                    description: Portal is the configurations for the Postgres AI.
                    properties:
                      authentication:
                        description: Authentication is the authentication configurations
                          for the portal.
                        properties:
                          clientSecret:
                            description: |-
                              Deprecated: we don't use this field anymore.
                              ClientSecret is the client secret for the portal.
                            type: string
                          idpConnectors:
                            description: IDPConnectors is a list of IDP connectors
                              for the portal.
                            items:
                              x-kubernetes-preserve-unknown-fields: true
                            type: array
                          staticPasswords:
                            description: StaticPasswords is a list of static passwords
                              for the portal.
                            items:
                              properties:
                                email:
                                  description: Email is the email address of the user.
                                  type: string
                                hash:
                                  description: |-
                                    Hash is the hash of the password.
                                    Generated using the following command:
                                    echo "password" | htpasswd -BinC 10 admin | cut -d: -f2
                                  type: string
                                userID:
                                  description: |-
                                    A unique identifier for the user must not be changed since
                                    the first time installation.
                                  type: string
                                username:
                                  description: Username is the username of the user.
                                  type: string
                              type: object
                            type: array
                        required:
                        - idpConnectors
                        type: object
                    type: object
                type: object
              recoveryFrom:
                description: |-
                  RecoveryFrom makes this Hybrid Manager recover from a previous one: instead
                  of building an empty control plane, the operator installs against the object
                  storage that Hybrid Manager left behind and restores the control plane from
                  it, with the internal databases born recovered. Absent means a normal
                  installation. Unrelated to spec.source, which is where the operator reads
                  the manifests from.

                  Set at creation, or on a deployed secondary in the edit promoting it to
                  primary, but never where status.recovery already records a recovery. It
                  cannot be changed, and is only removed, and must be removed, in the edit
                  demoting a primary, not while the recovery is in progress.
                properties:
                  claim:
                    description: |-
                      Claim makes a recovery requested at creation claim the takeover of the
                      folder it recovers at the next epoch, so the Hybrid Manager that wrote it
                      fences itself if it is still running or comes back. The claim cannot be
                      taken back, so it is off by default: a drill recovering from a live
                      primary's folder must not fence it. A promotion always claims.
                    type: boolean
                  mode:
                    description: |-
                      Mode selects which locations of the Hybrid Manager being recovered are
                      treated as lost: full when all of them are gone, primary-only when only
                      the location hosting the control plane is gone and the secondaries
                      survive.
                    enum:
                    - full
                    - primary-only
                    type: string
                  preflight:
                    description: |-
                      Preflight configures the checks that vouch for the target before the
                      installation starts. When omitted, the checks run and a failure halts the
                      installation.
                    properties:
                      enforce:
                        default: true
                        description: |-
                          Enforce makes a failed recovery preflight check halt the installation
                          rather than let it build a control plane on data that cannot be restored.
                          Defaults to true; set it to false to downgrade the failures to warnings.
                        type: boolean
                    type: object
                  reuse:
                    description: |-
                      Reuse declares which of the recovered Hybrid Manager's external
                      dependencies this one carries on using, which is what decides whether their
                      credentials are restored from the backup or left as this installation was
                      given them. Omitted means none of them: the new environment stands on its
                      own.
                    properties:
                      objectStore:
                        description: |-
                          ObjectStore means this Hybrid Manager carries on using the object store the
                          recovered one used, so the credentials that describe it are restored from
                          the backup: edb-object-storage, the per-project edb-object-storage-prj-xxxxx
                          ones, and the slo-kv-store ConfigMap recording which store each project is
                          bound to.

                          One answer covers all of them on purpose. They are not separable decisions:
                          point an installation at the old bucket while binding its projects afresh
                          and the storage-location operator finds the restored cluster wrappers with
                          no binding for a project, takes its shortcut, and binds that project to the
                          default store — then persists that answer, permanently.

                          The recovered Hybrid Manager still writes its own backups to its own folder
                          whatever this says: target.internalBackupFolder must differ from
                          globalParameters.internal_backup_folder either way.

                          Whatever this says, a renamed copy of every object storage credential and of
                          the bindings is parked in the hm-recovery namespace, since recovering the
                          customer Postgres clusters reads their backups out of the old bucket long
                          after this stage has run.
                        type: boolean
                    type: object
                  target:
                    description: |-
                      Target identifies the data to recover from: the object storage the Hybrid
                      Manager being recovered was writing to, the folder inside it holding the
                      internal database backups, and the location that data belongs to.
                    properties:
                      internalBackupFolder:
                        description: |-
                          InternalBackupFolder is the folder under edb-internal-backups/ in the
                          bucket that holds the internal (system) database backups of the Hybrid
                          Manager being recovered. It is the value that Hybrid Manager had in
                          spec.globalParameters.internal_backup_folder, and it stays distinct from
                          the internal_backup_folder of the Hybrid Manager being installed, which
                          keeps writing its own backups to its own folder.
                        minLength: 1
                        type: string
                      locationID:
                        description: |-
                          LocationID is the identifier of the location being recovered, the one the
                          old control plane itself ran in. It names that location explicitly rather
                          than assuming the recovered Hybrid Manager re-registers under the same
                          identifier, and it disambiguates which location is being recovered when
                          several of them share one bucket.

                          Required when mode is primary-only, where only that one location is
                          treated as lost. Optional when mode is full, where every restored
                          location is treated as lost regardless.

                          Must be a DNS label: it names the parked copies of the recovered object store
                          credentials in the hm-recovery namespace.
                        type: string
                      objectStoreSecretRef:
                        description: |-
                          ObjectStoreSecretRef references the Secret holding the connection details
                          of the object storage the Hybrid Manager being recovered was writing to:
                          provider, bucket and credentials, in the same format as the
                          edb-object-storage Secret of a running Hybrid Manager. The bucket is read
                          in place and read-only, so the credentials only need read access. Both the
                          name and the namespace of the Secret are required.
                        properties:
                          name:
                            description: name is unique within a namespace to reference
                              a secret resource.
                            type: string
                          namespace:
                            description: namespace defines the space within which
                              the secret name must be unique.
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    required:
                    - internalBackupFolder
                    - objectStoreSecretRef
                    type: object
                    x-kubernetes-validations:
                    - message: target.objectStoreSecretRef.name is required
                      rule: has(self.objectStoreSecretRef) && has(self.objectStoreSecretRef.name)
                        && size(self.objectStoreSecretRef.name) > 0
                    - message: target.objectStoreSecretRef.namespace is required
                      rule: has(self.objectStoreSecretRef) && has(self.objectStoreSecretRef.__namespace__)
                        && size(self.objectStoreSecretRef.__namespace__) > 0
                required:
                - mode
                - target
                type: object
                x-kubernetes-validations:
                - message: target.locationID is required when mode is primary-only
                  rule: self.mode != 'primary-only' || (has(self.target.locationID)
                    && size(self.target.locationID) > 0)
              registry:
                description: |-
                  Registry is the unified registry configuration: where the HCP images
                  are stored (url), the secrets used to pull images (imagePullSecrets),
                  how the registry is trusted over TLS (tls.caCerts /
                  tls.dangerousSkipTLSVerify, consumed by both kapp-controller pulls and
                  beacon-agent image discovery), and how postgresql images are discovered
                  (discovery.enabled / discovery.url / discovery.provider /
                  discovery.authenticationType / discovery.credentialsSecretName). Values
                  set here take precedence over the deprecated spec.imageRegistry,
                  spec.imagePullSecrets, spec.kappController, the
                  spec.beaconAgent.provisioning image-discovery counterparts and the
                  componentsParameters.upm-beacon image_discovery_credentials_secret_name
                  / imageset_discovery_ca_certs parameters.
                properties:
                  discovery:
                    description: Discovery configures beacon-agent image discovery
                      against the registry.
                    properties:
                      authenticationType:
                        description: |-
                          AuthenticationType indicates type of authentication to use to connect to
                          registry while discovery of images. Supported options: token, basic,
                          eks_managed_identity and gke_workload_identity.
                          Supersedes the deprecated
                          spec.beaconAgent.provisioning.imagesetDiscoveryAuthenticationType.
                        type: string
                      credentialsSecretName:
                        description: |-
                          CredentialsSecretName is the name of the Secret holding the registry
                          credentials used while discovery of images. Supersedes the deprecated
                          componentsParameters.upm-beacon.image_discovery_credentials_secret_name
                          parameter (which defaults to edb-cred).
                        type: string
                      enabled:
                        description: |-
                          Enabled indicates whether to use image discovery via registry.
                          Supersedes the deprecated spec.beaconAgent.provisioning.imageDiscovery.
                        type: boolean
                      provider:
                        description: |-
                          Provider specifies the container registry provider for the registry
                          specified using URL. Default "oci".
                          Supported options:
                            oci: set if your container registry provider is fully OCI compliant(https://github.com/opencontainers/distribution-spec/blob/main/spec.md) including /v2/_catalog endpoint.
                            gitlab: set if your container registry provider is gitlab.com (https://docs.gitlab.com/user/packages/container_registry/)
                          Supersedes the deprecated
                          spec.beaconAgent.provisioning.imagesetDiscoveryContainerRegistryProvider.
                        type: string
                      url:
                        description: |-
                          URL is the container registry URL from which postgresql images are
                          discovered. Optional: when unset, discovery uses the pull registry URL
                          (spec.registry.url, or the deprecated spec.imageRegistry) — set it only
                          when discovery targets a different repository or host. Like
                          spec.registry.url it may include a repository path.
                          Examples: (CR = Container Registry)
                            - Azure CR       -> myregistry.azurecr.io
                            - AWS ECR        -> 123456079902.dkr.ecr.us-east-1.amazonaws.com
                            - GCP GAR        -> us-east1-docker.pkg.dev
                            - EDB Repos 2.0  -> docker.enterprisedb.com/pgai-platform
                          Supersedes the deprecated

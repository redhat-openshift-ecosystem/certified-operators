  description: |
    The F5 AI Security Operator provides comprehensive security controls for generative AI applications running on Kubernetes and OpenShift.

    ## Key Capabilities

    **AI Guardrails**
    Deploy and manage content filtering and policy enforcement to protect LLM interactions.
    Choose the guardrail workloads that match your coverage and infrastructure needs:

    - **Performance Guardrails** use CPU-based Lightweight Guardrails for text scanning,
      including prompt injection and personal data detection. Enable them with
      `guardrails.mlText.enabled: true`.
    - **Comprehensive Guardrails** use GPU-based generative AI models for contextual scanning
      of model inputs and outputs. Enable them with `guardrails.genAI.enabled: true`.

    Both options require `guardrails.enabled: true`. They can run independently or together;
    set both workload flags explicitly when choosing an option. These flags deploy the
    workloads; configure the corresponding guardrail policies in F5 AI Runtime Security.

    **Red Team Testing**
    Continuous adversarial testing using Prefect-based workflows to identify weaknesses in AI defenses before attackers do.

    **Remediate**
    Automated remediation of AI model outputs flagged during red team testing, closing the loop between detection and mitigation.

    **Unified Management**
    Single declarative interface to deploy, configure, and manage the complete AI security stack
    including PostgreSQL persistence, with automatic cross-component integration and service discovery.

    ## Use Cases

    - Protect customer-facing chatbots and AI assistants from malicious prompts
    - Enforce data privacy and compliance requirements for AI applications
    - Continuous security validation of LLM deployments
    - Centralized security monitoring and policy management for multi-tenant AI platforms

    ## Prerequisites

    Performance Guardrails can run on CPU-only OpenShift clusters. Comprehensive Guardrails,
    Red Team, and Remediate workloads require GPU scheduling and the GPU platform operators.

    **Platform Requirements**

    - **OpenShift**: Verified on OpenShift Container Platform (OCP) 4.20.x or later
    - **GPU Operators** (for Comprehensive Guardrails, Red Team, or Remediate):
      - Node Feature Discovery (NFD) Operator with NodeFeatureDiscovery applied
      - NVIDIA GPU Operator (Certified) with CRI-O integration and ClusterPolicy applied
    - **GPU Nodes**: CUDA-capable NVIDIA GPUs with enough memory for the selected models.
      Size GPU memory for model precision, context length, and request concurrency with F5.
      Use resource profiles to select the appropriate GPU nodes for each workload.
    - **Security Context Constraints (SCC)**: Moderator and inference workloads use `restricted-v2`.
      PostgreSQL requires `nonroot-v2`.
      Prefect ServiceAccounts require a custom `f5-ai-sec-prefect` SCC, created by the operator.
    - **Storage**: The evaluation PostgreSQL deployment requires a default StorageClass and a 20Gi persistent volume.
      Use an external PostgreSQL database for production.
    - **Ingress**: Expose endpoints via OpenShift Routes with TLS and configure the moderator's public base URL.

    ### GPU Compatibility Note
    GPU Operator v25.10.0+ enables CDI by default. On CRI-O nodes with `crun` older than 1.26, this causes
    inference pods to fail (fixed upstream in [containers/crun#1924](https://github.com/containers/crun/issues/1924)).
    **Upgrading to OCP 4.21.28 or later resolves this** (ships crun 1.27+). Check your version with
    `oc debug node/<node> -- chroot /host crun --version`; if below 1.26 and you can't upgrade OCP,
    disable CDI in ClusterPolicy:
    ```bash
    oc patch clusterpolicy gpu-cluster-policy --type=merge -p '{"spec":{"cdi":{"enabled":false}}}'
    ```

    ## Resource Requirements

    The current chart defaults request the following resources per replica. CPU and RAM
    are separate from GPU memory. Provision capacity for all enabled components and
    additional replicas; these requests are starting allocations, not throughput guarantees.

    | Component | CPU request | RAM request | GPU request |
    |-----------|-------------|-------------|-------------|
    | F5 AI Security Operator | 10m | 1Gi | None |
    | Moderator | 10 | 25Gi | None |
    | Inference operator | 2 | 4Gi | None |
    | Performance Guardrails (Lightweight Guardrails) | 3 | 6Gi | None |
    | Comprehensive Guardrails (per model replica) | 2 | 12Gi | 1 NVIDIA GPU |
    | Red Team or Remediate (per model replica) | 2 | 12Gi | 1 NVIDIA GPU |
    | Evaluation PostgreSQL | 100m | 256Mi | None |

    Model cache Jobs additionally request 1 CPU and 8Gi RAM while loading models.
    The job manager provides workflow orchestration: the Prefect server requests 2 CPUs
    and 4Gi RAM, and the worker requests 1Gi RAM, plus resources for individual Jobs.
    GPU workloads can scale to 10 replicas per model with the chart defaults. Account for
    model rollout capacity and, during upgrades from KubeAI, both inference stacks until migration completes.

    Tune inference allocations through `inference.values.resourceProfiles` and each
    workload's `scaling` settings. Performance Guardrails use `lightweight-guardrails-cpu`;
    Comprehensive Guardrails use `guardrails`.

    **License and Registry Access**

    This operator depends on pulling containers from an authenticated repository and also
    requires a license. Please contact F5 AI Security Sales Team to obtain these components
    before attempting an install.

    https://www.f5.com/products/get-f5?ls=meta#contactsales

    ## Quickstart

    Once you have obtained the credentials for the repository you will need to create a
    Docker Registry Secret with those credentials. That can be done with the following command:

    ```bash
    oc create secret docker-registry regcred \
              -n f5-ai-sec \
              --docker-username=$DOCKER_USERNAME \
              --docker-password=$DOCKER_PASSWORD \
              --docker-email=$DOCKER_EMAIL
    ```

    Install the operator from the OpenShift software catalog, open **Installed Operators**,
    and select **F5 AI Security Operator**. On the **Security Operator** tab, select
    **Create SecurityOperator**, choose YAML, and paste the example below. Update its
    values for your installation, then select **Create**.

    ### Performance Guardrails Example (CPU)

    This evaluation example deploys the moderator, in-cluster PostgreSQL, and Performance
    Guardrails without GPU workloads. Replace the public URL, database password, and license
    before creating the resource. Keep the two database password values identical.
    Omit component versions to use the charts bundled with this operator release.

    For production, disable `postgresql.enabled`, set
    `moderator.values.env.CAI_MODERATOR_DB_HOST` to your external PostgreSQL host, and
    provide its administrator password in `moderator.values.secrets.CAI_MODERATOR_DB_ADMIN_PASSWORD`.

    ```yaml
    apiVersion: ai.security.f5.com/v1alpha1
    kind: SecurityOperator
    metadata:
      name: security-operator-demo
      namespace: f5-ai-sec
    spec:
      registryAuth:
        enabled: true
        existingSecret: "regcred"
      postgresql:
        enabled: true
        namespace: cai-moderator
        values:
          postgresql:
            auth:
              password: "replace-with-database-password"
      jobManager:
        enabled: true
        namespace: prefect
      moderator:
        enabled: true
        namespace: cai-moderator
        values:
          env:
            CAI_MODERATOR_BASE_URL: "https://ai-security.example.com"
          secrets:
            CAI_MODERATOR_DB_ADMIN_PASSWORD: "replace-with-database-password"
            CAI_MODERATOR_DEFAULT_LICENSE: "replace-with-f5-license"
      inference:
        enabled: true
        namespace: f5-ai-sec-inference
        values:
          guardrails:
            enabled: true
            genAI:
              enabled: false
            mlText:
              enabled: true
          redTeam:
            enabled: false
          remediate:
            enabled: false
    ```

    ### Comprehensive Guardrails Example (GPU)

    To deploy Comprehensive Guardrails, replace the `spec.inference` section above with
    the following. Configure GPU nodes and operators first. Enable `mlText` as well if
    you want both guardrail options.

    ```yaml
    inference:
      enabled: true
      namespace: f5-ai-sec-inference
      values:
        guardrails:
          enabled: true
          genAI:
            enabled: true
          mlText:
            enabled: false
        redTeam:
          enabled: false
        remediate:
          enabled: false
    ```

    Red Team and Remediate are optional GPU workloads independent of the guardrail option.
    Enable `jobManager.enabled` for workflow orchestration. Enable `inference.values.redTeam.enabled`
    for Red Team and `inference.values.remediate.enabled` for Remediate.

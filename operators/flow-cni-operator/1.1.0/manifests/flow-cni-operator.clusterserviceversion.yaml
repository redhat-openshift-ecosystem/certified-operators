                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 18081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 18081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:

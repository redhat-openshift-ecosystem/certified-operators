          app.kubernetes.io/name: flow-cni-operator
          control-plane: controller-manager
        name: flow-cni-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: flow-cni-operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: flow-cni-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --leader-elect
                - --leader-election-id=flow-cni-operator
                - --metrics-bind-address=0
                - --health-probe-bind-address=:18081
                env:
                - name: RELATED_IMAGE_FLOW_CNI
                  value: registry.connect.redhat.com/nutanix/flow-cni@sha256:b6fcdcd9f701739cf7fab5091ba40bfa07e8d592c421becabc924082fbc671d8
                - name: RELATED_IMAGE_FLOW_OVN_KUBERNETES

                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              dnsPolicy: ClusterFirstWithHostNet
              hostNetwork: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: flow-cni-operator-controller-manager
              terminationGracePeriodSeconds: 10
              tolerations:

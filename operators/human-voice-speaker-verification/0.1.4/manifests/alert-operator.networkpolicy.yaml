# Allow cluster DNS and the ports used by the Kubernetes API.
# Kubernetes node health probes are not subject to ingress NetworkPolicy rules.
# API destination CIDRs differ across clusters, so TCP 443/6443 are not
# destination-restricted by this policy. RBAC remains namespace-scoped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-operator
spec:
  podSelector:
    matchLabels:
      app: alert-operator
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}

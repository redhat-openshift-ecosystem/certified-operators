spec:
  displayName: Human_Voice_Speaker_Verification
  version: 0.1.4
  maturity: beta
  description: "Human_Voice_Speaker_Verification provides language-independent speaker\
    \ enrollment, verification and similarity search with mandatory Keycloak client\
    \ credentials and per-client isolation. Search accepts audio, compatible external\
    \ embeddings or an enrollment ID. API responses do not expose voice embeddings.\
    \ Original enrollment WAV data is stored with the enrollment in PostgreSQL.\n\n\
    This Beta release targets ARM64 OpenShift 4.22. Install the Operator in the same\
    \ dedicated namespace as its application. Before creating HVIAlert, administrators\
    \ must provision PostgreSQL 16 with pgvector, database TLS and roles, a Red Hat\
    \ Keycloak realm, OIDC client bindings, read-only registry access, runtime/signing\
    \ Secrets and the documented TLS prerequisites. PostgreSQL, identity, backups\
    \ and customer data remain separately administered. The Operator manages API/model\
    \ deployment and reconciliation with namespace-scoped permissions.\n\nUpgrades\
    \ use Recreate and require a planned unavailable interval. Model-space and schema\
    \ changes require a separately reviewed migration. Disconnected operation, FIPS\
    \ validation, non-AWS portability and zero-downtime upgrades are not claimed.\
    \ The sample custom resource contains placeholders that must be configured for\
    \ the deployment.\n\nContact bradley.warren@humanvoice.inc or https://humanvoice.inc\
    \ for licensed private-registry access, installation instructions, release-specific\
    \ corresponding source and support. Human Voice Inc. commits to an initial support\
    \ response within 24 hours, seven days a week.\n\nRequired before installing the\
    \ Operator: create the dedicated namespace and apply the controller NetworkPolicy\
    \ below in that namespace. Keep this policy during installation and operation.\
    \ OLM does not install or manage NetworkPolicy resources. This policy denies controller\
    \ ingress and limits egress to cluster DNS and Kubernetes API ports. The application\
    \ policies remain managed by the Operator.\n\n```yaml\n# Allow cluster DNS and\
    \ the ports used by the Kubernetes API.\n# Kubernetes node health probes are not\
    \ subject to ingress NetworkPolicy rules.\n# API destination CIDRs differ across\
    \ clusters, so TCP 443/6443 are not\n# destination-restricted by this policy.\
    \ RBAC remains namespace-scoped.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\n\
    metadata:\n  name: alert-operator\nspec:\n  podSelector:\n    matchLabels:\n \
    \     app: alert-operator\n  policyTypes: [Ingress, Egress]\n  ingress: []\n \
    \ egress:\n    - to:\n        - namespaceSelector:\n            matchLabels:\n\
    \              kubernetes.io/metadata.name: openshift-dns\n      ports:\n    \
    \    - {protocol: UDP, port: 53}\n        - {protocol: TCP, port: 53}\n      \
    \  - {protocol: UDP, port: 5353}\n        - {protocol: TCP, port: 5353}\n    -\
    \ ports:\n        - {protocol: TCP, port: 443}\n        - {protocol: TCP, port:\
    \ 6443}\n```\n Controller maintained by Human Voice from upstream Operator SDK\
    \ with updated dependencies on UBI; no Red Hat controller-binary support or FIPS\
    \ validation claim."
  keywords:
  - speaker verification
  - voice
  - PostgreSQL
  - pgvector
  icon:
  - base64data: 
    mediatype: image/svg+xml
  provider:
    name: Human Voice Inc.
    url: https://humanvoice.inc
  maintainers:
  - name: Human Voice Inc.
    email: bradley.warren@humanvoice.inc
  links:
  - name: Support and corporate website
    url: https://humanvoice.inc
  minKubeVersion: 1.35.0
  installModes:
  - type: OwnNamespace
    supported: true
  - type: SingleNamespace
    supported: false
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: false
  install:
    strategy: deployment
    spec:
      permissions:
      - serviceAccountName: alert-operator
        rules:
        - apiGroups:
          - alert.hvi.ai
          resources:
          - hvialerts
          - hvialerts/status
          - hvialerts/finalizers
          verbs:
          - get
          - list
          - watch
          - update
          - patch
        - apiGroups:
          - ''
          resources:
          - services
          - serviceaccounts
          - configmaps
          - secrets
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ''
          resources:
          - pods
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - apps
          resources:
          - replicasets
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - batch
          resources:
          - jobs
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - networking.k8s.io
          resources:
          - networkpolicies
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - route.openshift.io
          resources:
          - routes
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
      - serviceAccountName: alert-readiness
        rules:
        - apiGroups:
          - apps
          resources:
          - deployments
          resourceNames:
          - alert-api
          - alert-models
          verbs:
          - get
      deployments:
      - name: alert-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: alert-operator
          template:
            metadata:
              labels:
                app: alert-operator
            spec:
              serviceAccountName: alert-operator
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: operator
                image: quay.io/humanvoicealert/alert-operator@sha256:fc0f0d867dde4a2ac44201f314d4e3d745e0fda724cbfe30fc7a1b15ce885373
                args:
                - --leader-elect
                - --leader-election-id=alert-operator
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=0
                - --max-concurrent-reconciles=1
                env:
                - name: WATCH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: RELATED_IMAGE_API
                  value: quay.io/humanvoicealert/alert-api@sha256:8c4498d84c79a36e7901520c10a51ae7a11779958c27715128036ba1a3d0cd74
                - name: RELATED_IMAGE_MODEL
                  value: quay.io/humanvoicealert/alert-model@sha256:db53de6e1cb9986c963b73f6e9cb3ce6f49f3e6ef6c09ad8a72d16958a0ca4e9
                - name: HOME
                  value: /tmp
                - name: HELM_CACHE_HOME
                  value: /tmp/helm/cache
                - name: HELM_CONFIG_HOME
                  value: /tmp/helm/config
                - name: HELM_DATA_HOME
                  value: /tmp/helm/data
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: '1'
                    memory: 512Mi
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                volumeMounts:
                - name: tmp
                  mountPath: /tmp
              volumes:
              - name: tmp
                emptyDir:
                  sizeLimit: 128Mi
              imagePullSecrets:
              - name: alert-registry
  customresourcedefinitions:
    owned:
    - name: hvialerts.alert.hvi.ai
      version: v1alpha1
      kind: HVIAlert
      displayName: Human Voice speaker verification
      description: A single namespace-scoped API/model deployment with external database
        and Secrets.
      resources:
      - kind: Deployment
        version: v1
        name: alert-api
      - kind: Deployment
        version: v1
        name: alert-models
      specDescriptors:
      - displayName: Deployment tenant label
        path: tenantId
        description: Immutable compatibility label; OIDC request tenants come only
          from client bindings.
      - displayName: Identity issuer
        path: identity.issuer
        description: Immutable HTTPS Keycloak realm issuer. No shared-token fallback.
      - displayName: Client bindings
        path: identity.bindingsConfigMapName
        description: Pre-existing ConfigMap containing bindings.json; no credential
          or binding contents in the CR.
      - displayName: Embedding space
        path: embeddingSpace
        description: Immutable model-space identity; must match the selected model
          release.
      - displayName: Secret revision
        path: secretRevision
        description: Change after approved runtime credential rotation to roll both
          workloads.
      statusDescriptors:
      - displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
  relatedImages:
  - name: api
    image: quay.io/humanvoicealert/alert-api@sha256:8c4498d84c79a36e7901520c10a51ae7a11779958c27715128036ba1a3d0cd74
  - name: model
    image: quay.io/humanvoicealert/alert-model@sha256:db53de6e1cb9986c963b73f6e9cb3ce6f49f3e6ef6c09ad8a72d16958a0ca4e9
  - name: operator
    image: quay.io/humanvoicealert/alert-operator@sha256:fc0f0d867dde4a2ac44201f314d4e3d745e0fda724cbfe30fc7a1b15ce885373

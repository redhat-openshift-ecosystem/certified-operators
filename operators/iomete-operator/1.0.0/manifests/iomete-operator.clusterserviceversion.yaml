  description: |
    IOMETE Data Plane Operator for Kubernetes.

    Installs and manages the IOMETE Data Plane Enterprise Helm chart, version
    4.0.3. The IOMETE component images it deploys are tagged with that
    chart's appVersion; run `helm list -n <namespace>` after install to see both.

    Each operator release bundles one chart version; upgrade the operator to get a newer chart.
  displayName: IOMETE Operator

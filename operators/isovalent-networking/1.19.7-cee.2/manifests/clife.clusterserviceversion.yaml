kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "cilium.io/v1alpha1",
          "kind": "CiliumConfig",
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "clife"
            },
            "name": "ciliumconfig"
          },
          "spec": {
            "cluster": {
              "name": "default"
            },
            "clusterHealthPort": 9940,
            "cni": {
              "binPath": "/var/lib/cni/bin",
              "confPath": "/var/run/multus/cni/net.d",
              "exclusive": false
            },
            "hubble": {
              "enabled": true,
              "relay": {
                "enabled": true
              }
            },
            "ipam": {
              "mode": "cluster-pool"
            },
            "k8sServiceHost": "api-int.\u003ccluster_name\u003e.\u003cbase_domain\u003e",
            "k8sServicePort": 6443,
            "kubeProxyReplacement": true,
            "prometheus": {
              "serviceMonitor": {
                "enabled": true
              }
            },
            "securityContext": {
              "privileged": true
            },
            "sessionAffinity": true,
            "tunnelPort": 4789
          }
        },
        {
          "apiVersion": "isovalent.com/v1alpha1",
          "kind": "RegistryCredential",
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "clife"
            },
            "name": "config"
          },
          "spec": {
            "credentialSecretRef": {
              "name": "long-lived-creds"
            },
            "rotationThresholdDays": 1,
            "server": "registry.isovalent.com"
          }
        }
      ]

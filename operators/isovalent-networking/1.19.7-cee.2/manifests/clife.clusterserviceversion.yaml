                    image: containers.isovalent.com/clife@sha256:7f2bc3f0e6c042717b89da69dd433385fd2b063de00946324b12aac20f113682
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 49081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    ports:
                      - containerPort: 49081
                        name: probe
                        protocol: TCP
                      - containerPort: 18443
                        name: metrics
                        protocol: TCP
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 49081
                      initialDelaySeconds: 5
                      periodSeconds: 10

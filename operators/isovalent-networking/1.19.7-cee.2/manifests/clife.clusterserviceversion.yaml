      deployments:
        - label:
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: clife
            control-plane: controller-manager
          name: clife-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            strategy:
              type: Recreate
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  control-plane: controller-manager
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/arch
                              operator: In
                              values:
                                - amd64
                                - arm64
                            - key: kubernetes.io/os
                              operator: In
                              values:
                                - linux
                containers:
                  - args:
                      - --health-probe-bind-address=:49081
                      - --metrics-bind-address=:18443
                      - --leader-elect
                    command:
                      - /clife-manager
                    env:
                      - name: NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                      - name: DEVELOPMENT_MODE
                        value: "false"
                      - name: RELATED_IMAGE_AGENT
                        value: containers.isovalent.com/cilium-ubi:v1.19.7-cee.2@sha256:94255405fc185afdb9cec277e472f1fb29b22b8a0d40d11606a50c6a8404090b

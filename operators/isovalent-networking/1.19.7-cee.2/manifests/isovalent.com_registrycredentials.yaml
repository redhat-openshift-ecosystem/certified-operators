              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RegistryCredentialSpec defines the desired state, i.e. the information for
              generating the pull secret and the timing for the token rotation.
            properties:
              additionalServers:
                description: |-
                  AdditionalServers lists extra registry hostnames to include in the dockerconfigjson
                  with the same access token alongside the primary Server.
                  When omitted the defaults ["charts.isovalent.com", "containers.isovalent.com"] are used.
                  Set to an empty list to include only the primary Server.
                items:
                  type: string
                nullable: true
                type: array
              credentialSecretRef:
                description: |-
                  CredentialSecretRef references a secret in the operator namespace containing
                  the long-lived identity token used for the initial access token grant (key: identityToken).
                  It is only needed for bootstrapping: once an access and refresh token have been obtained
                  and persisted, this field is no longer read and the secret it points to may be removed.
                  It may also be omitted entirely if the refresh token secret is pre-populated by other means.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

        description: |-
          RegistryCredential manages authentication tokens for a private container registry, rotating them before they expire,
          and distributes the resulting pull secret to the operator's own namespace and to any namespaces
          listed in spec.targetNamespaces.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources

                  Description is a human-readable label for the access token in the registry.
                  Defaults to "Managed by the CLife operator for Kubernetes".
                type: string
              rotationThresholdDays:
                default: 60
                description: |-
                  RotationThresholdDays controls how old the active token may be before the
                  operator rotates it. Defaults to 60 days.
                format: int32
                minimum: 1
                type: integer
              server:
                default: registry.isovalent.com
                description: Server is the registry server hostname.
                type: string
              targetNamespaces:

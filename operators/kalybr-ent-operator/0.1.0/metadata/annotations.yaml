annotations:
  operators.operatorframework.io.bundle.mediatype.v1: registry+v1
  operators.operatorframework.io.bundle.manifests.v1: manifests/
  operators.operatorframework.io.bundle.metadata.v1: metadata/
  operators.operatorframework.io.bundle.package.v1: kalybr-ent-operator
  # The subscription track customers name in `spec.channel`, NOT a version — 0.1.0 ships on it.
  #
  # `stable` from the first publish, deliberately. OLM only ever offers a subscriber upgrades from the
  # channel their Subscription names, so publishing to `alpha` and moving to `stable` later strands
  # everyone already subscribed: they see no new versions, nothing errors, and only the customer can fix
  # it by editing their own Subscription. A second channel (`fast`, say) can be ADDED for previews
  # without disturbing anyone; renaming the one they are on cannot.
  operators.operatorframework.io.bundle.channels.v1: stable
  operators.operatorframework.io.bundle.channel.default.v1: stable
  # The minimum OpenShift release, OPEN-ENDED: 4.18 and every release after it. The Partner Connect
  # project declares 4.18-4.22, which is what has actually been certified against — this says 4.18+ so a
  # new OpenShift minor picks the operator up without a republish.
  #
  # The trade is deliberate. A range would stop the operator appearing on 4.23 until this is widened and
  # the bundle re-cut, and an operator silently absent from a customer's new cluster is worse than one
  # running on a release we have not explicitly tested. It does mean this claims support ahead of proof:
  # when a new minor lands, the appliance should be reconciled on it (§3) rather than assumed to work.
  com.redhat.openshift.versions: "v4.18"

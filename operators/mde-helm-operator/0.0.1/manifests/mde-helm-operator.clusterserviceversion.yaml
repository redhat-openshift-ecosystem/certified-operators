      [
        {
          "apiVersion": "defender.microsoft.com/v1alpha1",
          "kind": "DefenderEndpoint",
          "metadata": {
            "name": "mde-onboarding",
            "namespace": "mdc"
          },
          "spec": {
            "onboarding": {
              "existingSecret": "mde-onboarding"
            },
            "platform": "openshift"
          }
        }
      ]
    capabilities: Basic Install
    categories: Security
    createdAt: "2026-11-13T13:32:19Z"
    description: Deploy and manage Microsoft Defender for Endpoint on OpenShift.
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operatorframework.io/suggested-namespace: mdc-operator
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: helm.sdk.operatorframework.io/v1
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/arch.arm64: supported
    operatorframework.io/os.linux: supported
  name: mde-helm-operator.v0.0.1
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Use mde-onboarding as the resource name. Select an imported onboarding
        Secret to deploy MDE. Optionally enter a cluster name or use automatic discovery.
      displayName: Defender Endpoint
      kind: DefenderEndpoint
      name: defenderendpoints.defender.microsoft.com
      specDescriptors:
      - description: Optional cluster name. Omit to use the automatically discovered
          name.
        displayName: Cluster name
        path: clusterName
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Optional daily image updates from the selected Microsoft MDE
          repository.
        displayName: Automatic MDE image updates
        path: autoUpdate
      - description: Optional proxy URL.
        displayName: Outbound proxy
        path: proxy
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Check for image updates daily, starting at the next scheduled
          run. Updates can replace manually selected versions. Disable before pinning
          an image tag or digest.
        displayName: Follow latest MDE image
        path: autoUpdate.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - displayName: Platform
        path: platform
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - description: Select the imported onboarding Secret in this project containing
          mdatp_onboard.json.
        displayName: Onboarding Secret
        path: onboarding.existingSecret
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - displayName: Offboarding
        path: offboarding
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - displayName: Admission policy
        path: securityGating
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - displayName: Admission settings
        path: AzureDefender
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - description: Container image settings. Omitted values use defaults. Disable
          automatic updates before selecting a specific image tag or digest.
        displayName: Image settings
        path: image
      - displayName: Image repository
        path: image.repository
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      - description: Image tag from the selected repository. Omit to use the default
          version; clear any digest override when selecting a tag.
        displayName: Image tag
        path: image.tag
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Registry containing the MDE image. Omit to use mcr.microsoft.com.
          Automatic updates require this registry.
        displayName: Image registry
        path: image.registry
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - displayName: Image digest
        path: image.digest
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:hidden
      version: v1alpha1
  description: |
    Deploy and manage Microsoft Defender for Endpoint (MDE) on OpenShift.

    ## Features

    - Deploy and uninstall MDE through a DefenderEndpoint resource.
    - Use imported onboarding configuration and automatic cluster discovery.
    - Select an image version or opt in to daily image updates.

    ## Documentation

    See [Microsoft Defender for Endpoint documentation](https://learn.microsoft.com/defender-endpoint/microsoft-defender-endpoint-linux)
    for product guidance.

    Installation requires cluster-wide permissions and privileged node access.
    Restrict configuration changes to trusted administrators.
  displayName: Microsoft Defender for Endpoint
  install:

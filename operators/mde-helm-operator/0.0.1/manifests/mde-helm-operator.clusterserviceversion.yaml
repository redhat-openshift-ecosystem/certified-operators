        serviceAccountName: mde-helm-operator-controller-manager
      deployments:
      - label:
          app.kubernetes.io/name: mde-helm-operator
        name: mde-helm-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: mde-helm-operator
          strategy: {}
          template:
            metadata:
              labels:
                app.kubernetes.io/name: mde-helm-operator
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                        - amd64
                        - arm64
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
              containers:
              - args:
                - --leader-elect
                - --leader-election-id=mde-helm-operator
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=0
                env:
                - name: WATCH_NAMESPACE
                  value: mdc
                - name: OPERATOR_IMAGE
                  value: mcr.microsoft.com/mdatp/linux/operator/insiderfast@sha256:ce33e7b8f5f5b55b682b0dcf100612f345a4cbc40125e31c8bfc5d0338a0b59a
                image: mcr.microsoft.com/mdatp/linux/operator/insiderfast@sha256:ce33e7b8f5f5b55b682b0dcf100612f345a4cbc40125e31c8bfc5d0338a0b59a
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              initContainers:
              - command:
                - /bin/bash
                - /usr/local/bin/ensure-mdc-project
                image: mcr.microsoft.com/mdatp/linux/operator/insiderfast@sha256:ce33e7b8f5f5b55b682b0dcf100612f345a4cbc40125e31c8bfc5d0338a0b59a
                name: project-bootstrap
                resources:
                  limits:
                    cpu: 100m
                    memory: 64Mi
                  requests:
                    cpu: 5m
                    memory: 32Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                - mountPath: /tmp
                  name: project-bootstrap-tmp
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: mde-helm-operator-controller-manager
              terminationGracePeriodSeconds: 10
              volumes:
              - emptyDir:
                  medium: Memory
                  sizeLimit: 8Mi
                name: project-bootstrap-tmp

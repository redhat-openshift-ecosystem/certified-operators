                    weight: 1
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: In
                        values:
                        - ""
                    weight: 1
              containers:
              - args:
                - --leader-elect
                command:
                - /metax-operator
                env:

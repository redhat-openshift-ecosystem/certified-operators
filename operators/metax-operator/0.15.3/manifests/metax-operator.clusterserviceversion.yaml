                app.kubernetes.io/instance: metax-operator
                app.kubernetes.io/name: metax-operator
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/master
                        operator: In
                        values:

                imagePullPolicy: IfNotPresent
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: metax-operator
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                securityContext:
                  privileged: true
                  runAsUser: 0
                volumeMounts:
                - name: metax-runtime
                  mountPath: /run/metax
              volumes:
              - name: metax-runtime
                hostPath:
                  path: /run/metax
                  type: DirectoryOrCreate
              securityContext: {}
              serviceAccountName: metax-operator
              tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/master
                operator: Equal
                value: ""
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Equal
                value: ""

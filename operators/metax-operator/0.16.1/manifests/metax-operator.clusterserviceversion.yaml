              labels:
                app.kubernetes.io/component: metax-operator
                app.kubernetes.io/instance: metax-operator
                app.kubernetes.io/name: metax-operator
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/master
                        operator: In
                        values:
                        - ""
                    weight: 1
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: In
                        values:
                        - ""
                    weight: 1
              containers:
              - args:
                - --leader-elect
                command:
                - /metax-operator

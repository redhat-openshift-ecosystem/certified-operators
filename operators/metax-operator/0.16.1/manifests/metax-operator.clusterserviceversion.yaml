                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: metax-operator
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                securityContext:
                  privileged: true
                  runAsUser: 0
                volumeMounts:
                - name: metax-runtime
                  mountPath: /run/metax
              volumes:

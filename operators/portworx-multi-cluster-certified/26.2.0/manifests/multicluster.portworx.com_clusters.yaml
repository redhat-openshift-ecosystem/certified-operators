---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusters.multicluster.portworx.com
spec:
  group: multicluster.portworx.com
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the clusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state and configuration of
              a cluster
            properties:
              clusterName:
                description: ClusterName represents the name of the storage cluster
                  as configured in the cluster environment
                type: string
              clusterNamespace:
                description: ClusterNamespace represents the namespace of the storage
                  cluster as configured in the cluster environment
                type: string
            type: object
          status:
            description: ClusterStatus defines the observed state and runtime information
              of a cluster
            properties:
              capacity:
                description: Storage capacity information including total and used
                  capacity
                properties:
                  total:
                    description: Total storage capacity of the cluster in bytes
                    format: int64
                    type: integer
                  used:
                    description: Used storage capacity of the cluster in bytes
                    format: int64
                    type: integer
                type: object
              drAdminNamespace:
                description: Admin namespace configured for the cluster for DR operations
                  through Stork
                type: string
              drCapable:
                description: Indicates whether the cluster is capable of disaster
                  recovery operations
                type: boolean
              drReadiness:
                additionalProperties:
                  description: DrReadinessCheckDetails contains detailed information
                    about a specific DR readiness check
                  properties:
                    info:
                      description: Info provides additional details about the check
                        result
                      type: string
                    status:
                      description: Status of the readiness check (e.g., "passed",
                        "failed", "warning")
                      type: string
                  type: object
                description: |-
                  Map of DR readiness checks with their detailed status and information
                  Key is the readiness check name defined in DrReadinessCheckKey and value is the readiness check details
                type: object
              health:
                description: Overall health status of the cluster (e.g., "healthy",
                  "degraded", "offline")
                type: string
              lastStatusUpdateTimestamp:
                description: Timestamp of last update of the cluster status
                type: string
              license:
                description: License information including SKU and expiry details
                properties:
                  expiry:
                    description: Expiration date of the license in ISO 8601 format
                    type: string
                  sku:
                    description: Stock Keeping Unit (SKU) identifier of the license
                    type: string
                type: object
              monitoringStatus:
                description: Status of monitoring services on the cluster
                type: string
              pxOperatorVersion:
                description: Version of Portworx Operator installed on the cluster
                type: string
              pxSecretsProviderType:
                description: Type of secrets provider used by the cluster (e.g., "vault",
                  "k8s")
                type: string
              pxSecurityChecksum:
                description: Checksum of secret sync used in  the PX security configuration
                type: string
              pxSecurityEnabled:
                description: Indicates whether PX security is enabled on the cluster
                type: boolean
              pxVersion:
                description: Version of Portworx software installed on the cluster
                type: string
              storageClusterUid:
                description: Unique identifier of the storage cluster
                type: string
              telemetryStatus:
                description: Status of telemetry collection on the cluster
                type: string
              topology:
                description: Topology information including regions, zones, and racks
                properties:
                  racks:
                    description: List of racks where the cluster nodes are deployed
                    items:
                      type: string
                    type: array
                  regions:
                    description: List of regions where the cluster nodes are deployed
                    items:
                      type: string
                    type: array
                  zones:
                    description: List of availability zones where the cluster nodes
                      are deployed
                    items:
                      type: string
                    type: array
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

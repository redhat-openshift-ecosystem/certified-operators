apiVersion: v1
kind: ConfigMap
metadata:
  name: px-multi-cluster-operator-config
  labels:
    app.kubernetes.io/name: px-multi-cluster-operator
    app.kubernetes.io/instance: px-multi-cluster-operator
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: px-multi-cluster-operator
data:
  # ALERTING_ENABLED toggles deployment of the px-dr ServiceMonitor and
  # PrometheusRule in the operator namespace. Set to "true" to enable.
  # Changes apply live — the operator watches this ConfigMap and re-applies
  # the manifests without a pod restart.
  ALERTING_ENABLED: "true"

  # ALERT_OVERRIDES customizes specific alert rules without forking the
  # operator. Keys must match alert names defined in the embedded
  # PrometheusRule. Invalid ALERT_OVERRIDES are logged; the operator falls
  # back to last-known-good rules.
  #
  # Per-alert fields:
  #   for:      Prometheus duration the condition must hold before firing
  #             (e.g. "5m", "1h30m", "7d", "2w"). Prometheus format — supports
  #             ms/s/m/h/d/w/y units.
  #   severity: one of "info", "warning", "critical".
  #
  # Example (commented out by default — defaults shipped with the operator
  # are used when this key is empty or absent):
  #
  # ALERT_OVERRIDES: |
  #   PortworxDisasterRecoveryPairNotReady:
  #     for: 10m
  #     severity: warning
  #   PortworxDisasterRecoveryUnhealthyProtectionState:
  #     severity: critical
  ALERT_OVERRIDES: ""

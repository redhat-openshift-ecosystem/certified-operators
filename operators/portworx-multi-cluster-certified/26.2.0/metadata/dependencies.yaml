---
# NOTE: ACM (Advanced Cluster Management) is a prerequisite for this operator.
# ManagedCluster GVK is required. Other ACM APIs (ManagedClusterView, Policy)
# are also used.
#
# IMPORTANT: We intentionally do NOT declare OLM dependencies here because:
# 1. olm.gvk dependencies don't work - ACM's operators don't declare ManagedCluster
#    as an owned CRD in their CSVs
# 2. olm.package dependencies cause OLM to install/copy the dependent operator
#    into the same namespace, which is not desired
#
# ACM must be installed as a documented prerequisite before installing this operator.
dependencies: []

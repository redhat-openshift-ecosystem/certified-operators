  description: |
    The SAS OpenSearch Operator manages the lifecycle of OpenSearch clusters
    (represented by the `OpenDistroCluster` CRD) inside SAS Viya deployments
    on OpenShift.

    ## Features

    - Full lifecycle management of Kubernetes objects required for OpenSearch
    - Rolling upgrades across OpenSearch major versions (1.x → 2.x → 3.x)
    - TLS certificate management
    - Suspend/resume support
    - Namespace-scoped deployment
  displayName: SAS OpenSearch Operator

    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StorageClusterOps is a one-shot operational CR targeting a single SimplyblocksStorageCluster.
          Analogous to a Kubernetes Job — it drives a cluster-level operation (activate, expand,
          shutdown, restart, node-rolling-restart) to completion and records the result. Only one
          StorageClusterOps can be active per cluster at a time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StorageClusterOpsSpec defines the desired state of a StorageClusterOps.
            properties:
              action:
                description: Action is the operation to perform. Immutable.
                enum:
                - activate
                - expand
                - shutdown
                - start
                - restart
                - node-rolling-restart
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              clusterRef:
                description: ClusterRef is the name of the target SimplyblocksStorageCluster.
                  Immutable.
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              nodeRollingRestart:
                description: |-
                  NodeRollingRestart configures behaviour specific to the node-rolling-restart action.
                  Ignored for all other actions.
                properties:
                  refreshSNodeAPI:
                    description: |-
                      RefreshSNodeAPI restarts the storage-node DaemonSet pod on each node
                      after the backend node is shut down and before it is restarted, ensuring
                      the latest image is running before the node comes back online.
                    type: boolean
                type: object
            required:
            - action
            - clusterRef
            type: object
          status:
            description: StorageClusterOpsStatus holds the observed state of a StorageClusterOps.
            properties:
              completedAt:
                description: CompletedAt is when the operation finished (successfully
                  or not).
                format: date-time
                type: string
              message:
                description: Message is a human-readable description of the current
                  state or failure reason.
                type: string
              nodeRollingRestartStatus:
                description: |-
                  NodeRollingRestartStatus tracks per-node progress for the node-rolling-restart action.
                  Nil for all other actions.
                properties:
                  nodePhase:
                    description: |-
                      NodePhase is the current step for the node being restarted:
                      "snode-refresh" | "snode-refresh-wait" | "shutting-down" | "restarting" | "rebalancing"
                    type: string
                  pendingNodes:
                    description: PendingNodes is the ordered list of node UUIDs still
                      to be restarted.
                    items:
                      type: string
                    type: array
                  phaseTriggered:
                    description: PhaseTriggered indicates the API call for the current
                      NodePhase was already sent.
                    type: boolean
                  processedNodes:
                    description: ProcessedNodes is the list of node UUIDs already
                      restarted.
                    items:
                      type: string
                    type: array
                type: object
              phase:
                description: Phase is the high-level lifecycle phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startedAt:
                description: StartedAt is when the operation began.
                format: date-time
                type: string
              triggered:
                description: |-
                  Triggered indicates the backend POST has been sent for this operation.
                  Guards against duplicate backend calls on retry.
                type: boolean
            type: object
        type: object

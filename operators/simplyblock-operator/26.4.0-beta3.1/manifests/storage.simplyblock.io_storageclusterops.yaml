    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          StorageClusterOps is a single operation performed against one StorageCluster.
          It runs to a terminal phase and stays afterward as the audit record of what
          was done, to which cluster, with which parameters, and how it ended. Only one
          operation acts on a cluster at a time; a second is admitted, waits at
          Pending, and runs when the lock frees.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StorageClusterOpsSpec is one operation to perform against
              one StorageCluster.
            properties:
              abort:
                description: |-
                  Abort asks a running operation to stop at its next step and unwind.
                  Whether an abort is expressible from the current step is declared by that
                  action's graph rather than checked here.
                type: boolean
              action:
                description: Action is the operation to perform.
                enum:
                - Activate
                - Expand
                - Shutdown
                - Start
                - Restart
                - RollingRestart
                - CancelTask
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              cancelTask:
                description: CancelTask parameterizes action CancelTask and is ignored
                  by the others.
                properties:
                  taskID:
                    description: |-
                      TaskID names the entry of StorageCluster.status.tasks to cancel, by the
                      control plane's identifier for it rather than by its position in the
                      list.
                    type: string
                    x-kubernetes-validations:
                    - message: field is immutable
                      rule: self == oldSelf
                required:
                - taskID
                type: object
              clusterRef:
                description: |-
                  ClusterRef names the StorageCluster this operation acts on. The operation
                  never owns its target, because deleting the record of an operation must
                  not delete the cluster it operated on.

                  Bounded at what a StorageCluster name may be, since a longer value names
                  nothing that can exist.
                maxLength: 63
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              rollingRestart:
                description: |-
                  RollingRestart parameterizes action RollingRestart and is ignored by the
                  others.
                properties:
                  refreshSNodeAPI:
                    description: |-
                      RefreshSNodeAPI restarts each node's storage-node DaemonSet pod between
                      its shutdown and its restart, so the latest image is running when the
                      node returns.
                    type: boolean
                type: object
            required:
            - action
            - clusterRef
            type: object
          status:
            description: StorageClusterOpsStatus is the observed state of one cluster
              operation.
            properties:
              completedAt:
                description: CompletedAt is when it reached a terminal phase.
                format: date-time
                type: string
              message:
                description: |-
                  Message is the reason the phase is what it is: one sentence, replaced as
                  the operation moves, and never a log.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation the rest of this status was computed
                  from, so a stale status can be told from a current one.
                format: int64
                type: integer
              phase:
                description: Phase is the operation's own progress.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Aborted
                type: string
              rollingRestart:
                description: |-
                  RollingRestart is the walk's position, set only for action
                  RollingRestart.
                properties:
                  nodeIndex:
                    description: |-
                      NodeIndex is the position in Nodes of the node being restarted. Advancing
                      the walk increments it, and the walk is complete when it reaches
                      len(Nodes).

                      No omitempty: zero is a valid index, and a field that disappears at zero
                      makes "the first node" and "unset" the same wire value.
                    format: int32
                    minimum: 0
                    type: integer
                  nodes:
                    description: |-
                      Nodes is the ordered list of storage node UUIDs this action covers,
                      written once when the walk starts and not modified afterward, so a node
                      added mid-walk is not restarted and one removed mid-walk is skipped when
                      the walk reaches it.
                    items:
                      type: string
                    type: array
                  skipped:
                    description: |-
                      Skipped are the nodes of Nodes the walk passed over without restarting
                      them, in walk order: a node the control plane stopped listing, or one
                      whose removal started after the walk was planned. A node leaving the
                      cluster belongs to its removal, and the walk sends it nothing.
                    items:
                      type: string
                    type: array
                required:
                - nodeIndex
                type: object
              startedAt:
                description: StartedAt is when the operation acquired its target's
                  lock.
                format: date-time
                type: string
              step:
                description: |-
                  Step is the position of the running action's state machine. The value is
                  one of the steps the running action declares.
                properties:
                  claim:
                    description: |-
                      Claim records that this state's side effect was started. Absent means
                      no pass has started it since the state was entered.
                    properties:
                      attempt:
                        description: Attempt counts the claims taken on this state,
                          starting at 1.
                        format: int32
                        type: integer
                      leaseUntil:
                        description: |-
                          LeaseUntil is when the claim expires and the side effect may be fired
                          again.
                        format: date-time
                        type: string
                      state:
                        description: State is the state the claim was taken in.
                        type: string
                    required:
                    - attempt
                    - leaseUntil
                    - state
                    type: object
                  deadline:
                    description: |-
                      Deadline is when that state expires, absent when it has none. It is an
                      absolute instant, so a state whose deadline passed while the controller
                      was down restores as already expired.
                    format: date-time
                    type: string
                  state:
                    description: |-
                      State is the state the machine was in. Empty means the resource has not
                      been reconciled yet, and restores to the graph's initial state.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: unknown step
                  rule: '!has(self.state) || self.state in [''Requesting'',''Awaiting'',''ShuttingDown'',''Starting'',''CheckingPeers'',''ShuttingDownNode'',''RefreshingPod'',''AwaitingPod'',''RestartingNode'',''Rebalancing'']'
            type: object
        type: object

                  namespace defaults to this operation's. A backup in another namespace needs
                  the requesting user to be allowed to read it there. Set exactly one of this
                  and GroupBackupID: an operation acts on one backup or on a whole group
                  backup.
                properties:
                  name:
                    description: Name is the object's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the object's namespace. When it is empty, the namespace of the
                      object that holds the reference.
                    maxLength: 63
                    type: string
                required:

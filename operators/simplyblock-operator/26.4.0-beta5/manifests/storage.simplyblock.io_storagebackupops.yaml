                - targetPool
                type: object
                x-kubernetes-validations:
                - message: field claimLabels is immutable once set
                  rule: '!has(oldSelf.claimLabels) || has(self.claimLabels)'
                - message: field claimAnnotations is immutable once set
                  rule: '!has(oldSelf.claimAnnotations) || has(self.claimAnnotations)'
                - message: field volumeMode is immutable once set
                  rule: '!has(oldSelf.volumeMode) || has(self.volumeMode)'
            required:
            - action
            - clusterRef
            type: object
            x-kubernetes-validations:
            - message: field backupRef is immutable once set

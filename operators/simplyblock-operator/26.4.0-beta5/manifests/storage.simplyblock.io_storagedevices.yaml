apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  creationTimestamp: null
  name: storagedevices.storage.simplyblock.io
spec:
  group: storage.simplyblock.io
  names:
    kind: StorageDevice
    listKind: StorageDeviceList
    plural: storagedevices
    shortNames:
    - sd
    singular: storagedevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeRef
      name: Node
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.role
      name: Role
      type: string
    - jsonPath: .status.deviceStatus
      name: Status
      type: string
    - jsonPath: .status.capacity.totalBytes
      name: Total
      type: integer
    - jsonPath: .status.health.performance.verdict
      name: Performance
      type: string
    - jsonPath: .status.health.smart.verdict
      name: SMART
      type: string
    - jsonPath: .status.hardware.pciAddress

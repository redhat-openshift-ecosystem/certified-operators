  name: simplyblock-operator.v26.4.0-beta6
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - description: BackupImport is the Schema for the backupimports API.
        displayName: Backup Import
        kind: BackupImport
        name: backupimports.storage.simplyblock.io
        version: v1alpha1
      - description: BackupPolicy is the Schema for the backuppolicies API.
        displayName: Backup Policy
        kind: BackupPolicy
        name: backuppolicies.storage.simplyblock.io
        version: v1alpha1
      - description: BackupRestore is the Schema for the backuprestores API.
        displayName: Backup Restore
        kind: BackupRestore
        name: backuprestores.storage.simplyblock.io
        resources:
          - kind: PersistentVolumeClaim
            name: restored-claim
            version: v1
          - kind: PersistentVolume
            name: restored-volume
            version: v1
        specDescriptors:
          - description: BackupRef references the StorageBackup resource to restore from.
            displayName: Backup Ref
            path: backupRef
          - description: Name is the StorageBackup resource name.
            displayName: Backup Name
            path: backupRef.name
          - description: ClusterName is the target storage cluster name.
            displayName: Cluster Name
            path: clusterName
          - description: PVCTemplate describes the PVC to create once the restore completes.
            displayName: PVC Template
            path: pvcTemplate
          - description: |-
              TargetNode is the UUID of the storage node to restore onto.
              Defaults to the node that originally held the backup.
            displayName: Target Node
            path: targetNode
          - description: |-
              TargetPool overrides the pool to restore into.
              Defaults to the source backup's pool.
            displayName: Target Pool
            path: targetPool
        statusDescriptors:
          - description: Message contains the latest reconciliation detail or error.
            displayName: Message
            path: message
          - description: Phase is the high-level lifecycle shown in kubectl output.
            displayName: Phase
            path: phase
          - description: PVName is the name of the PersistentVolume created by the controller.
            displayName: Persistent Volume
            path: pvName
          - description: PVCName is the name of the PersistentVolumeClaim created from pvcTemplate.
            displayName: PersistentVolumeClaim
            path: pvcName
          - description: RestoredLvolID is the UUID of the newly-created logical volume.
            displayName: Restored LVOL ID
            path: restoredLvolID
        version: v1alpha1
      - description: ClusterDeploymentConfig is the Schema for the clusterdeploymentconfigs API.
        displayName: Cluster Deployment Config
        kind: ClusterDeploymentConfig
        name: clusterdeploymentconfigs.storage.simplyblock.io
        specDescriptors:
          - description: Deploy this configuration. Devices listed in nodeSets are formatted. Review nodeSets in the YAML tab before approving.
            displayName: Approved
            path: approved
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
          - description: Workers, devices, and interfaces simplyblock may take.
            displayName: Node Sets
            path: nodeSets
        statusDescriptors:
          - description: Lifecycle phase of the deployment.
            displayName: Phase
            path: phase
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - description: The StorageCluster created from this configuration.
            displayName: Storage Cluster
            path: clusterRef
          - description: StorageNodes created from this configuration.
            displayName: Storage Nodes
            path: nodeRefs
          - description: Human-readable detail on the current phase.
            displayName: Message
            path: message
        version: v1alpha2
      - description: ControlPlaneOps is a single operation performed against the control plane. It runs to a terminal phase and stays afterward as the audit record of what was done, with which parameters, and how it ended. Only one may be active per control plane at a time, which the control plane's status.activeOpsRef enforces.
        displayName: Control Plane Ops
        kind: ControlPlaneOps
        name: controlplaneops.storage.simplyblock.io
        version: v1alpha2
      - kind: ControlPlane
        name: controlplanes.storage.simplyblock.io
        version: v1alpha1
      - description: ControlPlane is the simplyblock control plane for one Kubernetes cluster, FoundationDB together with the management API, either installed by the operator or already existing. It is a singleton named "simplyblock", and it is the root of the ownership spine, so nothing else in this API group reconciles meaningfully before it reports Available.
        displayName: Control Plane
        kind: ControlPlane
        name: controlplanes.storage.simplyblock.io
        specDescriptors:
          - description: Where the control plane comes from. source.local installs it in this cluster from the given image.
            displayName: Source
            path: source
        statusDescriptors:
          - description: Lifecycle phase of the control plane.
            displayName: Phase
            path: phase
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - description: URL of the management API.
            displayName: Endpoint
            path: endpoint
            x-descriptors:
              - urn:alm:descriptor:text
          - description: Running control plane version.
            displayName: Version
            path: version
          - description: Human-readable detail on the current phase.
            displayName: Message
            path: message
        version: v1alpha2
      - description: NFSExport is one pNFS export, a filesystem on one volume that is served from one host and mounted by many.
        displayName: NFS Export
        kind: NFSExport
        name: nfsexports.storage.simplyblock.io
        version: v1alpha2
      - description: ObjectStore is one S3 gateway, comprising the Deployment that serves the buckets delivered to it, its Service, and that Service's serving certificate.
        displayName: Object Store
        kind: ObjectStore
        name: objectstores.storage.simplyblock.io
        version: v1alpha2
      - description: OperatorOps is the Schema for the operatorops API.
        displayName: Operator Ops
        kind: OperatorOps
        name: operatorops.storage.simplyblock.io
        specDescriptors:
          - description: The operation to run. Discover probes the workers and writes a draft ClusterDeploymentConfig.
            displayName: Action
            path: action
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:select:Discover
          - description: Name of the ClusterDeploymentConfig to write. Defaults to discovered-<this resource>.
            displayName: Draft Name
            path: discover.configName
          - description: Only inspect these workers. Empty inspects every schedulable worker.
            displayName: Workers
            path: discover.workers
          - description: Also inspect control-plane nodes. Their taints must be tolerated.
            displayName: Include Control-Plane Nodes
            path: discover.enableControlPlaneNodes
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
          - description: Also report devices that carry a stale partition table.
            displayName: Report Partitioned Devices
            path: discover.enablePartitionedDevices
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        statusDescriptors:
          - description: Lifecycle phase of the operation.
            displayName: Phase
            path: phase
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - description: The ClusterDeploymentConfig the discovery wrote. Review and approve it to deploy.
            displayName: Draft Config
            path: configRef
          - description: Human-readable detail on the current phase.
            displayName: Message
            path: message
        version: v1alpha2
      - description: PersistentVolumeOps is a single operation performed against one PersistentVolume. It is the one Ops kind in this group whose target is a core Kubernetes type rather than a kind this group defines, so it locks its target with an annotation rather than a status field, is cluster-scoped because its target is, cannot be owned by the namespaced operation that created it, and derives its cluster, pool, and volume from the volume's CSI handle rather than being told.
        displayName: Persistent Volume Ops
        kind: PersistentVolumeOps
        name: persistentvolumeops.storage.simplyblock.io
        version: v1alpha2
      - description: ReplicationOps is the Schema for the replicationops API.
        displayName: Replication Ops
        kind: ReplicationOps
        name: replicationops.storage.simplyblock.io
        version: v1alpha1
      - description: ReplicationPair is the Schema for the replicationpairs API.
        displayName: Replication Pair
        kind: ReplicationPair
        name: replicationpairs.storage.simplyblock.io
        version: v1alpha1
      - description: ReplicationPolicy is the Schema for the replicationpolicies API.
        displayName: Replication Policy
        kind: ReplicationPolicy
        name: replicationpolicies.storage.simplyblock.io
        version: v1alpha1
      - description: ReplicationSlot is the Schema for the replicationslots API.
        displayName: Replication Slot
        kind: ReplicationSlot
        name: replicationslots.storage.simplyblock.io
        version: v1alpha1
      - description: S3Bucket is one bucket on an ObjectStore's gateway, backed by a volume the CSI driver provisions and an NFSExport that serves it, delivered as a mount to every node the gateway runs on.
        displayName: S3 Bucket
        kind: S3Bucket
        name: s3buckets.storage.simplyblock.io
        version: v1alpha2
      - description: SimplyblockDriver is the Schema for the simplyblockdrivers API.
        displayName: Simplyblock Driver
        kind: SimplyblockDriver
        name: simplyblockdrivers.storage.simplyblock.io
        specDescriptors:
          - description: CSI driver name registered with Kubernetes.
            displayName: Driver Name
            path: driverName
          - description: Install the snapshot controller and VolumeSnapshotClass.
            displayName: Enable Volume Snapshots
            path: enableVolumeSnapshots
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        statusDescriptors:
          - description: Lifecycle phase of the driver. Unavailable until a storage cluster exists.
            displayName: Phase
            path: phase
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - description: Node plugins that are ready.
            displayName: Nodes Ready
            path: nodesReady
          - description: Node plugins scheduled.
            displayName: Nodes Total
            path: nodesTotal
          - description: Whether the controller plugin is ready.
            displayName: Controller Ready
            path: controllerReady
          - description: Human-readable detail on the current phase.
            displayName: Message
            path: message
        version: v1alpha2
      - description: StorageBackupOps is a single operation performed against one StorageBackup. It runs to a terminal phase and stays afterward as the audit record of what was restored, into which pool, and how it ended. The claim a restore produces outlives it.
        displayName: Storage Backup Ops
        kind: StorageBackupOps
        name: storagebackupops.storage.simplyblock.io
        version: v1alpha2
      - description: StorageBackupPolicy schedules and retains the backups of the claims it selects. It is the only thing that decides a backup is taken; the copies themselves are the control plane's, are pruned by its retention, and reach Kubernetes as StorageBackup objects the operator discovers.
        displayName: Storage Backup Policy
        kind: StorageBackupPolicy
        name: storagebackuppolicies.storage.simplyblock.io
        version: v1alpha2
      - description: StorageBackup is the Schema for the storagebackups API.
        displayName: Storage Backup
        kind: StorageBackup
        name: storagebackups.storage.simplyblock.io
        resources:
          - kind: PersistentVolumeClaim
            name: source-claim
            version: v1
          - kind: PersistentVolume
            name: source-volume
            version: v1
        specDescriptors:
          - description: ClusterName is the target storage cluster name.
            displayName: Cluster Name
            path: clusterName
          - description: |-
              PVCRef identifies the PVC whose backing Simplyblock volume should be snapshotted and backed up.
              Not required when SourceClusterUUID is set (imported backup).
            displayName: PVC Ref
            path: pvcRef
          - description: Name is the PVC name.
            displayName: PVC Name
            path: pvcRef.name
          - description: Namespace overrides the backup resource namespace for the PVC lookup.
            displayName: PVC Namespace
            path: pvcRef.namespace
          - description: SnapshotName optionally overrides the internally-created snapshot name.
            displayName: Snapshot Name
            path: snapshotName
          - description: |-
              SourceClusterUUID, when non-empty, marks this StorageBackup as imported from another cluster.
              The StorageBackup controller will not create snapshots or backups for imported resources.
              Set by the BackupImport controller; do not set manually.
            displayName: Source Cluster UUID
            path: sourceClusterUUID
        statusDescriptors:
          - description: BackupID is the backend backup UUID.
            displayName: Backup ID
            path: backupID
          - description: Message contains the latest reconciliation detail or error.
            displayName: Message
            path: message
          - description: Phase is the high-level backup lifecycle shown in kubectl output.
            displayName: Phase
            path: phase
          - description: SnapshotName is the snapshot name used for the backup request.
            displayName: Snapshot Name
            path: snapshotName
        version: v1alpha1
      - kind: StorageBackup
        name: storagebackups.storage.simplyblock.io
        version: v1alpha2
      - description: StorageClusterOps is the Schema for the storageclusterops API.
        displayName: Storage Cluster Ops
        kind: StorageClusterOps
        name: storageclusterops.storage.simplyblock.io
        version: v1alpha1
      - kind: StorageClusterOps
        name: storageclusterops.storage.simplyblock.io
        version: v1alpha2
      - description: StorageCluster is the Schema for the storageclusters API
        displayName: Storage Cluster
        kind: StorageCluster
        name: storageclusters.storage.simplyblock.io
        resources:
          - kind: Secret
            name: simplyblock-cluster-credentials
            version: v1
        specDescriptors:
          - description: Action triggers a cluster-level action.
            displayName: Action
            path: action
          - description: Backup specifies the specification for backup to S3 configuration
            displayName: Backup
            path: backup
          - description: Name is the name of the Secret in the same namespace as the cluster CR.
            displayName: Backup Credentials Secret
            path: backup.credentialsSecretRef.name
          - description: BlockSize defines the logical block size in bytes.
            displayName: Block Size
            path: blockSize
          - description: ClientDataIfname defines the client data network interface.
            displayName: Client Data Interface
            path: clientDataIfname
          - description: ClientQpairCount defines client-side queue-pair count.
            displayName: Client Queue Pair Count
            path: clientQpairCount
          - description: CriticalThresholdSpec defines critical-level capacity thresholds.
            displayName: Critical Threshold
            path: criticalThreshold
          - description: EnableNodeAffinity enables node-affinity placement for storage components.
            displayName: Enable Node Affinity
            path: enableNodeAffinity
          - description: FabricType defines the storage fabric type.
            displayName: Fabric Type
            path: fabricType
          - description: HAType defines the backend high-availability mode.
            displayName: HA Type
            path: haType
          - description: InflightIOThreshold defines the inflight I/O threshold.
            displayName: Inflight IO Threshold
            path: inflightIOThreshold
          - description: IsSingleNode enables single-node cluster mode.
            displayName: Single Node
            path: isSingleNode
          - description: MaxFaultTolerance defines the maximum tolerated concurrent faults.
            displayName: Max Fault Tolerance
            path: maxFaultTolerance
          - description: 'MaxHugePagesSize is the maximum allocatable size of huge pages on each storage node (e.g. "100G", "1T"; a bare number is interpreted as GB). It is a floor, not a cap: the effective huge-page allocation is the larger of this value and the minimum the node''s device and subsystem count requires. When omitted the computed minimum is used.'
            displayName: Max Huge Pages Size
            path: maxHugePagesSize
          - description: MaxQueueSize defines the maximum backend queue size.
            displayName: Max Queue Size
            path: maxQueueSize
          - description: 'MaxSubsystemCount is the maximum number of NVMe-oF subsystems per storage node. Applies to every storage node in the cluster. Required: it sizes huge pages, and a node that receives no value fails config generation outright rather than falling back to a default.'
            displayName: Max Subsystem Count
            path: maxSubsystemCount
          - description: NodeRollingRestart configures the node-rolling-restart action.
            displayName: Node Recycle
            path: nodeRollingRestart
          - description: NvmfBasePort defines the base NVMf service port.
            displayName: NVMf Base Port
            path: nvmfBasePort
          - description: PageSizeInBlocks defines page size expressed in blocks.
            displayName: Page Size In Blocks
            path: pageSizeInBlocks
          - description: QpairCount defines the NVMe queue-pair count used by the cluster.
            displayName: Queue Pair Count
            path: qpairCount
          - description: RpcBasePort defines the base RPC service port.
            displayName: RPC Base Port
            path: rpcBasePort
          - description: SnodeApiPort defines the storage-node API port.
            displayName: Storage Node API Port
            path: snodeApiPort
          - description: StrictNodeAntiAffinity enforces strict anti-affinity between storage nodes.
            displayName: Strict Node Anti-Affinity
            path: strictNodeAntiAffinity
          - description: StripeSpec configures erasure-coding data/parity chunk counts.
            displayName: Stripe
            path: stripe
          - description: DataChunks defines the number of data chunks in the erasure-coding layout.
            displayName: Data Chunks
            path: stripe.dataChunks
          - description: 'VCPUCount is the number of vCPUs allocated to SPDK on each storage node. This is an explicit core count, not a percentage. Required: the core layout it produces must match across the cluster, so it is stated rather than left to a per-node heuristic.'
            displayName: vCPU Count
            path: vcpuCount
          - description: WarningThresholdSpec defines warning-level capacity thresholds.
            displayName: Warning Threshold
            path: warningThreshold
        statusDescriptors:
          - description: Message is a human-readable action result or error.
            displayName: Action Message
            path: actionStatus.message
          - displayName: Action State
            path: actionStatus.state
          - description: Configured indicates whether initial cluster setup completed.
            displayName: Configured
            path: configured
          - description: SecretName is the Kubernetes Secret containing cluster credentials.
            displayName: Cluster Secret
            path: secretName
          - description: Status is the backend-reported lifecycle status.
            displayName: Status
            path: status
          - description: UUID is the backend cluster UUID.
            displayName: Cluster UUID
            path: uuid
        version: v1alpha1
      - kind: StorageCluster
        name: storageclusters.storage.simplyblock.io
        version: v1alpha2
      - description: StorageDeviceOps is a single operation performed against one StorageDevice.
        displayName: Storage Device Ops
        kind: StorageDeviceOps
        name: storagedeviceops.storage.simplyblock.io
        version: v1alpha2
      - description: StorageDevice is the Schema for the storagedevices API.
        displayName: Storage Device
        kind: StorageDevice
        name: storagedevices.storage.simplyblock.io
        version: v1alpha2
      - description: StorageFenceRemediation applies the out-of-service taint to a node whose host the two-node arbiter fenced; NodeHealthCheck creates and deletes it.
        displayName: Storage Fence Remediation
        kind: StorageFenceRemediation
        name: storagefenceremediations.storage.simplyblock.io
        version: v1alpha2
      - description: StorageFenceRemediationTemplate is what a NodeHealthCheck names as its remediation template to remediate storage-fenced nodes.
        displayName: Storage Fence Remediation Template
        kind: StorageFenceRemediationTemplate
        name: storagefenceremediationtemplates.storage.simplyblock.io
        version: v1alpha2
      - description: StorageGroupBackup is one backup of a whole consistency group, taken on demand. One crash-consistent generation, every member backed up, committed as one unit. The member copies are recorded as StorageBackups beside it, and deleting it deletes no copy and no record.
        displayName: Storage Group Backup
        kind: StorageGroupBackup
        name: storagegroupbackups.storage.simplyblock.io
        specDescriptors:
          - description: ConsistencyGroupName is the group whose member claims are backed up, named by the storage.simplyblock.io/consistency-group label.
            displayName: Consistency Group Name
            path: source.consistencyGroupName
        statusDescriptors:
          - description: GroupBackupID is the control plane's identifier for the group backup, which a StorageBackupOps restore names.
            displayName: Group Backup ID
            path: groupBackupID
          - description: MemberCount is how many member copies must complete before the group backup is Available.
            displayName: Member Count
            path: memberCount
          - description: Message is the reason the phase is what it is.
            displayName: Message
            path: message
          - description: Phase is where the group backup has got to.
            displayName: Phase
            path: phase
        version: v1alpha2
      - description: StorageNodeOps is the Schema for the storagenodeops API.
        displayName: Storage Node Ops
        kind: StorageNodeOps
        name: storagenodeops.storage.simplyblock.io
        version: v1alpha1
      - kind: StorageNodeOps
        name: storagenodeops.storage.simplyblock.io
        version: v1alpha2
      - description: StorageNode is the Schema for the storagenodes API.
        displayName: Storage Node
        kind: StorageNode
        name: storagenodes.storage.simplyblock.io
        version: v1alpha1
      - kind: StorageNode
        name: storagenodes.storage.simplyblock.io
        version: v1alpha2
      - description: StorageNodeSet is the Schema for the storagenodesets API
        displayName: Storage Node
        kind: StorageNodeSet
        name: storagenodesets.storage.simplyblock.io
        resources:
          - kind: ClusterRole
            name: simplyblock-storage-node
            version: v1
          - kind: ClusterRoleBinding
            name: simplyblock-storage-node
            version: v1
          - kind: DaemonSet
            name: simplyblock-storage-node
            version: v1
          - kind: Service
            name: simplyblock-storage-node
            version: v1
          - kind: ServiceAccount
            name: simplyblock-storage-node
            version: v1
        specDescriptors:
          - description: Action triggers an imperative node operation.
            displayName: Action
            path: action
          - description: ClusterImage is the container image used for storage-node workloads.
            displayName: Cluster Image
            path: clusterImage
          - description: ClusterName is the target storage cluster name.
            displayName: Cluster Name
            path: clusterName
          - description: DataIfname lists data-plane network interfaces.
            displayName: Data Interfaces
            path: dataIfname

    alm-examples: |-
      [
        {
          "apiVersion": "storage.simplyblock.io/v1alpha2",
          "kind": "ControlPlane",
          "metadata": {
            "name": "simplyblock",
            "namespace": "simplyblock"
          },
          "spec": {
            "source": {
              "local": {
                "image": "quay.io/simplyblock-io/simplyblock:26.4.0-beta6@sha256:834284cff0d2e1b47626094b7b89a724f2af5c434bed3170e6ef08ab438e13e9"
              }
            }
          }
        },
        {
          "apiVersion": "storage.simplyblock.io/v1alpha2",
          "kind": "OperatorOps",
          "metadata": {
            "name": "discover-now",
            "namespace": "simplyblock"
          },
          "spec": {
            "action": "Discover"
          }
        },
        {
          "apiVersion": "storage.simplyblock.io/v1alpha2",
          "kind": "OperatorOps",
          "metadata": {
            "name": "discover-rack-b",
            "namespace": "simplyblock"
          },
          "spec": {
            "action": "Discover",
            "discover": {
              "configName": "rack-b-draft",
              "deviceFilter": {
                "driveSizeRange": "1T-4T",
                "pcieDenyList": [
                  "0000:00:1f.0"
                ]
              },
              "enablePartitionedDevices": true,
              "network": {
                "spdkOnHostNetwork": true
              },
              "nodeSelector": {
                "simplyblock.io/storage": "true"
              }
            }
          }
        },
        {
          "apiVersion": "storage.simplyblock.io/v1alpha2",
          "kind": "SimplyblockDriver",
          "metadata": {
            "name": "simplyblock",
            "namespace": "simplyblock"
          },
          "spec": {
            "driverName": "csi.simplyblock.io",
            "enableVolumeSnapshots": true
          }
        }
      ]
    capabilities: Basic Install
    categories: Storage
    com.redhat.openshift.versions: v4.19
    containerImage: quay.io/simplyblock-io/simplyblock-operator@sha256:71106e0fdd02b0f0a027e0a1d9fb192a1dc84d06845a110b02f40086686905eb
    createdAt: "2026-11-13T18:18:07Z"
    description: The Simplyblock Operator helps with installation, operation, and management
    features.operators.openshift.io/cnf: "false"

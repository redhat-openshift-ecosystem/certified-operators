  description: |
    The Simplyblock Operator installs, operates, and manages the simplyblock control plane, the storage plane, and the CSI driver.

    ## Before installing

    The operator and all simplyblock workloads run in the `simplyblock` namespace. Install the operator into that namespace (it is the suggested namespace). Its service accounts need the `privileged` and `anyuid` SCCs, and the namespace needs the `privileged` Pod Security level. In the web console, use **Import YAML** (the **+** button) and apply:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: simplyblock-scc-privileged
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:openshift:scc:privileged
    subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: system:serviceaccounts:simplyblock
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: simplyblock-scc-anyuid
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:openshift:scc:anyuid
    subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: system:serviceaccounts:simplyblock
    ```

    Then, under **Administration → Namespaces → simplyblock → Edit labels**, add `pod-security.kubernetes.io/enforce=privileged`, `pod-security.kubernetes.io/audit=privileged`, and `pod-security.kubernetes.io/warn=privileged`.

    ## Getting started

    After the operator reports *Succeeded*, open it under **Operators → Installed Operators** and create these resources from their tabs:

    1. **Control Plane**, named `simplyblock`. Wait until its phase is *Ready*.
    2. **Simplyblock Driver**, named `simplyblock`. It stays *Unavailable* until a storage cluster exists.
    3. **Operator Ops** with action *Discover*. It writes a draft **Cluster Deployment Config** named `discovered-<name>`.
    4. Open the draft on the **Cluster Deployment Config** tab, named `discovered-<name>`. Review its workers and devices in the YAML tab (listed devices are formatted), then turn on **Approved** to deploy.
    5. The storage cluster, nodes, and pool are managed by the operator and come up within several minutes. **Home → Search** shows their state.

    Only the Control Plane, Simplyblock Driver, and Operator Ops are meant to be created by hand; discovery creates the Cluster Deployment Config. The operator owns every other simplyblock resource, and they are hidden from this page.

    The full guide, including air-gapped installation, is at https://docs.simplyblock.io/latest/kubernetes/installation/openshift/.

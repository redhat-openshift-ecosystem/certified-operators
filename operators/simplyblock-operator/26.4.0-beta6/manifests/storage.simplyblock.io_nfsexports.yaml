apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  creationTimestamp: null
  name: nfsexports.storage.simplyblock.io
spec:
  group: storage.simplyblock.io
  names:
    kind: NFSExport
    listKind: NFSExportList
    plural: nfsexports
    shortNames:
    - nfsexp
    singular: nfsexport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.volumeRef
      name: Volume
      type: string
    - jsonPath: .status.mdsPodName
      name: MDS
      type: string
    - jsonPath: .status.mdsPodName
      name: MDSPod
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="MDSReady")].status
      name: MDSReady
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          NFSExport is one pNFS export: a volume, the host serving it, and the address
          clients mount.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NFSExportSpec is the desired state. The bound host is deliberately not here:
              it is an observed binding the operator owns, so it lives in status where a
              user edit cannot race it.
            properties:
              encrypted:
                description: |-
                  Encrypted says the control plane stacks a crypto bdev under this volume,
                  which makes an unwritten block read as pseudo-random plaintext rather
                  than as zeros. Assembly needs it: without it an empty encrypted volume
                  is mistaken for an occupied one, never formatted, and never mounts.

                  No omitempty: the field is immutable once set (below), and the CRD
                  enforces that by requiring it stay present once it is. The CSI
                  controller's unstructured Create always writes it explicitly, so an
                  unencrypted export's record already carries `encrypted: false` in
                  etcd; a typed client's own writes have to carry it too; omitempty
                  drops a false value from the JSON entirely, which reads to the CRD as
                  the field being removed and every subsequent write from this type --
                  starting with the reconciler's own finalizer add -- is then refused,
                  permanently, before the export can even begin assembling.
                type: boolean
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              exportPath:
                description: |-
                  ExportPath is the server-side mount point. It carries the namespace,
                  because a PVC name is unique only within one.
                pattern: ^/var/lib/simplyblock/exports/[A-Za-z0-9._-]+$
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              sizeBytes:
                description: |-
                  SizeBytes is the capacity the backing volume was last grown to.

                  It is not a request: the control plane has already resized the volume by
                  the time this is written. It is here so that growing one bumps the
                  record's generation, which is what tells the operator to re-assemble and
                  run xfs_growfs on the host -- the one machine that can, and the one no
                  CSI call ever reaches.
                format: int64
                type: integer
              volumeRef:
                description: |-
                  VolumeRef is the CSI volume handle of the volume this export serves, in
                  the ordinary {clusterID}:{poolID}:{lvolID} form. It names no Kubernetes
                  object, so it is validated by pattern rather than resolved by a webhook.

                  It is the whole identity of the export. The backing namespace UUID and
                  the NFS fsid are both the volume's own id, so they are read from here
                  rather than stored beside it, where they could disagree with it.

                  Deliberately not a form of its own. A pNFS volume is an lvol with an
                  export in front of it, so its claim keeps the lvol's handle and every
                  other CSI call -- snapshot, clone, expand -- addresses it without having
                  to know an export is there.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[^:]+:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
            required:
            - exportPath
            - volumeRef
            type: object
            x-kubernetes-validations:
            - message: field encrypted is immutable once set
              rule: '!has(oldSelf.encrypted) || has(self.encrypted)'
          status:
            description: NFSExportStatus is what the export currently is.
            properties:
              allowedClients:
                description: |-
                  AllowedClients is what goes into the exports(5) entry: the internal
                  address of every node that could run a pod using this volume.
                items:
                  type: string
                type: array
              assembledBy:
                description: |-
                  AssembledBy is the metadata server instance that last assembled this
                  export: the pod's UID and its runner container's ID. A guest that
                  restarted, in a new pod or in the same one, has lost its mounts and
                  exports, so a mismatch with the running instance means the export is
                  assembled again.
                type: string
              conditions:
                description: |-
                  Conditions report what the phase does not. MDSReady is True while the
                  metadata server answers for this export and its health check passes,
                  and False while clients cannot be served, with the reason and the
                  failure in its message. The phase stays Ready meanwhile, so a fault
                  that clears on its own needs nobody to act.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              mdsNodeIP:
                description: |-
                  MDSNodeIP is the metadata server pod's IP. Not what a client mounts: it
                  is what the export's Service's EndpointSlice points at, so a client's
                  mount address (ServiceAddress) does not have to change when this does.
                type: string
              mdsPodName:
                description: |-
                  MDSPodName is the metadata server pod serving this export, in the
                  operator's namespace. Empty until the export is bound.

                  One metadata server per export: no second one is a candidate until this
                  field is rewritten.
                type: string
              message:
                description: Message is a human-readable note on the current phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: Phase is the export's lifecycle position.
                enum:
                - Pending
                - Assembling
                - Ready
                - Degraded
                type: string
              phaseDeadline:
                description: |-
                  PhaseDeadline is when the current phase must be given up on. Persisted
                  because an operator restarted mid-assembly would otherwise grant a fresh
                  deadline on every pass and never time out.
                format: date-time
                type: string
              serviceAddress:
                description: |-
                  ServiceAddress is the ClusterIP of the Service fronting this export,
                  which is the address a client mounts. It outlives any one MDSNodeIP: the
                  operator repoints the Service's EndpointSlice at whichever host is bound
                  rather than changing this value, so a client's mount survives the export
                  moving to a different host (design-pnfs-rwx.md §13.3).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

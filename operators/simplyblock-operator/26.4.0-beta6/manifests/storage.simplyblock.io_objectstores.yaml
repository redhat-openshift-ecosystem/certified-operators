apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  creationTimestamp: null
  name: objectstores.storage.simplyblock.io
spec:
  group: storage.simplyblock.io
  names:
    kind: ObjectStore
    listKind: ObjectStoreList
    plural: objectstores
    shortNames:
    - s3store
    singular: objectstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          ObjectStore is the desired existence of one S3 gateway: its Deployment,
          its Service, and that Service's serving certificate. Every gateway pod
          carries the label storage.simplyblock.io/objectstore=<name>, which is how
          S3BucketReconciler finds them without reading this object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ObjectStoreSpec is the desired state of one S3 gateway's
              workload.
            properties:
              buckets:
                description: |-
                  Buckets is what every S3Bucket the gateway creates for an S3
                  CreateBucket request is provisioned with: the request itself carries
                  no size or storage class.
                properties:
                  capacityBytes:
                    description: CapacityBytes becomes each S3Bucket's spec.capacityBytes.
                    format: int64
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: |-
                      StorageClassName becomes each S3Bucket's spec.storageClassName. It
                      must select the pnfs fstype, the same requirement S3Bucket states.
                    minLength: 1
                    type: string
                required:
                - capacityBytes
                - storageClassName
                type: object
              envFrom:
                description: |-
                  EnvFrom is injected into the gateway container's environment
                  unmodified: the gateway's own credentials and Vault-backed IAM
                  configuration. This operator reads none of it.
                items:
                  description: EnvFromSource represents the source of a set of ConfigMaps
                    or Secrets
                  properties:
                    configMapRef:
                      description: The ConfigMap to select from
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the ConfigMap must be defined
                          type: boolean
                      type: object
                      x-kubernetes-map-type: atomic
                    prefix:
                      description: |-
                        Optional text to prepend to the name of each environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    secretRef:
                      description: The Secret to select from
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret must be defined
                          type: boolean
                      type: object
                      x-kubernetes-map-type: atomic
                  type: object
                type: array
              image:
                description: |-
                  Image is the gateway image: embedgw plus the simplyblock POSIX backend.
                  Required: unlike the CSI driver and the operator, this repository and
                  the gateway's are not released together, so there is no sensible
                  default.
                pattern: ^($|(([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[a-fA-F0-9:]+\])(:[0-9]+)?/)?[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*(:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}(@sha256:[a-f0-9]{64})?|@sha256:[a-f0-9]{64}))$
                type: string
              imagePullPolicy:
                default: Always
                description: |-
                  ImagePullPolicy controls when that image is pulled. Defaults to Always:
                  the default tag is a moving one, and IfNotPresent against a tag that
                  moved leaves workers at different versions invisibly.
                enum:
                - Always
                - Never
                - IfNotPresent
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector restricts which workers run gateway pods. Empty means
                  every schedulable worker: ordinary Deployment scheduling, no
                  gateway-specific node-pool concept.
                type: object
              port:
                description: |-
                  Port is the gateway's listening port, used as both the container port
                  and the Service's port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              region:
                default: us-east-1
                description: |-
                  Region is the AWS region string this gateway's S3 API answers to.
                  Every client must sign its requests for exactly this region; the
                  gateway rejects any other with AuthorizationHeaderMalformed. Also
                  reported by GetBucketLocation.
                type: string
              replicas:
                default: 1
                description: Replicas is the gateway Deployment's replica count.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: |-
                  Resources are the gateway container's requests and limits. Unset
                  enforces no limits.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              tlsProvider:
                default: OpenShift
                description: |-
                  TLSProvider selects how the Service's serving certificate is issued.
                  Always issued: an S3 gateway is assumed to always serve over TLS.
                enum:
                - OpenShift
                - cert-manager
                type: string
              tolerations:
                description: Tolerations let gateway pods schedule onto tainted nodes.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            required:
            - buckets
            - image
            - port
            type: object
          status:
            description: ObjectStoreStatus is what the gateway's provisioning currently
              is.
            properties:
              conditions:
                description: |-
                  Conditions carries why an ObjectStore is Degraded, which a phase
                  alone cannot express. Expected types: DeploymentAvailable,
                  CertificateReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the operator's own view of the deployment.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                type: string
              phaseDeadline:
                description: |-
                  PhaseDeadline is when the current phase gives up waiting and degrades,
                  carried in status rather than only in memory so a restarted operator
                  resumes the same deadline instead of granting a fresh one (§6, a design
                  gap the same field closed for S3BucketStatus: see
                  design-bucket-provisioning.md's own appendix note).
                format: date-time
                type: string
              readyReplicas:
                description: |-
                  ReadyReplicas mirrors Deployment.Status.ReadyReplicas, so a reader
                  does not have to look at the owned Deployment to answer "how many
                  gateway pods are actually serving."
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  creationTimestamp: null
  name: persistentvolumeops.storage.simplyblock.io
spec:
  group: storage.simplyblock.io
  names:
    kind: PersistentVolumeOps
    listKind: PersistentVolumeOpsList
    plural: persistentvolumeops
    shortNames:
    - pvops
    singular: persistentvolumeops
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.persistentVolumeName
      name: Volume
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.migrate.targetNodeRef.name

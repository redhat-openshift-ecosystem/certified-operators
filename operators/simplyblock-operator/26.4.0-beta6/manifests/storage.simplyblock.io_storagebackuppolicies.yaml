            - message: 'set at most one of claimSelector and consistencyGroupName:
                a policy backs up either independent claims or one whole consistency
                group'
              rule: '!(has(self.claimSelector) && has(self.consistencyGroupName))'
          status:
            description: status defines the observed state of StorageBackupPolicy
            properties:
              attachedClaims:
                description: |-
                  AttachedClaims are the claims the policy currently covers. Detaching one
                  stops new backups being taken and deletes none of the existing ones.
                items:

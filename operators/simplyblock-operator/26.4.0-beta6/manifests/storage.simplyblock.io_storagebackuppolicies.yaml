                      type: string
                    lvolID:
                      description: |-
                        LvolID is the logical volume the control plane attached the policy to. It
                        is what a detach addresses, and it is recorded per claim so that a claim
                        rebound onto a new volume is detached from the old one rather than
                        silently left attached.
                      type: string
                    name:
                      description: Name is the PersistentVolumeClaim's name in this
                        namespace.
                      type: string
                    persistentVolumeName:
                      description: PersistentVolumeName is the volume behind it.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              clusterID:
                description: ClusterID is the backend cluster the policy was created

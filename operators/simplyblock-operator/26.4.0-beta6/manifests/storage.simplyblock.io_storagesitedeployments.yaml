  name: storagesitedeployments.storage.simplyblock.io
spec:
  group: storage.simplyblock.io
  names:
    kind: StorageSiteDeployment
    listKind: StorageSiteDeploymentList
    plural: storagesitedeployments
    shortNames:
    - sbsd
    singular: storagesitedeployment
  scope: Namespaced

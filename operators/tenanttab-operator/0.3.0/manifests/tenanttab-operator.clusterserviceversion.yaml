      specDescriptors:
      - path: multiTenancy
        displayName: Multi-tenancy
      - path: route
        displayName: Route
      - path: components
        displayName: Components
      - path: multiTenancy.enabled
        displayName: Multi-tenant portal
        description: "Serve several teams from one dashboard, with the API server \u2014 not the dashboard\
          \ \u2014 enforcing what each may touch. Grants the dashboard impersonation."
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: multiTenancy.metering.schedule
        displayName: Metering interval
        description: Also the billing resolution. A meter that stops does not bill the gap, so a long
          interval under-bills rather than guessing.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - path: route.enabled
        displayName: Create a Route
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: route.host
        displayName: Route hostname
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: oidc.issuer
        displayName: SSO issuer URL
        description: The identity provider behind OpenShift, not OpenShift's own OAuth server.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: oidc.clientSecret
        displayName: SSO client secret
        description: Stored in this resource as plain text. Prefer existingSecret.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:password
      - path: license.secretName
        displayName: Licence Secret
        description: The Secret in this namespace that holds the Denegra licence under the key license.jwt.
          Leave empty for tenanttab-license. Without a valid licence the portal runs in demo mode.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: existingSecret.name
        displayName: Credentials Secret
        description: A Secret in this namespace holding the admin password, SSO client secret or other
          credentials, so they are not written in this resource. Name the key for each one under existingSecret.keys.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: components.veleroNamespace
        displayName: Velero namespace
        description: openshift-adp when Velero is installed through OADP.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: platformServices.redis.enabled
        displayName: Shared Redis cache
        description: Installs the shared Redis cache (Red Hat's Valkey 8 image) apps get through the Deploy
          page's cache binding, in this namespace. The portal's own account cannot install it on OpenShift.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: auth.adminPassword
        displayName: Admin password
        description: Leave empty and a strong one is generated on first install and kept across upgrades.
          Read it from the tenanttab-portal-auth Secret. A value typed here is stored in this resource
          as plain text; prefer existingSecret.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:password
      - path: vms.vgpuLicenseSecret
        displayName: vGPU licence Secret
        description: A Secret in each tenant namespace that orders vGPU machines, with the keys driver-url
          and client_configuration_token.tok. Virtual machines mount it read-only; its contents are never
          written into a VM. "off" when your images carry a licensed driver.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.oauth.enabled
        displayName: Sign in with OpenShift
        description: The cluster's own OAuth server signs people in. Needs the Route's host (route.host)
          or openshift.oauth.redirectUri.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: openshift.oauth.adminGroups
        displayName: OpenShift admin groups
        description: Comma-separated OpenShift groups whose members are platform admins.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.consoleLink.enabled
        displayName: Console menu link
        description: 'The portal in the console''s application menu, once route.host is set. Off by default:
          a ConsoleLink is cluster-scoped, so every console user sees it.'
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: openshift.consoleNotification.text
        displayName: Console banner
        description: Text of a banner across the OpenShift console, for maintenance windows. Shown while
          openshift.consoleNotification.enabled is on.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: vms.openshiftConsoleUrl
        displayName: OpenShift console URL
        description: Adds a link to each machine's console in the OpenShift web console.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability
        displayName: Reports and observability
      - path: observability.job.enabled
        displayName: Observability job
        description: A CronJob that probes catalog services, checks sign-ins for anomalies and makes the
          scheduled reports. Each report slot runs once, however many replicas there are.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.prometheusServiceAccountToken
        displayName: Send the service account token to Prometheus
        description: For OpenShift's Thanos querier (components.prometheusUrl). Bind the cluster-monitoring-view
          ClusterRole to the portal's service account.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.authAlerts.itsmWebhookUrl
        displayName: ITSM webhook for sign-in alerts
        description: Each sign-in alert opens one incident here (ServiceNow import set shape).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability.webhookSecret.name
        displayName: Webhook signing Secret
        description: A Secret with a key of 32 characters or more that signs the ITSM and reports webhooks.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: observability.otel.enabled
        displayName: OpenTelemetry tracing
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.otel.endpoint
        displayName: OTLP endpoint
        description: The OpenTelemetry collector or Tempo's OTLP HTTP port, e.g. http://otel-collector.observability.svc:4318.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability.otel.metrics.enabled
        displayName: OpenTelemetry metrics
        description: Also send the portal's metrics (model gateway counters per tenant, balance state
          and budget ratio) to <endpoint>/v1/metrics. Needs tracing on.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: metrics.billingAlerts.enabled
        displayName: Balance and budget alerts
        description: A PrometheusRule for low, empty and exhausted balances, budgets near or over, and
          a stopped meter. Needs the portal's metrics scraped (metrics.serviceMonitor.enabled).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry
        displayName: GPU telemetry
      - path: gpuTelemetry.enabled
        displayName: GPU use from DCGM
        description: Reads the GPU Operator's DCGM exporter series through components.prometheusUrl and
          shows utilisation and GPU health per tenant next to what Kueue allocated. Billing stays on allocation.
          Deploys no exporter.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry.serviceMonitor.enabled
        displayName: Scrape the DCGM exporter
        description: Only when the GPU Operator's own exporter ServiceMonitor is off.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry.alerts.enabled
        displayName: GPU health alerts
        description: A PrometheusRule for XID errors, ECC double-bit errors, row remap failures, high
          temperature and hardware clock slowdown. On OpenShift set gpuTelemetry.alerts.namespace to the
          GPU Operator's namespace.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      statusDescriptors:
      - path: conditions
        displayName: Conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - path: deployedRelease
        displayName: Deployed release
        description: The Helm release this resource reconciled into.

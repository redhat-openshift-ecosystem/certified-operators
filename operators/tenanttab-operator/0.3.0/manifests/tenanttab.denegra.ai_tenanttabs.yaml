    plural: tenanttabs
    singular: tenanttab
    shortNames: [tt]
  # Namespaced: the platform is installed into the namespace of the resource that asks for it,
  # so a cluster can carry more than one — a production portal and a staging one — without them
  # arguing over a single cluster-scoped singleton.
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:

                        impersonation: {type: boolean}
                        newIdp: {type: boolean}
                        itsmWebhookUrl: {type: string, pattern: '^(https?://.+)?$'}
                    reportsWebhookUrl: {type: string, pattern: '^(https?://.+)?$'}
                    webhookSecret:
                      type: object
                      properties:
                        name: {type: string}
                        key: {type: string}
                    otel:
                      type: object
                      properties:
                        enabled: {type: boolean, default: false}
                        endpoint: {type: string, pattern: '^(https?://.+)?$'}
                        serviceName: {type: string}
                        sampleRatio: {x-kubernetes-int-or-string: true}
                        egressPorts:
                          type: array
                          items: {type: integer, minimum: 1, maximum: 65535}
                        metrics:
                          type: object
                          properties:
                            enabled: {type: boolean, default: false}
                            intervalSeconds: {type: integer, minimum: 10, maximum: 3600}
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                tolerations:
                  type: array
                  items: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status:

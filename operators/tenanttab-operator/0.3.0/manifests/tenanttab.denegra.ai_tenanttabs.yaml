          type: string
          jsonPath: .status.conditions[?(@.type=='Deployed')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |
            A TenantTab platform install. Creating one makes the dashboard appear in this
            namespace; editing it reconfigures the install in place; deleting it removes it.

            The spec is the Helm chart's values, so anything documented in
            deploy/helm/tenanttab/values.yaml can be set here. The fields spelled out below are
            the ones worth a form field in a console; the rest are accepted as written.
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              # The chart has more knobs than are named here, and naming all of them would
              # freeze the CRD to one chart version. Unknown fields are passed through.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                replicaCount:
                  type: integer
                  minimum: 1
                  default: 1
                image:
                  type: object
                  properties:
                    # No repository or tag: the operator installs the portal image it was
                    # released with (RELATED_IMAGE_PORTAL) and overrides anything set here.
                    pullPolicy:
                      type: string
                      enum: [Always, IfNotPresent, Never]
                existingSecret:
                  type: object
                  description: |
                    Credentials read from a Secret in this namespace instead of being written
                    in this resource, where anyone allowed to read the resource could read
                    them. Name the Secret, and under keys the key that holds each credential.
                    A credential with no key keeps its usual source.
                  properties:
                    name: {type: string}
                    keys:
                      type: object
                      properties:
                        adminPassword: {type: string}
                        devPassword: {type: string}
                        viewerPassword: {type: string}
                        oidcClientSecret: {type: string}
                        metricsToken: {type: string}
                license:
                  type: object
                  description: |
                    The Denegra licence. Without a valid one the portal runs in demo mode: it
                    shows sample data and changes nothing, and the install is healthy all the
                    same. Create the Secret named here in this namespace with the licence file
                    under the key license.jwt, or upload the file on the portal's Licence page,
                    which writes the same Secret. Default tenanttab-license.
                  properties:
                    secretName:
                      type: string
                      pattern: '^([a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?)?$'
                auth:
                  type: object
                  description: |
                    Password login. Leave the passwords empty and strong ones are generated on
                    first install and kept across upgrades — read the admin password out of the
                    tenanttab-portal-auth Secret.
                  properties:
                    enabled: {type: boolean, default: true}
                    adminUser: {type: string, default: admin}
                    adminPassword: {type: string}
                    devUser: {type: string}
                    devGroups: {type: string}
                    viewerUser: {type: string}
                    viewerGroups: {type: string}
                    idleMinutes:
                      type: integer
                      minimum: 0
                      description: Sign out after this many minutes without activity (0 = never). Default 30.
                    maxSessions:
                      type: integer
                      minimum: 0
                      description: Concurrent sessions per user; past it the oldest ends (0 = no limit). Default 5.
                oidc:
                  type: object
                  description: |
                    Single sign-on; active once issuer and clientId are both set. On OpenShift,
                    point this at the identity provider BEHIND OpenShift — the cluster's own
                    OAuth server is not a general OIDC provider and issues no usable ID token.
                    To sign in with the cluster's own identity, use openshift.oauth instead.
                  properties:
                    issuer: {type: string}
                    clientId: {type: string}
                    clientSecret: {type: string}
                    redirectUri: {type: string}
                    scopes: {type: string}
                    roleClaim: {type: string}
                    adminValues:
                      type: string
                      description: Comma-separated claim values that grant platform admin.
                    supportValues:
                      type: string
                      description: Comma-separated claim values that grant platform support (read-only).
                    defaultRole:
                      type: string
                      enum: [viewer, none]
                    requireMfa:
                      type: boolean
                      description: Refuse a sign-in whose ID token shows no second factor (amr / acr). Applies to every IdP.
                    mfaAcrValues:
                      type: string
                      description: acr / acrs values that count as MFA, e.g. an Entra authentication context such as c1.
                    allowedDomains:
                      type: string
                      description: Comma-separated email/UPN domains this IdP may sign in. Empty = any.
                multiTenancy:
                  type: object
                  # Written into every resource, so `kubectl get` shows the mode that is in effect
                  # rather than a blank when the field was left out.
                  default: {}
                  description: |
                    The multi-tenant portal. When enabled the dashboard is granted impersonation
                    and runs each tenant session as tenanttab:user:<name>, so the API SERVER —
                    not the dashboard — decides which namespaces that session may touch.
                  properties:
                    enabled: {type: boolean, default: true}
                    metering:
                      type: object
                      description: |
                        Accrues each tenant's resource-hours into a billing ledger. The schedule
                        is also the billing resolution: a meter that stops does not bill the gap,
                        so a long schedule under-bills rather than guessing.
                      properties:
                        enabled: {type: boolean, default: true}
                        schedule: {type: string, default: "*/15 * * * *"}
                        image: {type: string}
                route:
                  type: object
                  description: An OpenShift Route. An Ingress works here too.
                  properties:
                    enabled: {type: boolean, default: false}
                    host: {type: string}
                    tls:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        termination:
                          type: string
                          enum: [edge, passthrough, reencrypt]
                ingress:
                  type: object
                  properties:
                    enabled: {type: boolean, default: false}
                    className: {type: string}
                    host: {type: string}
                    annotations: {type: object, x-kubernetes-preserve-unknown-fields: true}
                    tls:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        secretName: {type: string}
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ClusterIP, NodePort, LoadBalancer]
                    port: {type: integer}
                    nodePort: {type: string}
                platformServices:
                  type: object
                  description: |
                    Shared platform services the chart installs itself, where the portal's own
                    account may not. The Services page shows them as installed by the chart.
                  properties:
                    redis:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        enabled: {type: boolean, default: false}
                components:
                  type: object
                  description: |
                    Where the dashboard looks for optional components. What is actually present
                    is detected at runtime — anything absent is hidden rather than left to fail —
                    but these say where to look. On OpenShift, Velero arrives through OADP in
                    openshift-adp rather than in a namespace called velero.
                  properties:
                    veleroNamespace: {type: string}
                    minioNamespace: {type: string}
                    prometheusUrl: {type: string}
                    qdrantUrl: {type: string}
                    ollamaUrl: {type: string}
                deployer:
                  type: object
                  properties:
                    enabled: {type: boolean, default: true}
                metrics:
                  type: object
                  properties:
                    token: {type: string}
                    serviceMonitor:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        labels: {type: object, x-kubernetes-preserve-unknown-fields: true}
                    billingAlerts:
                      type: object
                      description: Balance and budget alerts as a PrometheusRule (docs/OBSERVABILITY.md).
                      properties:
                        enabled: {type: boolean, default: false}
                        namespace: {type: string}
                        labels: {type: object, x-kubernetes-preserve-unknown-fields: true}
                        budgetWarnRatio: {type: number, exclusiveMinimum: true, minimum: 0, exclusiveMaximum: true, maximum: 1}
                        meterStaleMinutes: {type: integer, minimum: 15}
                auditWebhook:
                  type: string
                  description: Every audit line is also POSTed here, best-effort.
                vms:
                  type: object
                  description: GPU virtual machines and the digital-twin workstations (docs/GPU-VMS.md).
                  properties:
                    vgpuLicenseSecret:
                      type: string
                      pattern: '^(off|[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?)$'
                      description: >-
                        Secret in each tenant namespace with the vGPU guest driver URL and the NLS
                        token. "off" when images already carry a licensed driver.
                    openshiftConsoleUrl:
                      type: string
                      pattern: '^(https://.+)?$'
                      description: The OpenShift web console, for a link to each machine's console.
                openshift:
                  type: object
                  description: |
                    OpenShift integration: sign in with the cluster's own OAuth server, an entry in
                    the console's application menu, and a maintenance banner. Detected on its own
                    on OpenShift; enabled forces it.
                  properties:
                    enabled: {type: boolean}
                    consoleUrl:
                      type: string
                      pattern: '^(https://.+)?$'
                    oauth:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        adminGroups: {type: string}
                        supportGroups: {type: string}
                        defaultRole:
                          type: string
                          enum: [viewer, none]
                        buttonLabel: {type: string}
                        redirectUri:
                          type: string
                          pattern: '^(https://.+)?$'
                    consoleLink:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        text: {type: string}
                        section: {type: string}
                        href:
                          type: string
                          pattern: '^(https://.+)?$'
                    consoleNotification:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        text: {type: string}
                        location:
                          type: string
                          enum: [BannerTop, BannerBottom, BannerTopBottom]
                        color: {type: string}
                        backgroundColor: {type: string}
                        link:
                          type: object
                          properties:
                            text: {type: string}
                            href: {type: string}
                observability:
                  type: object
                  description: Reports, service levels, sign-in alerts and tracing (docs/OBSERVABILITY.md).
                  properties:
                    job:
                      type: object
                      properties:
                        enabled: {type: boolean, default: true}
                        schedule: {type: string}
                        image: {type: string}
                    prometheusServiceAccountToken:
                      type: boolean
                      description: >-
                        Send the portal's service account token to Prometheus (OpenShift's Thanos
                        querier). Bind cluster-monitoring-view to the portal's service account.
                    latencyTargets:
                      type: string
                      description: p95 latency target per service tier in milliseconds, e.g. standard=2000,priority=1000.
                    authAlerts:
                      type: object
                      properties:

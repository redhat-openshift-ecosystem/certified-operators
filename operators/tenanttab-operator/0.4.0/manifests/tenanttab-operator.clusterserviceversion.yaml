  description: "**14 days free trial.** Request it at https://denegra.ai/trial: Denegra emails you a pull\n\
    token for its private registry and a trial licence. Put the pull token in the cluster's global\npull\
    \ secret before you click Install, and the licence in after. After the trial, TenantTab\nneeds a licence\
    \ from Denegra.\n\n## TenantTab\n\nA self-service AI platform portal for a Kubernetes cluster somebody\
    \ already owns.\n\n### 14 days free trial\n\nTenantTab is commercial software from Denegra. Try it\
    \ for 14 days first:\n\n1. **Request the trial** with the form at https://denegra.ai/trial, using\
    \ your company email.\n   Denegra emails you a pull token for its private registry and a trial licence,\
    \ both valid\n   for 14 days, with the install steps.\n2. **Put the pull token in the cluster's global\
    \ pull secret** (`pull-secret` in\n   `openshift-config`) before you click Install. The images are\
    \ private: without the token\n   the operator cannot start. Denegra's install guide gives the three\
    \ `oc` commands.\n3. **Install the operator**, then create one `TenantTab` resource.\n4. **Install\
    \ the trial licence** as the Secret `tenanttab-license` (key `license.jwt`) in the\n   portal's namespace,\
    \ or upload it on the portal's Licence page. Without a licence the\n   portal runs in demo mode: it\
    \ shows sample data and changes nothing on the cluster.\n\n### After the trial\n\nWhen the trial ends,\
    \ the portal is locked: running workloads keep running, and nothing new can\nbe created. To go on,\
    \ buy a licence: ask info@denegra.ai for a quote. Denegra\nsends a licence file and a registry credential\
    \ that replace the trial's; install them the same\nway (steps 2 and 4) and the portal unlocks within\
    \ a minute. A licence that ends never stops\nrunning workloads.\n\nCreate one `TenantTab` resource\
    \ and the portal appears in that namespace: a catalog teams\norder from, one-click deploys, model\
    \ serving and an OpenAI-compatible gateway, RAG\nknowledge bases, cost visibility, and \u2014 optionally\
    \ \u2014 multi-tenancy.\n\n### What you get depends on what the cluster has\n\nTenantTab probes the\
    \ cluster for OpenShift Virtualization, KServe, Prometheus, Qdrant,\nVelero and GPUs, and **hides\
    \ the surfaces whose component is absent** rather than offering\npages that can only fail. A probe\
    \ that *fails* is treated as \"unknown\" and hides nothing \u2014\na feature that silently disappeared\
    \ is not something a user can discover is missing. The\nfull table is in the dashboard under Nodes\
    \ \u2192 Cluster capabilities.\n\nSo installing this on a bare cluster gives you a smaller product,\
    \ not a broken one.\n\n### Multi-tenancy\n\nOn by default, and the portal does not become ready without\
    \ it. The dashboard is granted\nimpersonation and runs each tenant's session as `tenanttab:user:<name>`,\
    \ so the **API\nserver** decides which namespaces that session may touch. A tenant cannot get past\
    \ that\nby getting past the UI.\n\nTenants get their own namespaces, quotas (CPU, memory, storage,\
    \ whole GPUs or MIG\nprofiles), a catalog allow-list, an approval workflow, per-tenant cost and, if\
    \ you want to\ncharge for it, metered usage posted to a per-tenant ledger.\n\n### Read this before\
    \ installing\n\nThe operator holds `escalate` and `bind` on ClusterRoles. It has to: Kubernetes refuses\
    \ to\nlet an account create a role granting permissions it does not itself hold, and the operator\n\
    provisions the dashboard's ClusterRole. That makes **the operator as privileged as anything\nit can\
    \ install**. The alternative \u2014 granting the operator the union of every permission the\nchart\
    \ hands out \u2014 has to be kept in lockstep with the chart forever, and the edit that gets\nforgotten\
    \ is the one that breaks an install at 2am.\n\nThe portal it installs is a trusted component too,\
    \ and its ServiceAccount is equivalent\nto cluster-admin. It may impersonate users and groups (it\
    \ only ever uses `tenanttab:*`\nidentities, but RBAC cannot express that limit, so it lives in the\
    \ portal's code), it\ncreates Roles and RoleBindings to provision tenants, and it starts catalog installs\
    \ as a\ndeployer account with broad access. Whoever takes over the portal takes the cluster.\nGive\
    \ it its own namespace, put it behind SSO, and send its audit lines off the cluster.\nPermission to\
    \ create or edit `TenantTab` resources is the same trust level: grant it only\nto people you would\
    \ give cluster-admin.\nSetting `spec.deployer.enabled: false` removes the deployer account; catalog\
    \ installs\nthat need it then fail.\n\nInstall it from a source you trust, and read what it actually\
    \ grants:\n`deploy/helm/tenanttab/templates/rbac*.yaml` in the repository.\n\n### On OpenShift specifically\n\
    \n- **Velero** arrives through OADP in `openshift-adp`, not a namespace called `velero`. Set\n  `spec.components.veleroNamespace`.\n\
    - **Prometheus is authenticated** behind thanos-querier and TenantTab does not yet send a\n  bearer\
    \ token. Left unset, the probe reports Prometheus absent: Monitoring hides itself and\n  the CPU/memory\
    \ lines of the cost view read zero and say so, rather than inventing numbers.\n  Cost metering is\
    \ therefore partial on OpenShift until token support lands.\n- **Sign in with OpenShift** (`spec.openshift.oauth.enabled`):\
    \ the cluster's own OAuth server,\n  with the portal's ServiceAccount as the OAuth client, so no OAuthClient\
    \ object is created.\n  OpenShift groups map to roles and tenants. For SSO with portal-enforced MFA,\
    \ point\n  `spec.oidc.issuer` at the identity provider behind OpenShift instead.\n- **Console**: the\
    \ portal appears in the console's application menu once `spec.route.host` is\n  set, and `spec.openshift.consoleNotification`\
    \ puts a maintenance banner across the console.\n- **restricted-v2 everywhere.** The dashboard image\
    \ runs as a non-root user on a port above\n  1024 and never writes to its filesystem; its pods state\
    \ the restricted shape with no uid.\n  Every workload the portal creates (catalog apps, platform services,\
    \ deploys, previews,\n  installer jobs) is shaped the same way, image builds run as OpenShift Builds,\
    \ and cluster\n  services OpenShift already provides (monitoring, GitOps, KServe through OpenShift\
    \ AI,\n  virtualization) are left to their Red Hat operators. No SCC exception is requested.\n"
  installModes:
  - type: OwnNamespace
    supported: true
  - type: SingleNamespace
    supported: true
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces

    - name: tenanttabs.tenanttab.denegra.ai
      version: v1alpha1
      kind: TenantTab
      displayName: TenantTab
      description: A TenantTab platform install.
      resources:
      - kind: Deployment
        version: v1
      - kind: Service
        version: v1
      - kind: Secret
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: CronJob
        version: v1
      - kind: Route
        version: v1
      - kind: ConsoleLink
        version: v1
      - kind: ConsoleNotification
        version: v1
      - kind: NetworkPolicy
        version: v1

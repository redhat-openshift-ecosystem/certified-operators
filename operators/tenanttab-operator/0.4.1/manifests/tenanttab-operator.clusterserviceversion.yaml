  description: "**14 days free trial.** Request it at https://denegra.ai/trial: Denegra emails you a pull\n\
    token for its private registry and a trial licence. Put the pull token in the cluster's global\npull\
    \ secret before you click Install, and the licence in after. After the trial, TenantTab\nneeds a licence\
    \ from Denegra: ask for a quote at https://denegra.ai/quote.\n\n## TenantTab\n\nThe storefront, tenant\
    \ and billing layer for companies that sell AI cloud: GPU as a service,\nAI as a service and models\
    \ as a service, and the managed service providers who run it for\nthem. TenantTab installs into the\
    \ OpenShift cluster you already run and turns its GPUs, models\nand apps into products your customers\
    \ sign up for, order themselves and pay for from credit,\nunder your brand.\n\nTenantTab sells and\
    \ bills what the cluster has. It is not a Kubernetes distribution, not a\nnode or hardware manager,\
    \ and it never takes payments: your ERP sells the credit, TenantTab\nspends it.\n\n### Sell GPUs\n\
    \n- **Whole GPUs, MIG slices and time-sliced shares**, sold as GPU tiers queued through Kueue\n  and\
    \ priced per GPU-hour on your rate card; vGPU for virtual machines.\n- **GPU quotas per tenant**,\
    \ per tier. A child tenant can never hold more than its parent.\n- **Reservations**: a number of GPUs\
    \ for a fixed term at a reserved price.\n- **GPU use and health per tenant** from the NVIDIA GPU Operator's\
    \ DCGM exporter, next to what\n  each tenant was allocated, with alert rules for XID and ECC errors.\n\
    \n### Sell models (models as a service)\n\n- **One model gateway**, compatible with the OpenAI and\
    \ Anthropic APIs: per-tenant API keys,\n  rate-limit tiers, a model router and usage per user.\n-\
    \ **Metered per token**, per model, with cached-input and image pricing on the rate card.\n- **Models\
    \ served by** vLLM, Ollama or KServe on the cluster, or by NVIDIA NIM that a tenant\n  installs from\
    \ the catalog on its own GPUs.\n\n### Sell AI apps\n\n- **A curated catalog of more than 40 AI apps**,\
    \ installed with one click into the tenant's\n  own namespace: inference (vLLM, Ollama, llama.cpp,\
    \ LocalAI, NVIDIA NIM), notebooks\n  (JupyterHub, JupyterLab, code-server), chat and RAG (Open WebUI,\
    \ AnythingLLM, Docling),\n  vector databases (Qdrant, Milvus, Weaviate, pgvector), fine-tuning, MLOps\
    \ and pipelines\n  (MLflow, ZenML, Ray, Argo Workflows), and NVIDIA Omniverse and Isaac Sim workstations.\n\
    - **Customers' own apps** from a container image, a Git repository or a Helm chart.\n- **SKU Studio**\
    \ turns a compute profile, a service profile and a rate card into a priced SKU,\n  such as \"one GPU\
    \ container with Jupyter for a week\", that customers order without a sales\n  call. The price is\
    \ on the card before they click Install.\n\n### Place apps on OpenShift, VMs or bare metal\n\n- **OpenShift**:\
    \ every catalog app runs in the tenant's namespaces on this cluster.\n- **GPU VMs and desktops** on\
    \ OpenShift Virtualization, with a browser console.\n- **VMs from Proxmox VE**: connect your Proxmox\
    \ once with an API token and sell its VMs to\n  tenants, each tenant in its own pool and network.\
    \ Tenants never see the word Proxmox.\n- **Linux VMs and bare-metal servers** you register: TenantTab\
    \ installs the app there and bills\n  the machine's reservation.\n\n### Bill it: metering, chargeback,\
    \ credit and invoices\n\n- **Metering**: GPU time on allocation in 15-minute steps; CPU, memory and\
    \ storage from the rate\n  card; tokens per model; reservations for their term.\n- **Credit from your\
    \ ERP**: a billing-only API token posts paid credit with your order number.\n  A retry never doubles\
    \ a balance, and the token can do nothing else.\n- **Prepaid balance with stop rules**: promotional\
    \ credit spent first, budgets and balance\n  alerts, a grace period, then new work refused at zero.\
    \ Running workloads keep running.\n- **Invoices and statements** as PDF and CSV, with VAT, in English\
    \ or Arabic, plus showback\n  and chargeback per tenant and a usage export your ERP reconciles against.\n\
    \n### Run it as a business\n\n- **Customers sign themselves up**: organisation sign-up with a KYC\
    \ hold and your approval,\n  and an optional public storefront with the catalog and prices before\
    \ sign-in.\n- **Your brand**: logo, colours, custom domains and landing page.\n- **Resellers and MSPs**\
    \ with their own customers, their own price lists (never below cost)\n  and statements under their\
    \ own brand.\n- **Sign-in**: Sign in with OpenShift, or SSO through OIDC with MFA enforced; five roles\
    \ from\n  admin to read-only and billing; a tamper-evident audit log you can send to your SIEM.\n\n\
    ### 14 days free trial\n\nTenantTab is commercial software from Denegra. Try it for 14 days first:\n\
    \n1. **Request the trial** with the form at https://denegra.ai/trial, using your company email.\n\
    \   Denegra emails you a pull token for its private registry and a trial licence, both valid\n   for\
    \ 14 days, with the install steps.\n2. **Put the pull token in the cluster's global pull secret**\
    \ (`pull-secret` in\n   `openshift-config`) before you click Install. The images are private: without\
    \ the token\n   the operator cannot start. Denegra's install guide gives the three `oc` commands.\n\
    3. **Install the operator**, then create one `TenantTab` resource.\n4. **Install the trial licence**\
    \ as the Secret `tenanttab-license` (key `license.jwt`) in the\n   portal's namespace, or upload it\
    \ on the portal's Licence page. Without a licence the\n   portal runs in demo mode: it shows sample\
    \ data and changes nothing on the cluster.\n\n### After the trial\n\nWhen the trial ends, the portal\
    \ is locked: running workloads keep running, and nothing new can\nbe created. To go on, buy a licence:\
    \ ask for a quote at https://denegra.ai/quote. Denegra\nsends a licence file and a registry credential\
    \ that replace the trial's; install them the same\nway (steps 2 and 4) and the portal unlocks within\
    \ a minute. A licence that ends never stops\nrunning workloads.\n\n### What you get depends on what\
    \ the cluster has\n\nTenantTab probes the cluster for OpenShift Virtualization, KServe, Prometheus,\
    \ Qdrant,\nVelero and GPUs, and **hides the surfaces whose component is absent** rather than offering\n\
    pages that can only fail. A probe that *fails* is treated as \"unknown\" and hides nothing \u2014\n\
    a feature that silently disappeared is not something a user can discover is missing. The\nfull table\
    \ is in the dashboard under Nodes \u2192 Cluster capabilities.\n\nSo installing this on a bare cluster\
    \ gives you a smaller product, not a broken one.\n\n### Multi-tenancy\n\nOn by default, and the portal\
    \ does not become ready without it. The dashboard is granted\nimpersonation and runs each tenant's\
    \ session as `tenanttab:user:<name>`, so the **API\nserver** decides which namespaces that session\
    \ may touch. A tenant cannot get past that\nby getting past the UI.\n\nTenants get their own namespaces,\
    \ quotas (CPU, memory, storage, whole GPUs, MIG profiles or\nGPU tiers), a catalog allow-list, an\
    \ approval workflow, per-tenant cost and, if you want to\ncharge for it, metered usage posted to a\
    \ per-tenant ledger.\n\n### Read this before installing\n\nThe operator holds `escalate` and `bind`\
    \ on ClusterRoles. It has to: Kubernetes refuses to\nlet an account create a role granting permissions\
    \ it does not itself hold, and the operator\nprovisions the dashboard's ClusterRole. That makes **the\
    \ operator as privileged as anything\nit can install**. The alternative \u2014 granting the operator\
    \ the union of every permission the\nchart hands out \u2014 has to be kept in lockstep with the chart\
    \ forever, and the edit that gets\nforgotten is the one that breaks an install at 2am.\n\nThe portal\
    \ it installs is a trusted component too, and its ServiceAccount is equivalent\nto cluster-admin.\
    \ It may impersonate users and groups (it only ever uses `tenanttab:*`\nidentities, but RBAC cannot\
    \ express that limit, so it lives in the portal's code), it\ncreates Roles and RoleBindings to provision\
    \ tenants, and it starts catalog installs as a\ndeployer account with broad access. Whoever takes\
    \ over the portal takes the cluster.\nGive it its own namespace, put it behind SSO, and send its audit\
    \ lines off the cluster.\nPermission to create or edit `TenantTab` resources is the same trust level:\
    \ grant it only\nto people you would give cluster-admin.\nSetting `spec.deployer.enabled: false` removes\
    \ the deployer account; catalog installs\nthat need it then fail.\n\nInstall it from a source you\
    \ trust, and read what it actually grants:\n`deploy/helm/tenanttab/templates/rbac*.yaml` in the repository.\n\
    \n### On OpenShift specifically\n\n- **Velero** arrives through OADP in `openshift-adp`, not a namespace\
    \ called `velero`. Set\n  `spec.components.veleroNamespace`.\n- **Prometheus is authenticated** behind\
    \ thanos-querier. Set `spec.components.prometheusUrl`\n  to `https://thanos-querier.openshift-monitoring.svc:9091`,\
    \ turn on\n  `spec.observability.prometheusServiceAccountToken`, and bind the `cluster-monitoring-view`\n\
    \  ClusterRole to the portal's service account. Left unset, the probe reports Prometheus\n  absent:\
    \ Monitoring hides itself and the CPU/memory lines of the cost view read zero and say\n  so, rather\
    \ than inventing numbers.\n- **Sign in with OpenShift** (`spec.openshift.oauth.enabled`): the cluster's\
    \ own OAuth server,\n  with the portal's ServiceAccount as the OAuth client, so no OAuthClient object\
    \ is created.\n  OpenShift groups map to roles and tenants. For SSO with portal-enforced MFA, point\n\
    \  `spec.oidc.issuer` at the identity provider behind OpenShift instead.\n- **Console**: the portal\
    \ appears in the console's application menu once `spec.route.host` is\n  set, and `spec.openshift.consoleNotification`\
    \ puts a maintenance banner across the console.\n- **restricted-v2 everywhere.** The dashboard image\
    \ runs as a non-root user on a port above\n  1024 and never writes to its filesystem; its pods state\
    \ the restricted shape with no uid.\n  Every workload the portal creates (catalog apps, platform services,\
    \ deploys, previews,\n  installer jobs) is shaped the same way, image builds run as OpenShift Builds,\
    \ and cluster\n  services OpenShift already provides (monitoring, GitOps, KServe through OpenShift\
    \ AI,\n  virtualization) are left to their Red Hat operators. No SCC exception is requested.\n"
  installModes:
  - type: OwnNamespace
    supported: true
  - type: SingleNamespace
    supported: true
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: true
  customresourcedefinitions:
    owned:
    - name: tenanttabs.tenanttab.denegra.ai
      version: v1alpha1
      kind: TenantTab
      displayName: TenantTab
      description: 'One TenantTab portal in this namespace: the storefront, tenants, GPU quotas, metering
        and invoices for this cluster.'
      resources:
      - kind: Deployment
        version: v1
      - kind: Service
        version: v1
      - kind: Secret
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: CronJob
        version: v1
      - kind: Route
        version: v1
      - kind: ConsoleLink
        version: v1
      - kind: ConsoleNotification
        version: v1
      - kind: NetworkPolicy
        version: v1
      - kind: ClusterRole
        version: v1
      - kind: ClusterRoleBinding
        version: v1
      specDescriptors:
      - path: multiTenancy
        displayName: Multi-tenancy
      - path: route
        displayName: Route
      - path: components
        displayName: Components
      - path: multiTenancy.enabled
        displayName: Multi-tenant portal
        description: "Serve several teams from one dashboard, with the API server \u2014 not the dashboard\
          \ \u2014 enforcing what each may touch. Grants the dashboard impersonation."
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: multiTenancy.metering.schedule
        displayName: Metering interval
        description: Also the billing resolution. A meter that stops does not bill the gap, so a long
          interval under-bills rather than guessing.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - path: route.enabled
        displayName: Create a Route
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: route.host
        displayName: Route hostname
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: oidc.issuer
        displayName: SSO issuer URL
        description: The identity provider behind OpenShift, not OpenShift's own OAuth server.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: oidc.clientSecret
        displayName: SSO client secret
        description: Stored in this resource as plain text. Prefer existingSecret.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:password
      - path: license.secretName
        displayName: Licence Secret
        description: The Secret in this namespace that holds the Denegra licence under the key license.jwt.
          Leave empty for tenanttab-license. Without a valid licence the portal runs in demo mode.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: license.trialUrl
        displayName: Trial form
        description: The 14-day trial form the Licence page links to in demo mode, next to this cluster's
          ID. Leave empty for https://denegra.ai/trial.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: existingSecret.name
        displayName: Credentials Secret
        description: A Secret in this namespace holding the admin password, SSO client secret or other
          credentials, so they are not written in this resource. Name the key for each one under existingSecret.keys.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: components.veleroNamespace
        displayName: Velero namespace
        description: openshift-adp when Velero is installed through OADP.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: platformServices.redis.enabled
        displayName: Shared Redis cache
        description: Installs the shared Redis cache (Red Hat's Valkey 8 image) apps get through the Deploy
          page's cache binding, in this namespace. The portal's own account cannot install it on OpenShift.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: auth.adminPassword
        displayName: Admin password
        description: Leave empty and a strong one is generated on first install and kept across upgrades.
          Read it from the tenanttab-portal-auth Secret. A value typed here is stored in this resource
          as plain text; prefer existingSecret.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:password
      - path: vms.vgpuLicenseSecret
        displayName: vGPU licence Secret
        description: A Secret in each tenant namespace that orders vGPU machines, with the keys driver-url
          and client_configuration_token.tok. Virtual machines mount it read-only; its contents are never
          written into a VM. "off" when your images carry a licensed driver.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.oauth.enabled
        displayName: Sign in with OpenShift
        description: The cluster's own OAuth server signs people in. Needs the Route's host (route.host)
          or openshift.oauth.redirectUri.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: openshift.oauth.adminGroups
        displayName: OpenShift admin groups
        description: Comma-separated OpenShift groups whose members are platform admins.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.consoleLink.enabled
        displayName: Console menu link
        description: 'The portal in the console''s application menu, once route.host is set. Off by default:
          a ConsoleLink is cluster-scoped, so every console user sees it.'
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: openshift.consoleNotification.text
        displayName: Console banner
        description: Text of a banner across the OpenShift console, for maintenance windows. Shown while
          openshift.consoleNotification.enabled is on.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: vms.openshiftConsoleUrl
        displayName: OpenShift console URL
        description: Adds a link to each machine's console in the OpenShift web console.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability
        displayName: Reports and observability
      - path: observability.job.enabled
        displayName: Observability job
        description: A CronJob that probes catalog services, checks sign-ins for anomalies and makes the
          scheduled reports. Each report slot runs once, however many replicas there are.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.prometheusServiceAccountToken
        displayName: Send the service account token to Prometheus
        description: For OpenShift's Thanos querier (components.prometheusUrl). Bind the cluster-monitoring-view
          ClusterRole to the portal's service account.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.authAlerts.itsmWebhookUrl
        displayName: ITSM webhook for sign-in alerts
        description: Each sign-in alert opens one incident here (ServiceNow import set shape).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability.webhookSecret.name
        displayName: Webhook signing Secret
        description: A Secret with a key of 32 characters or more that signs the ITSM and reports webhooks.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: observability.otel.enabled
        displayName: OpenTelemetry tracing
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.otel.endpoint
        displayName: OTLP endpoint
        description: The OpenTelemetry collector or Tempo's OTLP HTTP port, e.g. http://otel-collector.observability.svc:4318.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability.otel.metrics.enabled
        displayName: OpenTelemetry metrics
        description: Also send the portal's metrics (model gateway counters per tenant, balance state
          and budget ratio) to <endpoint>/v1/metrics. Needs tracing on.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: metrics.billingAlerts.enabled
        displayName: Balance and budget alerts
        description: A PrometheusRule for low, empty and exhausted balances, budgets near or over, and
          a stopped meter. Needs the portal's metrics scraped (metrics.serviceMonitor.enabled).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: metrics.capacityAlerts.enabled
        displayName: Fleet capacity alerts
        description: A PrometheusRule for a GPU tier, CPU or memory at a site above its allocated threshold
          (85% for GPUs by default), and for a stale capacity point. Needs the portal's metrics scraped
          (metrics.serviceMonitor.enabled).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry
        displayName: GPU telemetry
      - path: gpuTelemetry.enabled
        displayName: GPU use from DCGM
        description: Reads the GPU Operator's DCGM exporter series through components.prometheusUrl and
          shows utilisation and GPU health per tenant next to what Kueue allocated. Billing stays on allocation.
          Deploys no exporter.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry.serviceMonitor.enabled
        displayName: Scrape the DCGM exporter
        description: Only when the GPU Operator's own exporter ServiceMonitor is off.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry.alerts.enabled
        displayName: GPU health alerts
        description: A PrometheusRule for XID errors, ECC double-bit errors, row remap failures, high
          temperature and hardware clock slowdown. On OpenShift set gpuTelemetry.alerts.namespace to the
          GPU Operator's namespace.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      statusDescriptors:
      - path: conditions
        displayName: Conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - path: deployedRelease
        displayName: Deployed release
        description: The Helm release this resource reconciled into.

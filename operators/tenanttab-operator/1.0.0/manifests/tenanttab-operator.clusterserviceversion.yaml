  description: "**Free up to 64 GPUs on 1 site, with a free key.** Install the operator, sign in to the\
    \ portal\nand get the free key from its Licence page. The same page starts a 14-day Enterprise trial.\n\
    The images are public: no pull token and no pull secret. Above 64 GPUs or for more than 1 site,\n\
    TenantTab needs an Enterprise licence from Denegra: ask for a quote at https://denegra.ai/quote.\n\
    \n## TenantTab\n\nThe storefront, tenant and billing layer for companies that sell AI cloud: GPU as\
    \ a service,\nAI as a service and models as a service, and the managed service providers who run it\
    \ for\nthem. TenantTab installs into the OpenShift cluster you already run and turns its GPUs, models\n\
    and apps into products your customers sign up for, order themselves and pay for from credit,\nunder\
    \ your brand.\n\nTenantTab sells and bills what the cluster has. It is not a Kubernetes distribution,\
    \ not a\nnode or hardware manager, and it never takes payments: your ERP sells the credit, TenantTab\n\
    spends it.\n\n### Sell GPUs\n\n- **Whole GPUs, MIG slices and time-sliced shares**, sold as GPU tiers\
    \ queued through Kueue\n  and priced per GPU-hour on your rate card; vGPU for virtual machines.\n\
    - **GPU quotas per tenant**, per tier. A child tenant can never hold more than its parent.\n- **Reservations**:\
    \ a number of GPUs for a fixed term at a reserved price.\n- **GPU use and health per tenant** from\
    \ the NVIDIA GPU Operator's DCGM exporter, next to what\n  each tenant was allocated, with alert rules\
    \ for XID and ECC errors.\n\n### Sell models (models as a service)\n\n- **One model gateway**, compatible\
    \ with the OpenAI and Anthropic APIs: per-tenant API keys,\n  rate-limit tiers, a model router and\
    \ usage per user.\n- **Metered per token**, per model, with cached-input and image pricing on the\
    \ rate card.\n- **Models served by** vLLM, Ollama or KServe on the cluster, or by NVIDIA NIM that\
    \ a tenant\n  installs from the catalog on its own GPUs.\n\n### Sell AI apps\n\n- **A curated catalog\
    \ of more than 40 AI apps**, installed with one click into the tenant's\n  own namespace: inference\
    \ (vLLM, Ollama, llama.cpp, LocalAI, NVIDIA NIM), notebooks\n  (JupyterHub, JupyterLab, code-server),\
    \ chat and RAG (Open WebUI, AnythingLLM, Docling),\n  vector databases (Qdrant, Milvus, Weaviate,\
    \ pgvector), fine-tuning, MLOps and pipelines\n  (MLflow, ZenML, Ray, Argo Workflows), and NVIDIA\
    \ Omniverse and Isaac Sim workstations.\n- **Customers' own apps** from a container image, a Git repository\
    \ or a Helm chart.\n- **SKU Studio** turns a compute profile, a service profile and a rate card into\
    \ a priced SKU,\n  such as \"one GPU container with Jupyter for a week\", that customers order without\
    \ a sales\n  call. The price is on the card before they click Install.\n\n### Place apps on OpenShift,\
    \ VMs or bare metal\n\n- **OpenShift**: every catalog app runs in the tenant's namespaces on this\
    \ cluster.\n- **GPU VMs and desktops** on OpenShift Virtualization, with a browser console.\n- **VMs\
    \ from Proxmox VE**: connect your Proxmox once with an API token and sell its VMs to\n  tenants, each\
    \ tenant in its own pool and network. Tenants never see the word Proxmox.\n- **Linux VMs and bare-metal\
    \ servers** you register: TenantTab installs the app there and bills\n  the machine's reservation.\n\
    \n### Bill it: metering, chargeback, credit and invoices\n\n- **Metering**: GPU time on allocation\
    \ in 15-minute steps; CPU, memory and storage from the rate\n  card; tokens per model; reservations\
    \ for their term.\n- **Credit from your ERP**: a billing-only API token posts paid credit with your\
    \ order number.\n  A retry never doubles a balance, and the token can do nothing else.\n- **Prepaid\
    \ balance with stop rules**: promotional credit spent first, budgets and balance\n  alerts, a grace\
    \ period, then new work refused at zero. Running workloads keep running.\n- **Invoices and statements**\
    \ as PDF and CSV, with VAT, in English or Arabic, plus showback\n  and chargeback per tenant and a\
    \ usage export your ERP reconciles against.\n\n### Run it as a business\n\n- **Customers sign themselves\
    \ up**: organisation sign-up with a KYC hold and your approval,\n  and an optional public storefront\
    \ with the catalog and prices before sign-in.\n- **Your brand**: logo, colours, custom domains and\
    \ landing page.\n- **Resellers and MSPs** with their own customers, their own price lists (never below\
    \ cost)\n  and statements under their own brand.\n- **Sign-in**: Sign in with OpenShift, or SSO through\
    \ OIDC with MFA enforced; five roles from\n  admin to read-only and billing; a tamper-evident audit\
    \ log you can send to your SIEM.\n\n### Free edition, trial and Enterprise\n\nTenantTab is commercial\
    \ software from Denegra with a free edition. Installing it costs\nnothing and needs no account; running\
    \ it needs a licence key, which is bound to your cluster.\n\n- **Free edition:** the whole portal,\
    \ up to 64 GPUs on 1 site, with a free key. A free key\n  lasts 12 months and can be renewed.\n- **14-day\
    \ Enterprise trial:** everything on for 14 days. When it ends, the portal goes on as\n  the free edition\
    \ and keeps every setting.\n- **Enterprise:** more than 64 GPUs, more sites and clusters, your own\
    \ branding, the ERP and\n  billing API, single sign-on, ITSM, spot GPUs and sharing models with other\
    \ customers. Ask\n  for a quote at https://denegra.ai/quote.\n\n### Install\n\n1. **As a cluster admin,\
    \ prepare the namespace `tenanttab`** once: create it, allow the\n   install there and apply the portal's\
    \ cluster-wide rights. The operator creates no RBAC, so\n   these come from a file that comes with\
    \ the TenantTab chart:\n   ```\n   oc create namespace tenanttab\n   oc label namespace tenanttab\
    \ tenanttab.denegra.ai/install-allowed=true\n   helm pull oci://ghcr.io/denegra-ai/charts/tenanttab\
    \ --version <this version> --untar\n   oc apply -f tenanttab/cluster-rbac.yaml\n   ```\n   Platform-wide\
    \ catalog installs (MinIO, the GPU stack and other apps for the whole cluster)\n   also need `oc apply\
    \ -f tenanttab/cluster-rbac-deployer.yaml`, which is cluster-admin\n   equivalent; without it, everything\
    \ else works and the catalog says what is missing.\n2. **Install the operator** into `tenanttab` (the\
    \ suggested namespace; the operator watches\n   only that namespace). Only a cluster admin may subscribe\
    \ to it. The images are public, so\n   there is no pull token and nothing to add to the cluster's\
    \ pull secret. Then create one\n   `TenantTab` resource in it; it stops with a message naming the\
    \ file while the rights are\n   missing.\n3. **Sign in.** The portal's address is its Route (`oc -n\
    \ <namespace> get route`). The user\n   is `admin`. The password is generated on install; read it\
    \ with\n   `oc -n <namespace> extract secret/tenanttab-portal-auth --keys=password --to=-`\n   (with\
    \ `spec.fullnameOverride` set, the Secret is `<fullnameOverride>-auth`). Keep it in\n   your password\
    \ vault, and turn on Sign in with OpenShift or SSO before you invite others.\n4. **Get the free key.**\
    \ Until a key is installed the portal runs in demo mode: it shows\n   sample data and changes nothing\
    \ on the cluster. Open **Licence** and choose **Get a free\n   key**: Denegra's form opens with this\
    \ cluster's ID. Give your company email, and the key\n   arrives there. **Request a 14-day Enterprise\
    \ trial** is on the same page.\n5. **Install the key** on the Licence page, or as the Secret `tenanttab-license`\
    \ (key\n   `license.jwt`) in the portal's namespace. The portal reads it within a minute.\n\n### When\
    \ a key ends\n\nA trial that ends leaves the free edition running. A free or Enterprise key that ends\
    \ gives\nwarnings first, then 14 days of grace, and then new work is refused until a new key is\n\
    installed. Running workloads always keep running.\n\n### What you get depends on what the cluster\
    \ has\n\nTenantTab probes the cluster for OpenShift Virtualization, KServe, Prometheus, Qdrant,\n\
    Velero and GPUs, and **hides the surfaces whose component is absent** rather than offering\npages\
    \ that can only fail. A probe that *fails* is treated as \"unknown\" and hides nothing \u2014\na feature\
    \ that silently disappeared is not something a user can discover is missing. The\nfull table is in\
    \ the dashboard under Nodes \u2192 Cluster capabilities.\n\nSo installing this on a bare cluster gives\
    \ you a smaller product, not a broken one.\n\n### Multi-tenancy\n\nOn by default, and the portal does\
    \ not become ready without it. The dashboard is granted\nimpersonation and runs each tenant's session\
    \ as `tenanttab:user:<name>`, so the **API\nserver** decides which namespaces that session may touch.\
    \ A tenant cannot get past that\nby getting past the UI.\n\nTenants get their own namespaces, quotas\
    \ (CPU, memory, storage, whole GPUs, MIG profiles or\nGPU tiers), a catalog allow-list, an approval\
    \ workflow, per-tenant cost and, if you want to\ncharge for it, metered usage posted to a per-tenant\
    \ ledger.\n\n### Read this before installing\n\nThe operator creates no RBAC and holds no `escalate`\
    \ or `bind`. The portal's cluster-wide\nrights are granted by `cluster-rbac.yaml`, which a cluster\
    \ admin applies once (step 1 below)\nand which binds fixed accounts in the namespace `tenanttab`,\
    \ so an operator installed anywhere\nelse can use none of them. Cluster-wide, the operator writes\
    \ only the chart's admission\npolicies, its PriorityClass and console link, and can change or delete\
    \ those only by name.\nInside `tenanttab` it manages the portal, so whoever may run pods there holds\
    \ the portal's\nrights: give `admin` and `edit` in that namespace only to cluster admins.\n\nThe portal\
    \ it installs is a trusted component too, and its ServiceAccount is equivalent\nto cluster-admin.\
    \ It may impersonate users and groups (it only ever uses `tenanttab:*`\nidentities, but RBAC cannot\
    \ express that limit, so it lives in the portal's code), it\ncreates Roles and RoleBindings to provision\
    \ tenants, and it starts catalog installs as a\ndeployer account with broad access. Whoever takes\
    \ over the portal takes the cluster.\nGive it its own namespace, put it behind SSO, and send its audit\
    \ lines off the cluster.\nPermission to create or edit `TenantTab` resources is the same trust level:\
    \ grant it only\nto people you would give cluster-admin. OLM adds that permission to the `admin` and\
    \ `edit`\nroles of every namespace the operator watches, so the operator watches one namespace only\n\
    (no AllNamespaces install mode), and installs a portal only where a cluster admin has set the\nnamespace\
    \ label `tenanttab.denegra.ai/install-allowed=true`, which project admins cannot set.\nGive admin\
    \ and edit in that namespace only to cluster admins. A Subscription to the operator\nis refused for\
    \ anyone who may not create ClusterRoleBindings (an admission policy in\n`cluster-rbac.yaml`). **An\
    \ earlier install for all namespaces stays exposed until it is moved to\nthe portal's namespace: this\
    \ version does not install over it.**\nThe deployer account runs only while `cluster-rbac-deployer.yaml`\
    \ is applied; setting\n`spec.deployer.enabled: false` turns it off whatever is applied. Platform-wide\
    \ catalog\ninstalls then wait, and the catalog tells the platform admin.\n\nInstall it from a source\
    \ you trust, and read what it actually grants:\n`deploy/helm/tenanttab/templates/rbac*.yaml` in the\
    \ repository.\n\n### On OpenShift specifically\n\n- **Velero** arrives through OADP in `openshift-adp`,\
    \ not a namespace called `velero`. Set\n  `spec.components.veleroNamespace`.\n- **Metering reads OpenShift's\
    \ own monitoring.** With `spec.components.prometheusUrl` left\n  empty, the portal queries the Thanos\
    \ querier with its service account token and binds the\n  read-only `cluster-monitoring-view` ClusterRole\
    \ to it, so CPU and memory are metered with no\n  extra step. `spec.observability.openshiftMetrics:\
    \ false` turns this off; CPU and memory then\n  read zero, and the cost view says so.\n- **Sign in\
    \ with OpenShift** (`spec.openshift.oauth.enabled`): the cluster's own OAuth server,\n  with the portal's\
    \ ServiceAccount as the OAuth client, so no OAuthClient object is created.\n  OpenShift groups map\
    \ to roles and tenants. For SSO with portal-enforced MFA, point\n  `spec.oidc.issuer` at the identity\
    \ provider behind OpenShift instead.\n- **Console**: the portal appears in the console's application\
    \ menu once `spec.route.host` is\n  set, and `spec.openshift.consoleNotification` puts a maintenance\
    \ banner across the console.\n- **restricted-v2 everywhere.** The dashboard image runs as a non-root\
    \ user on a port above\n  1024 and never writes to its filesystem; its pods state the restricted shape\
    \ with no uid.\n  Every workload the portal creates (catalog apps, platform services, deploys, previews,\n\
    \  installer jobs) is shaped the same way, image builds run as OpenShift Builds, and cluster\n  services\
    \ OpenShift already provides (monitoring, GitOps, KServe through OpenShift AI,\n  virtualization)\
    \ are left to their Red Hat operators. No SCC exception is requested.\n"
  installModes:
  - type: OwnNamespace
    supported: true
  - type: SingleNamespace
    supported: true
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: false
  customresourcedefinitions:
    owned:
    - name: tenanttabs.tenanttab.denegra.ai
      version: v1alpha1
      kind: TenantTab
      displayName: TenantTab
      description: 'One TenantTab portal in this namespace: the storefront, tenants, GPU quotas, metering
        and invoices for this cluster.'
      resources:
      - kind: Deployment
        version: v1
      - kind: Service
        version: v1
      - kind: Secret
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: CronJob
        version: v1
      - kind: Route
        version: v1
      - kind: ConsoleLink
        version: v1
      - kind: ConsoleNotification
        version: v1
      - kind: NetworkPolicy
        version: v1
      - kind: PodDisruptionBudget
        version: v1
      - kind: ClusterRole
        version: v1
      - kind: ClusterRoleBinding
        version: v1
      specDescriptors:
      - path: multiTenancy
        displayName: Multi-tenancy
      - path: route
        displayName: Route
      - path: components
        displayName: Components
      - path: replicaCount
        displayName: Portal replicas
        description: '1 by default. Set 2 or more for high availability: the portal stays up when a pod
          or a node goes, and upgrades roll with no downtime.'
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      - path: multiTenancy.enabled
        displayName: Multi-tenant portal
        description: "Serve several teams from one dashboard, with the API server \u2014 not the dashboard\
          \ \u2014 enforcing what each may touch. Grants the dashboard impersonation."
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: multiTenancy.metering.schedule
        displayName: Metering interval
        description: Also the billing resolution. A meter that stops does not bill the gap, so a long
          interval under-bills rather than guessing.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - path: route.enabled
        displayName: Create a Route
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: route.host
        displayName: Route hostname
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: oidc.issuer
        displayName: SSO issuer URL
        description: The identity provider behind OpenShift, not OpenShift's own OAuth server.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: oidc.clientSecret
        displayName: SSO client secret
        description: Stored in this resource as plain text. Prefer existingSecret.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:password
      - path: license.secretName
        displayName: Licence Secret
        description: The Secret in this namespace that holds the Denegra licence under the key license.jwt.
          Leave empty for tenanttab-license. Without a valid licence the portal runs in demo mode.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: license.trialUrl
        displayName: Trial form
        description: The form the Licence page opens for a free key or a 14-day Enterprise trial, with
          this cluster's ID. Leave empty for https://denegra.ai/trial?product=tenanttab.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: license.usageReport.autoSend
        displayName: Send the usage report automatically
        description: The install default of the portal setting that sends the monthly licence usage report
          of the active-GPU plan to Denegra. Off by default; off sends nothing.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: license.usageReport.endpoint
        displayName: Usage report address
        description: Where the report goes when it is sent automatically. https only. Leave empty for
          https://licence.denegra.ai/usage.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: existingSecret.name
        displayName: Credentials Secret
        description: A Secret in this namespace holding the admin password, SSO client secret or other
          credentials, so they are not written in this resource. Name the key for each one under existingSecret.keys.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: components.veleroNamespace
        displayName: Velero namespace
        description: openshift-adp when Velero is installed through OADP.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: platformServices.redis.enabled
        displayName: Shared Redis cache
        description: Installs the shared Redis cache (Red Hat's Valkey 8 image) apps get through the Deploy
          page's cache binding, in this namespace. The portal's own account cannot install it on OpenShift.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: auth.adminPassword
        displayName: Admin password
        description: Leave empty and a strong one is generated on first install and kept across upgrades.
          Read it from the tenanttab-portal-auth Secret. A value typed here is stored in this resource
          as plain text; prefer existingSecret.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:password
      - path: vms.vgpuLicenseSecret
        displayName: vGPU licence Secret
        description: A Secret in each tenant namespace that orders vGPU machines, with the keys driver-url
          and client_configuration_token.tok. Virtual machines mount it read-only; its contents are never
          written into a VM. "off" when your images carry a licensed driver.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.oauth.enabled
        displayName: Sign in with OpenShift
        description: The cluster's own OAuth server signs people in. Needs the Route's host (route.host)
          or openshift.oauth.redirectUri.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: openshift.oauth.adminGroups
        displayName: OpenShift admin groups
        description: Comma-separated OpenShift groups whose members are platform admins.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.consoleLink.enabled
        displayName: Console menu link
        description: 'The portal in the console''s application menu, once route.host is set. Off by default:
          a ConsoleLink is cluster-scoped, so every console user sees it.'
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: openshift.consoleNotification.text
        displayName: Console banner
        description: Text of a banner across the OpenShift console, for maintenance windows. Shown while
          openshift.consoleNotification.enabled is on.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: vms.openshiftConsoleUrl
        displayName: OpenShift console URL
        description: Adds a link to each machine's console in the OpenShift web console.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: vms.guestMetrics.podMonitor.enabled
        displayName: Scrape metrics from inside machines
        description: A PodMonitor that scrapes the exporters a machine ordered with "Collect metrics from
          inside this machine" runs. Needs the Prometheus Operator CRDs. Offering the box is a Platform
          settings switch in the portal.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: vms.guestMetrics.admissionPolicy.enabled
        displayName: Only KubeVirt makes machine pods
        description: Refuses pods in tenant namespaces that pose as a machine's virt-launcher pod, unless
          KubeVirt makes them, so a tenant cannot add scrape targets to its graphs. Needs OpenShift 4.17
          or later.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: slurm.network.enabled
        displayName: Will you connect a Slurm cluster?
        description: Opens network access from the portal to slurmrestd (port 6820), so a platform admin
          can turn HPC on in the portal later. Off by default. Turning it on later changes only the portal's
          NetworkPolicy; the portal keeps running.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: auditWebhookNetwork.enabled
        displayName: Will the portal send its audit log to a SIEM?
        description: Opens network access from the portal to a log server on ports 8088 (Splunk) and 9200
          (Elasticsearch), so a platform admin can set the audit webhook in the portal later. A server
          on port 443 needs nothing here. Off by default. Turning it on later changes only the portal's
          NetworkPolicy; the portal keeps running.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: notifications.smtp.network.enabled
        displayName: Will the portal send email (SMTP)?
        description: Opens network access from the portal to a mail server (ports 587 and 465), so a platform
          admin can set SMTP in the portal later. Off by default. Turning it on later changes only the
          portal's NetworkPolicy; the portal keeps running.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: schedules.enabled
        displayName: Schedules
        description: A CronJob that turns tenants' apps and developer pods off and on at the times they
          set, and off at a time-to-live. Off by default. Whether tenants may schedule, and the limits,
          are Platform settings in the portal.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability
        displayName: Reports and observability
      - path: observability.job.enabled
        displayName: Observability job
        description: A CronJob that probes catalog services, checks sign-ins for anomalies and makes the
          scheduled reports. Each report slot runs once, however many replicas there are.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.openshiftMetrics
        displayName: Meter with OpenShift monitoring
        description: Read CPU and memory from OpenShift's own monitoring (the Thanos querier), with the
          read-only cluster-monitoring-view role. On by default; used when no Prometheus is named in components.prometheusUrl.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.prometheusServiceAccountToken
        displayName: Send the service account token to Prometheus
        description: For another Prometheus named in components.prometheusUrl that wants the token. Bind
          cluster-monitoring-view or its equivalent to the portal's service account yourself.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.authAlerts.itsmWebhookUrl
        displayName: ITSM webhook for sign-in alerts
        description: Each sign-in alert opens one incident here (ServiceNow import set shape).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability.webhookSecret.name
        displayName: Webhook signing Secret
        description: A Secret with a key of 32 characters or more that signs the ITSM and reports webhooks.
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - path: observability.otel.enabled
        displayName: OpenTelemetry tracing
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: observability.otel.endpoint
        displayName: OTLP endpoint
        description: The OpenTelemetry collector or Tempo's OTLP HTTP port, e.g. http://otel-collector.observability.svc:4318.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: observability.otel.metrics.enabled
        displayName: OpenTelemetry metrics
        description: Also send the portal's metrics (model gateway counters per tenant, balance state
          and budget ratio) to <endpoint>/v1/metrics. Needs tracing on.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: metrics.billingAlerts.enabled
        displayName: Balance and budget alerts
        description: A PrometheusRule for low, empty and exhausted balances, budgets near or over, and
          a stopped meter. Needs the portal's metrics scraped (metrics.serviceMonitor.enabled).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: metrics.capacityAlerts.enabled
        displayName: Fleet capacity alerts
        description: A PrometheusRule for a GPU tier, CPU or memory at a site above its allocated threshold
          (85% for GPUs by default), and for a stale capacity point. Needs the portal's metrics scraped
          (metrics.serviceMonitor.enabled).
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry
        displayName: GPU telemetry
      - path: gpuTelemetry.enabled
        displayName: GPU use from DCGM
        description: Reads the GPU Operator's DCGM exporter series through components.prometheusUrl and
          shows utilisation and GPU health per tenant next to what Kueue allocated. Billing stays on allocation.
          Deploys no exporter.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry.serviceMonitor.enabled
        displayName: Scrape the DCGM exporter
        description: Only when the GPU Operator's own exporter ServiceMonitor is off.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - path: gpuTelemetry.alerts.enabled
        displayName: GPU health alerts
        description: A PrometheusRule for XID errors, ECC double-bit errors, row remap failures, high
          temperature and hardware clock slowdown. On OpenShift set gpuTelemetry.alerts.namespace to the
          GPU Operator's namespace.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      statusDescriptors:
      - path: conditions
        displayName: Conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - path: deployedRelease
        displayName: Deployed release
        description: The Helm release this resource reconciled into.

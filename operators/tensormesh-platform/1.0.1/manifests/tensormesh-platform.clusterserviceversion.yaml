apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: tensormesh-platform.v1.0.1
  namespace: placeholder
  annotations:
    capabilities: Basic Install
    categories: "AI/Machine Learning"
    containerImage: artifacts.tensormesh.ai/tensormesh-production/images/tensormesh-operator@sha256:229356fe1dc34349faa809051ded9de6f43c5e3f12f19acd1ce18f6bfd78483b
    createdAt: "2026-10-20T00:00:00Z"
    description: KV-cache offloading and CacheBlend non-prefix reuse for vLLM on OpenShift.
    support: Tensormesh
    # Infrastructure features (Red Hat requires all seven, each "true" or "false"). All false for 1.0.1:
    # operands are pulled by the tag in each CR, so digest-only mirroring (disconnected) is not supported
    # yet; the images are not FIPS-validated builds; the operator does not pass cluster proxy settings or
    # the cluster TLS profile to its operands; it uses no cloud token authentication.
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    # Sample CRs OperatorHub pre-fills into the console's "Create instance" form —
    # i.e. what essentially every customer copies. Each MUST set spec.image: the
    # CRD default is the floating public tag lmcache/vllm-openai:latest, so an
    # unset image silently runs the community build instead of the certified one
    # and fails outright on a disconnected cluster, where only the digests in
    # relatedImages below are mirrored. Keep the tags in step with relatedImages.
    # The coordinator runs coordinator-controllers, as the Helm chart does. The LMCacheEngine
    # leaves isolatedIPC to the operator's default (on for NVIDIA), as the chart does. The
    # CacheBlendEngine always shares /dev/shm with its vLLM pods; hostIPC: true does that
    # through the lmcache-engine SCC instead of a hostPath mount. checkLayer 2 matches the
    # connector's default.
    alm-examples: |-
      [
        {"apiVersion":"lmcache.lmcache.ai/v1alpha1","kind":"LMCacheEngine","metadata":{"name":"engine"},"spec":{"l1":{"sizeGB":40},"coordinator":{"ref":{"name":"coordinator"}},"image":{"repository":"artifacts.tensormesh.ai/tensormesh-production/images/vllm-openai","tag":"v0.5.6-ubi"}}},
        {"apiVersion":"lmcache.lmcache.ai/v1alpha1","kind":"LMCacheCoordinator","metadata":{"name":"coordinator"},"spec":{"image":{"repository":"artifacts.tensormesh.ai/tensormesh-production/images/coordinator-controllers","tag":"v0.5.6-ubi"}}},
        {"apiVersion":"lmcache.lmcache.ai/v1alpha1","kind":"CacheBlendEngine","metadata":{"name":"cacheblend"},"spec":{"hostIPC":true,"l1":{"sizeGB":60},"coordinator":{"ref":{"name":"coordinator"}},"blend":{"checkLayer":2},"image":{"repository":"artifacts.tensormesh.ai/tensormesh-production/images/vllm-openai","tag":"v0.5.6-ubi"},"injection":{"payloadImage":{"repository":"artifacts.tensormesh.ai/tensormesh-production/images/cacheblend-plugin","tag":"v0.5.6-ubi"}}}}
      ]
spec:
  displayName: Tensormesh Platform
  description: |
    Tensormesh Platform adds KV-cache reuse to vLLM inference on OpenShift. Built on
    open-source [LMCache](https://github.com/LMCache/LMCache), it keeps KV cache in CPU
    memory and on storage instead of recomputing it, and with CacheBlend it reuses KV
    cache even when the shared text is not at the start of the prompt, as in RAG.

    The operator manages three custom resources:

    * **LMCacheEngine**: a KV-cache server on every GPU node, with a CPU-memory tier and
      an optional storage tier (filesystem, S3-compatible object storage, or NIXL).
    * **LMCacheCoordinator**: a fleet-wide coordinator that the cache servers register with.
    * **CacheBlendEngine**: the CacheBlend engine for non-prefix KV-cache reuse.

    An admission webhook connects opted-in vLLM pods to the cache. SGLang pods can be
    connected too; SGLang works only with cache engines that set `isolatedIPC: false` and
    `hostIPC: true`.

    ### Before you install

    * **Registry credential.** The operator and its images are distributed from the
      Tensormesh registry (`artifacts.tensormesh.ai`) and require a Tensormesh Platform
      subscription. Add your registry API key to the cluster's global pull secret before
      you install, or the operator pod cannot pull its image.
    * **Engine SCC.** CacheBlend engines share the host IPC namespace with the vLLM workers
      on the same node (set `hostIPC: true`), as do cache engines that set `isolatedIPC: false`
      together with `hostIPC: true`. For those, apply the `lmcache-engine`
      SecurityContextConstraints (host IPC only) and grant it to the service account that the
      engines and vLLM pods run as in your workload namespace.
    * **GPU nodes** with NVIDIA driver R580 or later.

    The [installation guide](https://docs.tensormesh.ai/v1.0.1/installation/openshift-operatorhub)
    has the exact commands.
  version: 1.0.1
  maturity: stable
  minKubeVersion: 1.28.0
  provider:
    name: Tensormesh
  keywords: ["llm", "kv-cache", "vllm", "lmcache", "inference", "gpu"]
  links:
    - name: Documentation
      url: https://docs.tensormesh.ai/v1.0.1/introduction
    - name: Tensormesh
      url: https://www.tensormesh.ai
  installModes:
    - {type: OwnNamespace, supported: true}
    - {type: SingleNamespace, supported: true}
    - {type: MultiNamespace, supported: false}
    - {type: AllNamespaces, supported: true}
  customresourcedefinitions:
    owned:
      - name: lmcacheengines.lmcache.lmcache.ai
        version: v1alpha1
        kind: LMCacheEngine
        displayName: LMCache Engine
        description: A per-GPU-node DaemonSet of LMCache cache servers.
      - name: lmcachecoordinators.lmcache.lmcache.ai
        version: v1alpha1
        kind: LMCacheCoordinator
        displayName: LMCache Coordinator
        description: Fleet-wide coordinator so cache servers discover each other.
      - name: cacheblendengines.lmcache.lmcache.ai
        version: v1alpha1
        kind: CacheBlendEngine
        displayName: CacheBlend Engine
        description: Selective KV recompute/blend for non-prefix chunks (e.g. RAG).
  install:
    strategy: deployment
    spec:
      clusterPermissions:
        - serviceAccountName: tensormesh-platform-controller-manager
          rules:
            - apiGroups: [""]
              resources: ["configmaps", "secrets", "services"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
            - apiGroups: ["apps"]
              resources: ["daemonsets", "deployments"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            - apiGroups: ["lmcache.lmcache.ai"]
              resources: ["lmcacheengines", "lmcachecoordinators", "cacheblendengines"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            - apiGroups: ["lmcache.lmcache.ai"]
              resources: ["lmcacheengines/finalizers", "lmcachecoordinators/finalizers", "cacheblendengines/finalizers"]
              verbs: ["update"]
            - apiGroups: ["lmcache.lmcache.ai"]
              resources: ["lmcacheengines/status", "lmcachecoordinators/status", "cacheblendengines/status"]
              verbs: ["get", "patch", "update"]
            - apiGroups: ["monitoring.coreos.com"]
              resources: ["servicemonitors"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            # The opt-in engine NetworkPolicy (spec.networkPolicy). Granted permanently, as in
            # the chart, so turning the feature on never needs an RBAC change.
            - apiGroups: ["networking.k8s.io"]
              resources: ["networkpolicies"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            # Required by the controller-runtime authn/authz filter that
            # --metrics-secure=true turns on (see the deployment args below).
            # Without both, every scrape of the metrics endpoint fails
            # authorization. The chart couples these to metrics.secure the same way.
            - apiGroups: ["authentication.k8s.io"]
              resources: ["tokenreviews"]
              verbs: ["create"]
            - apiGroups: ["authorization.k8s.io"]
              resources: ["subjectaccessreviews"]
              verbs: ["create"]
      # Leader election (--leader-elect below), as the chart enables by default, so an upgrade
      # rollout never has two managers reconciling at once.
      permissions:
        - serviceAccountName: tensormesh-platform-controller-manager
          rules:
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
      deployments:
        - name: tensormesh-platform-controller-manager
          label:
            app.kubernetes.io/name: tensormesh-platform
            control-plane: controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: tensormesh-platform
                control-plane: controller-manager
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  app.kubernetes.io/name: tensormesh-platform
                  control-plane: controller-manager
              spec:
                serviceAccountName: tensormesh-platform-controller-manager
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: manager
                    image: artifacts.tensormesh.ai/tensormesh-production/images/tensormesh-operator@sha256:229356fe1dc34349faa809051ded9de6f43c5e3f12f19acd1ce18f6bfd78483b
                    imagePullPolicy: IfNotPresent
                    command: ["/manager"]
                    args:
                      - --health-probe-bind-address=:8081
                      - --leader-elect
                      - --metrics-bind-address=:8443
                      - --metrics-secure=true
                      - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
                    ports:
                      - {name: https, containerPort: 8443, protocol: TCP}
                      - {name: webhook, containerPort: 9443, protocol: TCP}
                      - {name: health, containerPort: 8081, protocol: TCP}
                    securityContext:
                      readOnlyRootFilesystem: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    livenessProbe:
                      httpGet: {path: /healthz, port: 8081}
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet: {path: /readyz, port: 8081}
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits: {cpu: 500m, memory: 1Gi}
                      requests: {cpu: 10m, memory: 256Mi}
                terminationGracePeriodSeconds: 10
  webhookdefinitions:
    - type: MutatingAdmissionWebhook
      generateName: mpod.lmcache.ai
      deploymentName: tensormesh-platform-controller-manager
      admissionReviewVersions: ["v1"]
      sideEffects: None
      failurePolicy: Ignore
      reinvocationPolicy: Never
      containerPort: 9443
      targetPort: 9443
      webhookPath: /mutate--v1-pod
      rules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE"]
          resources: ["pods"]
      objectSelector:
        matchLabels:
          lmcache.ai/cacheblend-inject: "true"
    # Second entry for the LMCache connection/payload injector, scoped to its own
    # opt-in label, mirroring the Helm chart's narrowly-scoped webhooks.
    - type: MutatingAdmissionWebhook
      generateName: mpod-lmcache.lmcache.ai
      deploymentName: tensormesh-platform-controller-manager
      admissionReviewVersions: ["v1"]
      sideEffects: None
      failurePolicy: Ignore
      reinvocationPolicy: Never
      containerPort: 9443
      targetPort: 9443
      # The LMCache injector is a separate handler at its own path
      # (/mutate--v1-pod = CacheBlend, /mutate-lmcache--v1-pod = LMCache), as in the chart.
      webhookPath: /mutate-lmcache--v1-pod
      rules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE"]
          resources: ["pods"]
      objectSelector:
        matchLabels:
          lmcache.ai/lmcache-inject: "true"
    # Third entry for the SGLang connection injector, mirroring the chart's msglangpod.lmcache.ai
    # webhook: its own handler path and opt-in label. SGLang's LMCache connector supports only
    # legacy CUDA IPC, so the injector skips engines that run isolated IPC (see the description).
    - type: MutatingAdmissionWebhook
      generateName: msglangpod.lmcache.ai
      deploymentName: tensormesh-platform-controller-manager
      admissionReviewVersions: ["v1"]
      sideEffects: None
      failurePolicy: Ignore
      reinvocationPolicy: Never
      containerPort: 9443
      targetPort: 9443
      webhookPath: /mutate-sglang--v1-pod
      rules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE"]
          resources: ["pods"]
      objectSelector:
        matchLabels:
          lmcache.ai/sglang-inject: "true"
  # Digest-pinned for air-gapped installs — all 5 UBI images.
  # CI-pinned from the LIVE GHCR images by the "UBI image release" workflow on every run; this CSV
  # is the single digest source of truth. Do not hand-edit the digests below.
  relatedImages:
    - name: tensormesh-operator
      image: artifacts.tensormesh.ai/tensormesh-production/images/tensormesh-operator@sha256:229356fe1dc34349faa809051ded9de6f43c5e3f12f19acd1ce18f6bfd78483b
    - name: vllm-openai
      image: artifacts.tensormesh.ai/tensormesh-production/images/vllm-openai@sha256:170a8a51e725fb8f49d264d4fb1b8a9fcbcd31aee1ca2080789cbbfdf3e6b297
    - name: cacheblend-plugin
      image: artifacts.tensormesh.ai/tensormesh-production/images/cacheblend-plugin@sha256:770b4096cb252634500a6b658bac162a1e5e597b0cc6bdbf17e977604aa760ad
    - name: lmcache-payload
      image: artifacts.tensormesh.ai/tensormesh-production/images/lmcache-payload@sha256:0bb82e63ba9367b74b3ccc9d0deea0f216503dc611ed507ba51761755e0f8a60
    - name: coordinator-controllers
      image: artifacts.tensormesh.ai/tensormesh-production/images/coordinator-controllers@sha256:02386b25613a65cd76b5c71365d16ad2141cf0a7f785bb424901e26e01f6f189
  icon:
    - base64data: 
      mediatype: image/png
  maintainers:
    - name: Dai Tran
      email: dai@tensormesh.ai

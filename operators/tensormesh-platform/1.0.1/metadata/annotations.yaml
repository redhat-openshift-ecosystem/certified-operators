annotations:
  operators.operatorframework.io.bundle.mediatype.v1: registry+v1
  operators.operatorframework.io.bundle.manifests.v1: manifests/
  operators.operatorframework.io.bundle.metadata.v1: metadata/
  operators.operatorframework.io.bundle.package.v1: tensormesh-platform
  operators.operatorframework.io.bundle.channels.v1: stable
  operators.operatorframework.io.bundle.channel.default.v1: stable
  # Scorecard self-test suite. Keep in lockstep with bundle.Dockerfile's LABELs.
  operators.operatorframework.io.test.mediatype.v1: scorecard+v1
  operators.operatorframework.io.test.config.v1: tests/scorecard/
  # OCP minors this bundle supports. NO leading "=" and no upper bound = an
  # OPEN-ENDED range, which is what earns the automatic carry-forward: when a new
  # OCP minor GAs, a bundle whose range covers it is certified and published for
  # that minor with no resubmission, while the cert stays in good standing
  # (recertify within 12 months; sooner on an unpatched critical/important CVE).
  # "=v4.20" would pin to 4.20 only; "v4.20-v4.22" would stop at 4.22.
  com.redhat.openshift.versions: "v4.20"

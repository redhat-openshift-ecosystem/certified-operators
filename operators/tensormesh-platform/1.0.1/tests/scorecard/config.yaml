# operator-sdk scorecard configuration.
#
# Scorecard is the Operator Framework's bundle self-test suite: each entry below
# runs a containerised check against this bundle (`operator-sdk scorecard bundle/`).
# It is NOT the Red Hat certification gate — Preflight is — but a
# tests/scorecard/config.yaml is the convention in the certified-operators
# catalogue (present in >3300 bundle version directories) and appears in Red Hat's
# documented submission layout, so it ships here and is copied into the
# certified-operators submission alongside manifests/ and metadata/.
#
# The two descriptor checks report findings until the CSV gains specDescriptors /
# statusDescriptors for the three custom resources. That is a CSV quality
# improvement, not a certification blocker.
apiVersion: scorecard.operatorframework.io/v1alpha3
kind: Configuration
metadata:
  name: config
stages:
  - parallel: true
    tests:
      - entrypoint:
          - scorecard-test
          - basic-check-spec
        image: quay.io/operator-framework/scorecard-test:v1.31.0
        labels:
          suite: basic
          test: basic-check-spec-test
        storage:
          spec:
            mountPath: {}
      - entrypoint:
          - scorecard-test
          - olm-bundle-validation
        image: quay.io/operator-framework/scorecard-test:v1.31.0
        labels:
          suite: olm
          test: olm-bundle-validation-test
        storage:
          spec:
            mountPath: {}
      - entrypoint:
          - scorecard-test
          - olm-crds-have-validation
        image: quay.io/operator-framework/scorecard-test:v1.31.0
        labels:
          suite: olm
          test: olm-crds-have-validation-test
        storage:
          spec:
            mountPath: {}
      - entrypoint:
          - scorecard-test
          - olm-crds-have-resources
        image: quay.io/operator-framework/scorecard-test:v1.31.0
        labels:
          suite: olm
          test: olm-crds-have-resources-test
        storage:
          spec:
            mountPath: {}
      - entrypoint:
          - scorecard-test
          - olm-spec-descriptors
        image: quay.io/operator-framework/scorecard-test:v1.31.0
        labels:
          suite: olm
          test: olm-spec-descriptors-test
        storage:
          spec:
            mountPath: {}
      - entrypoint:
          - scorecard-test
          - olm-status-descriptors
        image: quay.io/operator-framework/scorecard-test:v1.31.0
        labels:
          suite: olm
          test: olm-status-descriptors-test
        storage:
          spec:
            mountPath: {}
storage:
  spec:
    mountPath: {}

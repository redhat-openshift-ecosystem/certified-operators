                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  javaOptions:
                    description: Additional arguments for JVM
                    type: string
                  startPollers:
                    description: Number of worker threads to start
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  timeout:
                    description: How long to wait for network operations
                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                type: object
              javaGatewayImage:
                description: Full Zabbix Java gateway image reference, including a
                  tag or digest
                pattern: ^\S+$
                type: string
              javaGatewaySize:
                default: 0
                description: The desired number of Zabbix Java Gateways for the deployment.
                  When omitted, the operator disables Java Gateway.
                format: int32
                minimum: 0
                type: integer
              podMetadata:
                description: Metadata added to managed Pod templates. Operator-managed
                  labels take precedence on conflicts.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Additional annotations
                    maxProperties: 128
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Additional labels
                    maxProperties: 64
                    type: object
                type: object
              server:
                description: Configuration parameters for Zabbix server
                properties:
                  alertScriptsClaim:
                    description: Location of custom alert scripts
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  allowUnsupportedDBVersions:
                    description: Allow the server to work with unsupported database
                      versions
                    type: boolean
                  cacheSize:
                    description: Size of configuration cache, in bytes
                    pattern: ^(\d+|\d+[KMG])$
                    type: string
                  cacheUpdateFrequency:
                    description: Determines how often Zabbix will perform update of
                      configuration cache in seconds
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  dbTLSCipher:
                    description: The list of encryption ciphers that Zabbix server
                      permits for TLS protocols up through TLSv1.2
                    type: string
                  dbTLSCipher13:
                    description: The list of encryption ciphersuites that Zabbix server
                      permits for TLSv1.3 protocol
                    type: string
                  dbTLSConnect:
                    description: Setting this option enforces the use of TLS connection
                      to database
                    enum:
                    - required
                    - verify_ca
                    - verify_full
                    type: string
                  debugLevel:
                    description: Specifies debug level for Zabbix server
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  exportFileSize:
                    description: Maximum size per export file in bytes
                    pattern: ^(\d+|\d+[KMG])?$
                    type: string
                  externalScriptsClaim:
                    description: Location of external scripts
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  historyCacheSize:
                    description: Size of history cache, in bytes
                    pattern: ^(\d+|\d+[KMG])$
                    type: string
                  historyIndexCacheSize:
                    description: Size of history index cache, in bytes
                    pattern: ^(\d+|\d+[KMG])$
                    type: string
                  housekeepingFrequency:
                    description: Determines how often Zabbix will perform housekeeping
                      procedure in hours
                    format: int32
                    maximum: 24
                    minimum: 0
                    type: integer
                  loadModule:
                    description: Modules to load at server startup.
                    items:
                      pattern: ^[^,\s]+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  logSlowQueries:
                    description: Determines how long a database query may take before
                      being logged in milliseconds
                    format: int32
                    maximum: 3600000
                    minimum: 0
                    type: integer
                  maxHousekeeperDelete:
                    description: No more than 'MaxHousekeeperDelete' rows (corresponding
                      to [tablename], [field], [value]) will be deleted per one task
                      in one housekeeping cycle
                    format: int32
                    maximum: 1000000
                    minimum: 0
                    type: integer
                  mibsClaim:
                    description: Additional MIB files location
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  modulesClaim:
                    description: Zabbix server loadable modules volume claim
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  proxyConfigFrequency:
                    description: Determines how often Zabbix server sends configuration
                      data to a Zabbix proxy in seconds
                    format: int32
                    maximum: 604800
                    minimum: 1
                    type: integer
                  proxyDataFrequency:
                    description: Determines how often Zabbix server requests history
                      data from a Zabbix proxy in seconds
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  realTimeExportClaim:
                    description: Directory for real-time export of events, history
                      and trends in newline-delimited JSON format
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  serviceManagerSyncFrequency:
                    description: Determines how often Zabbix will synchronize configuration
                      of a service manager in seconds
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  sshKeysSecret:
                    description: Location of public and private keys for SSH checks
                      and actions
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  sslCASecret:
                    description: Override the location of certificate authority (CA)
                      files for SSL server certificate verification. If not set, system-wide
                      directory will be used
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  sslCertsSecret:
                    description: Location of SSL client certificate files for client
                      authentication
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  sslKeysSecret:
                    description: Location of SSL private key files for client authentication
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  startAlerters:
                    description: Number of pre-forked instances of alerters
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  startDBSyncers:
                    description: Number of pre-forked instances of history syncers
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  startDiscoverers:
                    description: Number of pre-forked instances of discoverers
                    format: int32
                    maximum: 250
                    minimum: 0
                    type: integer
                  startEscalators:
                    description: Number of pre-forked instances of escalators
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  startHTTPPollers:
                    description: Number of pre-forked instances of HTTP pollers
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  startHistoryPollers:
                    description: Number of pre-forked instances of history pollers
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  startIPMIPollers:
                    description: Number of pre-forked instances of IPMI pollers
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  startJavaPollers:

                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                  tlsCAFileName:
                    description: |-
                      File containing the top-level CA(s) certificates for peer certificate verification, used for encrypted communications between Zabbix components
                      Relative names are resolved under /var/lib/zabbix/enc; absolute paths are used unchanged.
                    type: string
                  tlsCRLFileName:
                    description: |-
                      File containing revoked certificates. This parameter is used for encrypted communications between Zabbix components
                      Relative names are resolved under /var/lib/zabbix/enc; absolute paths are used unchanged.
                    type: string
                  tlsCertFileName:
                    description: |-
                      File containing the server certificate or certificate chain, used for encrypted communications between Zabbix components
                      Relative names are resolved under /var/lib/zabbix/enc; absolute paths are used unchanged.
                    type: string
                  tlsCipherAll:
                    description: GnuTLS priority string or OpenSSL (TLS 1.2) cipher
                      string
                    type: string
                  tlsCipherAll13:
                    description: Cipher string for OpenSSL 1.1.1 or newer in TLS 1.3

                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  startVMwareCollectors:
                    description: Number of pre-forked VMware collector instances
                    format: int32
                    maximum: 250
                    minimum: 0
                    type: integer
                  statsAllowedIP:
                    description: IP addresses, CIDR ranges, or DNS names of external

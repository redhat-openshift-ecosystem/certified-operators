                    format: int32
                    maximum: 250
                    minimum: 0
                    type: integer
                  startReportWriters:
                    description: Number of pre-forked instances of report writers
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  startTimers:
                    description: Number of pre-forked instances of timers
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  startTrappers:
                    description: Number of pre-forked instances of trappers. At least

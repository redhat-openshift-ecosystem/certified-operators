                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  tlsKeyFileName:
                    description: |-
                      File containing the server private key, used for encrypted communications between Zabbix components.
                      Relative names are resolved under /var/lib/zabbix/enc; absolute paths are used unchanged.
                    type: string
                  trapperTimeout:
                    description: Specifies how many seconds trapper may spend processing

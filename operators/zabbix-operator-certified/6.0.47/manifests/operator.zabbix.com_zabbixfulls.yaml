apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: zabbixfulls.operator.zabbix.com
spec:
  group: operator.zabbix.com
  names:
    kind: ZabbixFull
    listKind: ZabbixFullList
    plural: zabbixfulls
    singular: zabbixfull
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serverStatus
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Zabbix server with MySQL database server, Nginx web-server and
          optional Zabbix Java Gateway
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZabbixFullSpec defines the desired state of ZabbixFull
            properties:
              builtinReportService:
                default: true
                description: Use the operator-managed Zabbix web service for reporting.
                  When omitted, the operator enables it.
                type: boolean
              database:
                description: |-
                  Operator-managed primary database. ZabbixFull supports MySQL in this release;
                  the engine discriminator allows PostgreSQL support to be added in place.
                properties:
                  clientTLSSecret:
                    description: Secret volume containing root-ca.pem, client-cert.pem
                      and client-key.pem.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  credentialsSecret:
                    description: |-
                      Secret containing database credentials. For MySQL it uses the
                      mysql_root_password, mysql_zabbix_username and mysql_zabbix_password keys.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  engine:
                    description: Primary database engine.
                    enum:
                    - mysql
                    type: string
                  external:
                    description: External database connection settings.
                    properties:
                      host:
                        description: Database server host name.
                        pattern: ^\S+$
                        type: string
                      port:
                        description: Database server port. When omitted, the selected
                          engine's default is used.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    type: object
                  managed:
                    description: Operator-managed database settings.
                    properties:
                      configMap:
                        description: Additional database configuration. For MySQL
                          the ConfigMap must contain 99-custom.cnf.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      image:
                        description: Full database image reference, including a tag
                          or digest.
                        pattern: ^\S+$
                        type: string
                      imageType:
                        description: Container image filesystem and runtime layout.
                          The built-in MySQL image uses rhel.
                        enum:
                        - rhel
                        - upstream
                        - rhel-mariadb
                        type: string
                      resources:
                        description: Database container resource requests and limits.
                        properties:
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Limits
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Requests
                            type: object
                        type: object
                      serverTLSSecret:
                        description: Secret volume containing root-ca.pem, server-cert.pem
                          and server-key.pem.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      storage:
                        description: Existing PersistentVolumeClaim used by the database
                          workload.
                        properties:
                          existingClaim:
                            description: Existing PersistentVolumeClaim name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - existingClaim
                        type: object
                    required:
                    - storage
                    type: object
                    x-kubernetes-validations:
                    - message: imageType is required when image is specified
                      rule: '!has(self.image) || has(self.imageType)'
                    - message: image is required for a non-default imageType
                      rule: '!has(self.imageType) || self.imageType == ''rhel'' ||
                        has(self.image)'
                  name:
                    description: Database or schema name. When omitted, the component-specific
                      default is used.
                    pattern: ^\S+$
                    type: string
                  vault:
                    description: Vault connection used to obtain application database
                      credentials.
                    properties:
                      hashiCorp:
                        description: HashiCorp-specific authentication.
                        properties:
                          tokenSecret:
                            description: Secret containing the Vault token in the

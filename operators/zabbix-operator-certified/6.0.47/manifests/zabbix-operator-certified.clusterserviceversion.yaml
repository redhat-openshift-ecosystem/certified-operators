apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "operator.zabbix.com/v1beta1",
          "kind": "ZabbixAgent",
          "metadata": {
            "name": "zabbix-agent"
          },
          "spec": {
            "hostAccessMode": "container",
            "serverHost": "zabbix-server",
            "useHostNodeName": true
          }
        },
        {
          "apiVersion": "operator.zabbix.com/v1beta1",
          "kind": "ZabbixAgent2",
          "metadata": {
            "name": "zabbix-agent2"
          },
          "spec": {
            "hostAccessMode": "container",
            "serverHost": "zabbix-server",
            "useHostNodeName": true
          }
        },
        {
          "apiVersion": "operator.zabbix.com/v1beta1",
          "kind": "ZabbixFull",
          "metadata": {
            "name": "zabbix-full"
          },
          "spec": {
            "builtinReportService": true,
            "database": {
              "credentialsSecret": "zabbix-full-secrets",
              "engine": "mysql",
              "managed": {
                "storage": {
                  "existingClaim": "mysql-full-zabbix"
                }
              }
            },
            "enableReportService": true,
            "webSize": 1
          }
        },
        {
          "apiVersion": "operator.zabbix.com/v1beta1",
          "kind": "ZabbixProxyMysql",
          "metadata": {
            "name": "zabbix-proxy-mysql"
          },
          "spec": {
            "database": {
              "credentialsSecret": "zabbix-full-secrets",
              "engine": "mysql",
              "managed": {
                "storage": {
                  "existingClaim": "mysql-proxy-zabbix"
                }
              }
            },
            "proxy": {
              "serverHost": "zabbix-server"
            }
          }
        },
        {
          "apiVersion": "operator.zabbix.com/v1beta1",
          "kind": "ZabbixProxySqlite",
          "metadata": {
            "name": "zabbix-proxy-sqlite"
          },
          "spec": {
            "proxy": {
              "serverHost": "zabbix-server"
            },
            "storage": {
              "existingClaim": "zabbix-proxy-sqlite"
            }
          }
        },
        {
          "apiVersion": "operator.zabbix.com/v1beta1",
          "kind": "ZabbixServer",
          "metadata": {
            "name": "zabbix-server"
          },
          "spec": {
            "builtinReportService": true,
            "database": {
              "credentialsSecret": "zabbix-full-secrets",
              "engine": "mysql",
              "external": {
                "host": "mysql-server"
              },
              "name": "zabbix"
            },
            "enableReportService": true,
            "webSize": 1
          }
        }
      ]
    capabilities: Seamless Upgrades
    categories: Monitoring, Networking
    certified: "true"
    containerImage: registry.connect.redhat.com/zabbix/zabbixoperator-certified@sha256:6abff8e4fabac1439d806accb5dbae9ecc9934d6128db5d861cb63fe46aa073c
    createdAt: "2026-09-05T00:00:00Z"
    description: Zabbix operator with multiple deployment variants and different components

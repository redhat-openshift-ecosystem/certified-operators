      version: v1beta1
  description: |
    ## About this Operator

    Zabbix provides real-time monitoring of metrics collected from servers, virtual machines and network devices. The Zabbix Operator deploys and maintains Zabbix components on OpenShift.

    ## Supported Features

    * **Zabbix Server** - Zabbix server, web interface and Java Gateway with an external MySQL database.
    * **Zabbix Server (Full)** - Zabbix server, web interface, Java Gateway and a built-in MySQL database.
    * **Zabbix proxy (SQLite3)** - One or more Zabbix proxies with SQLite3 databases.
    * **Zabbix proxy (MySQL)** - Zabbix proxy with an external or built-in MySQL database.
    * **Zabbix agent** - Zabbix agent deployed on selected nodes.
    * **Zabbix agent 2** - Zabbix agent 2 deployed on selected nodes.

    ## Prerequisites

    * **Zabbix Server** - MySQL host information and database credentials in a Secret.
    * **Zabbix Server (Full)** - MySQL credentials in a Secret and a PersistentVolumeClaim for the database.
    * **Zabbix proxy (SQLite3)** - Zabbix server host information and a PersistentVolumeClaim for SQLite3 database files.
    * **Zabbix proxy (MySQL)** - Zabbix server host information, MySQL credentials in a Secret and, for the built-in database, a PersistentVolumeClaim.
    * **Zabbix agent and Zabbix agent 2** - Zabbix server or proxy connection information. Container mode is used by default; select host or privileged mode explicitly when host-level monitoring requires it.

    ### MySQL credentials

    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: zabbix-full-secrets
    type: Opaque
    stringData:
      mysql_root_password: change-me-root
      mysql_zabbix_username: zabbix
      mysql_zabbix_password: change-me-zabbix
    ```

    The operator uses `mysql_root_password` to initialize the database and grants `mysql_zabbix_username` access using `mysql_zabbix_password`.

    ### TLS certificates for the web interface

    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: zabbix-web-sslsecret
    type: Opaque
    stringData:
      ssl.crt: |
        <PEM certificate>
      ssl.key: |
        <PEM private key>
      dhparam.pem: |
        <PEM DH parameters>
    ```

    The `ssl.crt`, `ssl.key` and `dhparam.pem` files are required to enable TLS for the Zabbix web interface.
  displayName: Zabbix Operator
  icon:
  - base64data: 
    mediatype: image/png
  install:
    spec:
      deployments:
      - label:
          app.kubernetes.io/component: manager
          app.kubernetes.io/created-by: zabbix-operator-certified
          app.kubernetes.io/instance: zabbix-controller-manager
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: deployment
          app.kubernetes.io/part-of: zabbix-operator-certified
          control-plane: zabbix-controller-manager
        name: zabbix-operator-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              control-plane: zabbix-controller-manager
          strategy:
            type: RollingUpdate
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                control-plane: zabbix-controller-manager
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                        - amd64
                        - arm64
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
              containers:
              - args:
                - --leader-elect
                - --leader-election-id=zabbix-operator-certified
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=0
                command:
                - /manager
                env:
                - name: WATCH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['olm.targetNamespaces']
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: RELATED_IMAGE_ZBX_SERVER_MYSQL
                  value: registry.connect.redhat.com/zabbix/zabbix-server-mysql-60@sha256:0aa255303139f85ce3741bbbf08f2b50def25d13ad13880cd9621c1f35bf1c9f
                - name: RELATED_IMAGE_ZBX_WEB_MYSQL
                  value: registry.connect.redhat.com/zabbix/zabbix-web-mysql-60@sha256:12fa5d15fcdc582d06ef99f87ff8d9d177bc5e54d019ce0eb2544335bc3a5af2
                - name: RELATED_IMAGE_ZBX_JAVA_GATEWAY
                  value: registry.connect.redhat.com/zabbix/zabbix-java-gateway-60@sha256:9a187480f1a54ea0ef5c47cd94408b63445f70d675abdb6b9e7c4247e54125fc
                - name: RELATED_IMAGE_ZBX_PROXY_MYSQL
                  value: registry.connect.redhat.com/zabbix/zabbix-proxy-mysql-60@sha256:96c620eeb3f830974332a108376598030e18f1f7d7ab89a339cf18f741e6e04e
                - name: RELATED_IMAGE_ZBX_PROXY_SQLITE
                  value: registry.connect.redhat.com/zabbix/zabbix-proxy-sqlite-60@sha256:8235e7922f12a2ea7cbcad97c584e6bb8e5b1030b90ad1ce7063a0216c3e41ce
                - name: RELATED_IMAGE_ZBX_AGENT

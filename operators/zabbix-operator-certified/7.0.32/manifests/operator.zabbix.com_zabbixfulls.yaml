apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: zabbixfulls.operator.zabbix.com
spec:
  group: operator.zabbix.com
  names:
    kind: ZabbixFull
    listKind: ZabbixFullList
    plural: zabbixfulls
    singular: zabbixfull
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serverStatus

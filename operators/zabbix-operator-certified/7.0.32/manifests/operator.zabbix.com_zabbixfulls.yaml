                          key:
                            description: Key within the Secret.
                            minLength: 1
                            pattern: ^\S+$
                            type: string
                          name:
                            description: Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      privateKey:

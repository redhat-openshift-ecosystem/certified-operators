                    enum:
                    - all
                    - debug
                    - info
                    - warn
                    - error
                    - "off"
                    - trace
                    type: string
                  extLibsClaim:
                    description: Additional Java libraries for Zabbix Java Gateway
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  javaOptions:
                    description: Additional arguments for JVM
                    type: string
                  startPollers:
                    description: Number of worker threads to start
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  timeout:
                    description: How long to wait for network operations, in seconds.
                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                type: object
              javaGatewayImage:
                description: Full Zabbix Java gateway image reference, including a
                  tag or digest
                pattern: ^\S+$
                type: string
              javaGatewaySize:
                default: 0
                description: The desired number of Zabbix Java Gateways for the deployment.
                  When omitted, the operator disables Java Gateway.
                format: int32
                minimum: 0
                type: integer
              podMetadata:
                description: Metadata added to managed Pod templates. Operator-managed
                  labels take precedence on conflicts.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Additional annotations
                    maxProperties: 128
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Additional labels
                    maxProperties: 64
                    type: object
                type: object
              server:
                description: Configuration parameters for Zabbix server
                properties:
                  alertScriptsClaim:
                    description: Location of custom alert scripts
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  allowSoftwareUpdateCheck:
                    description: Allow the Zabbix frontend to receive information

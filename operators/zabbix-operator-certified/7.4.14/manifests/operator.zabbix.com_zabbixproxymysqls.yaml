                        minLength: 1
                        pattern: ^[A-Za-z0-9._-]+$
                        type: string
                      username:
                        description: Key containing the application database username.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[A-Za-z0-9._-]+$
                        type: string
                    type: object
                  engine:
                    description: Primary database engine.
                    enum:

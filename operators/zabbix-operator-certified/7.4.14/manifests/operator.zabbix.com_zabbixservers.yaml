      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Zabbix server with external MySQL or PostgreSQL database support,
          Nginx web-server and optional Zabbix Java Gateway
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZabbixServerSpec defines the desired state of ZabbixServer
            properties:
              builtinReportService:
                default: true
                description: Use the operator-managed Zabbix web service for reporting.
                  When omitted, the operator enables it.
                type: boolean
              database:
                description: External MySQL or PostgreSQL primary database.
                properties:
                  clientTLSSecret:
                    description: |-
                      Legacy shared Secret containing root-ca.pem, client-cert.pem and client-key.pem.
                      Component-level dbTLS settings take precedence and allow CA-only TLS,
                      custom Secret keys, and separate identities for server/proxy and web.
                      Deprecated: use server.dbTLS, proxy.dbTLS, or web.dbTLS.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  credentialsSecret:
                    description: |-
                      Secret containing database credentials. MySQL keeps its historical
                      mysql_root_password, mysql_zabbix_username and mysql_zabbix_password
                      keys unless credentialsSecretKeys overrides them. PostgreSQL defaults to
                      username and password.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  credentialsSecretKeys:
                    description: |-
                      Optional key names within credentialsSecret. Use this to read credentials
                      directly from a Secret managed by another database operator.
                    properties:
                      password:
                        description: Key containing the application database password.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[A-Za-z0-9._-]+$
                        type: string
                      rootPassword:
                        description: Key containing the MySQL root password. Not applicable
                          to PostgreSQL.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[A-Za-z0-9._-]+$
                        type: string
                      username:
                        description: Key containing the application database username.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[A-Za-z0-9._-]+$
                        type: string
                    type: object
                  engine:
                    description: Primary database engine.
                    enum:
                    - mysql
                    - postgresql
                    type: string
                    x-kubernetes-validations:
                    - message: database.engine is immutable
                      rule: self == oldSelf
                  external:
                    description: External database connection settings.
                    properties:
                      host:
                        description: Database server host name.
                        pattern: ^\S+$
                        type: string
                      port:
                        description: Database server port. When omitted, the selected
                          engine's default is used.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    type: object
                  managed:
                    description: Operator-managed database settings.
                    properties:
                      configMap:
                        description: |-
                          Additional database configuration. By default, the ConfigMap must contain
                          99-custom.cnf for MySQL or 99-custom.conf for PostgreSQL.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      configMapKey:
                        description: |-
                          Key containing the database configuration in configMap. When omitted,
                          the engine's historical key is used. The key is mounted under the
                          filename expected by the database image.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      image:
                        description: Full database image reference, including a tag
                          or digest.
                        pattern: ^\S+$
                        type: string
                      imageType:
                        description: Container image filesystem and runtime layout.
                          Built-in database images use rhel.
                        enum:
                        - rhel
                        - upstream
                        - rhel-mariadb
                        type: string
                      resources:
                        description: Database container resource requests and limits.
                        properties:
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Limits
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Requests
                            type: object
                        type: object
                      serverTLS:
                        description: |-
                          Secret keys containing the certificate identity used by the managed
                          database server. This setting takes precedence over serverTLSSecret.
                        properties:
                          ca:
                            description: Certificate authority used to verify client
                              certificates.
                            properties:
                              key:
                                description: Key within the Secret.
                                minLength: 1
                                pattern: ^\S+$
                                type: string
                              name:
                                description: Secret name.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          certificate:
                            description: Database server certificate or certificate
                              chain.
                            properties:
                              key:
                                description: Key within the Secret.
                                minLength: 1
                                pattern: ^\S+$
                                type: string
                              name:
                                description: Secret name.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          privateKey:
                            description: Private key for the database server certificate.
                            properties:
                              key:
                                description: Key within the Secret.
                                minLength: 1
                                pattern: ^\S+$
                                type: string
                              name:
                                description: Secret name.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - certificate
                        - privateKey
                        type: object
                      serverTLSSecret:
                        description: |-
                          Legacy Secret volume containing root-ca.pem, server-cert.pem and server-key.pem.
                          Deprecated: use serverTLS to select custom keys or separate Secrets.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      storage:
                        description: Existing PersistentVolumeClaim used by the database
                          workload.
                        properties:
                          existingClaim:
                            description: Existing PersistentVolumeClaim name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - existingClaim
                        type: object
                      version:
                        description: |-
                          Bundled database release line. MySQL defaults to 8.4 and PostgreSQL to 18.
                          Converted v1alpha1 resources explicitly retain MySQL 8.0.
                          The field is hidden in the OpenShift form because the valid values depend
                          on database.engine. It remains available in YAML for compatibility.
                        enum:
                        - "8.0"
                        - "8.4"
                        - "18"
                        type: string
                    required:
                    - storage
                    type: object
                    x-kubernetes-validations:
                    - message: imageType is required when image is specified
                      rule: '!has(self.image) || has(self.imageType)'
                    - message: image is required for a non-default imageType
                      rule: '!has(self.imageType) || self.imageType == ''rhel'' ||
                        has(self.image)'
                    - message: configMap is required when configMapKey is specified
                      rule: '!has(self.configMapKey) || has(self.configMap)'
                  name:
                    description: Database or schema name. When omitted, the component-specific
                      default is used.
                    pattern: ^\S+$
                    type: string
                  postgresql:
                    description: PostgreSQL-specific connection settings.
                    properties:
                      schema:
                        description: Schema containing the Zabbix tables. When omitted,
                          public is used.
                        minLength: 1
                        pattern: ^\S+$
                        type: string
                    type: object
                  vault:
                    description: Vault connection used to obtain application database
                      credentials.
                    properties:
                      cache:
                        description: |-
                          Cache Vault credentials in the web frontend session.
                          This setting is consumed only by the web frontend.
                        type: boolean
                      hashiCorp:
                        description: HashiCorp-specific authentication.
                        properties:
                          tokenSecret:
                            description: Secret containing the Vault token in the
                              vault_token key.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - tokenSecret
                        type: object
                      prefix:
                        description: Optional provider-specific path prefix prepended
                          to vaultDBPath.
                        pattern: ^\S+$
                        type: string
                      provider:
                        description: VaultProvider identifies the secrets backend
                          used for database credentials.
                        enum:
                        - hashicorp
                        - cyberark
                        type: string
                      tlsCertFileName:
                        description: |-
                          Client certificate file used for the Vault TLS connection. The certificate may also contain the private key.
                          Relative names are resolved inside tlsSecret; absolute paths are used unchanged.
                        pattern: ^\S+$
                        type: string
                      tlsKeyFileName:
                        description: |-
                          Optional client private-key file used for the Vault TLS connection when the certificate does not contain it.
                          Relative names are resolved inside tlsSecret; absolute paths are used unchanged.
                        pattern: ^\S+$
                        type: string
                      tlsSecret:
                        description: |-
                          Secret mounted read-only for the server, proxy and web frontend Vault client.
                          It is required for CyberArk because the Zabbix 7.0 and later container entrypoint
                          authenticates CyberArk requests with a client certificate.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      url:
                        description: Vault server HTTP[S] URL.
                        pattern: ^\S+$
                        type: string
                    required:
                    - provider
                    - url
                    type: object
                    x-kubernetes-validations:
                    - message: hashiCorp authentication is required for the hashicorp
                        provider
                      rule: self.provider != 'hashicorp' || has(self.hashiCorp)
                    - message: hashiCorp authentication is only valid for the hashicorp
                        provider
                      rule: self.provider == 'hashicorp' || !has(self.hashiCorp)
                    - message: tlsCertFileName is required when tlsSecret is specified
                      rule: '!has(self.tlsSecret) || has(self.tlsCertFileName)'
                    - message: tlsSecret is required when tlsCertFileName is specified
                      rule: '!has(self.tlsCertFileName) || has(self.tlsSecret)'
                    - message: tlsSecret is required when tlsKeyFileName is specified
                      rule: '!has(self.tlsKeyFileName) || has(self.tlsSecret)'
                    - message: tlsSecret and tlsCertFileName are required for the
                        cyberark provider
                      rule: self.provider != 'cyberark' || (has(self.tlsSecret) &&
                        has(self.tlsCertFileName))
                required:
                - credentialsSecret
                - engine
                type: object
                x-kubernetes-validations:
                - message: exactly one of managed or external must be specified
                  rule: has(self.managed) != has(self.external)
                - message: database deployment model is immutable
                  rule: has(self.managed) == has(oldSelf.managed)
                - message: database.postgresql is valid only for the postgresql engine
                  rule: '!has(self.postgresql) || self.engine == ''postgresql'''
                - message: database.credentialsSecretKeys.rootPassword is valid only
                    for mysql
                  rule: '!has(self.credentialsSecretKeys) || !has(self.credentialsSecretKeys.rootPassword)
                    || self.engine == ''mysql'''
              enableReportService:
                default: true
                description: Enable scheduled report processing. When omitted, the
                  operator enables it.
                type: boolean
              enableSNMPTraps:
                description: Enable receiving SNMP traps
                type: boolean
              globalEnv:
                description: Global environment settings
                properties:
                  debug:
                    description: Enable component debugging
                    type: boolean
                type: object
              history:
                description: External history storage providers.
                properties:
                  providers:
                    items:
                      description: HistoryProviderSpec configures one external history
                        provider.
                      properties:
                        elasticsearch:
                          description: ElasticsearchHistoryProviderSpec contains Elasticsearch-specific
                            settings.
                          properties:
                            dateIndex:
                              description: Store values in date-based indices.
                              type: boolean
                            url:
                              description: Elasticsearch HTTP[S] endpoint.
                              pattern: ^\S+$
                              type: string
                          required:
                          - url
                          type: object
                        type:
                          description: |-
                            HistoryProviderType identifies an external history storage implementation.
                            SQL storage in the primary database is used when history is omitted.
                          enum:
                          - elasticsearch
                          type: string
                        valueTypes:
                          description: Value types routed to this provider.
                          items:
                            description: HistoryValueType is a Zabbix history value
                              type routed to a provider.
                            enum:
                            - uint
                            - dbl
                            - str
                            - log
                            - text
                            type: string
                          maxItems: 5
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: elasticsearch settings are required for the elasticsearch
                          provider
                        rule: self.type != 'elasticsearch' || has(self.elasticsearch)
                    maxItems: 1
                    minItems: 1
                    type: array
                required:
                - providers
                type: object
              imagePullPolicy:
                description: Image pull policy for operand containers
                enum:
                - Always
                - IfNotPresent
                - Never
                type: string
              imagePullSecrets:
                description: Image pull secrets
                items:
                  description: LocalResourceName is a name of a Kubernetes resource
                    in the custom resource namespace
                  maxLength: 253
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 32
                type: array
              javaGateway:
                description: Configuration parameters for Zabbix Java Gateway
                properties:
                  allowedPeers:
                    description: |-
                      Additional Zabbix servers and proxies allowed to connect to Java Gateway.
                      The operator-managed server or proxy peer DNS name is always included.
                    items:
                      pattern: ^[^,\s]+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  debugLevel:
                    description: Specifies debug level
                    enum:
                    - all
                    - debug
                    - info
                    - warn
                    - error
                    - "off"
                    - trace
                    type: string
                  extLibsClaim:
                    description: Additional Java libraries for Zabbix Java Gateway
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  javaOptions:
                    description: Additional arguments for JVM
                    type: string
                  startPollers:
                    description: Number of worker threads to start
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  timeout:
                    description: How long to wait for network operations
                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                type: object
              javaGatewayImage:
                description: Full Zabbix Java gateway image reference, including a
                  tag or digest
                pattern: ^\S+$
                type: string
              javaGatewaySize:
                default: 0
                description: The desired number of Zabbix Java Gateways for the deployment.
                  When omitted, the operator disables Java Gateway.
                format: int32
                minimum: 0
                type: integer
              podMetadata:
                description: Metadata added to managed Pod templates. Operator-managed
                  labels take precedence on conflicts.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Additional annotations
                    maxProperties: 128
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Additional labels
                    maxProperties: 64
                    type: object
                type: object
              server:
                description: Configuration parameters for Zabbix server
                properties:
                  alertScriptsClaim:
                    description: Location of custom alert scripts
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  allowSoftwareUpdateCheck:
                    description: Allow the server to report available Zabbix software
                      updates.
                    type: boolean
                  allowUnsupportedDBVersions:
                    description: Allow the server to work with unsupported database

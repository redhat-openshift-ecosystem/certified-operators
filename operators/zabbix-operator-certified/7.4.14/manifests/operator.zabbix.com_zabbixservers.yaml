                      pattern: ^[^,\s]+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  historyCacheSize:
                    description: Size of history cache, from 128K through 16G.
                    pattern: ^[1-9][0-9]*[KMG]?$
                    type: string
                  historyIndexCacheSize:
                    description: Size of history index cache, from 128K through 16G.

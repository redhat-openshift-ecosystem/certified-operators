                            type: string
                        required:
                        - key
                        - name
                        type: object
                      certificate:
                        description: Client certificate used for mutual TLS authentication.
                        properties:
                          key:
                            description: Key within the Secret.
                            minLength: 1
                            pattern: ^\S+$
                            type: string
                          name:
                            description: Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      privateKey:
                        description: Private key for the client certificate.
                        properties:
                          key:
                            description: Key within the Secret.
                            minLength: 1
                            pattern: ^\S+$
                            type: string
                          name:
                            description: Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: zabbixbridgeadapters.operator.zabbix.com
spec:
  group: operator.zabbix.com
  names:
    kind: ZabbixBridgeAdapter
    listKind: ZabbixBridgeAdapterList
    plural: zabbixbridgeadapters
    singular: zabbixbridgeadapter
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.bridgeAdapterStatus
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Bridge Adapter
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZabbixBridgeAdapterSpec configures the connection between
              a local Zabbix installation and Zabbix Bridge.
            properties:
              allowedAPIMethods:
                description: |-
                  Zabbix API methods the Adapter may forward: exact method names, resource.* or *.method.
                  An empty list keeps the image's deny-all policy and prevents mobile API requests.
                items:
                  pattern: ^([A-Za-z0-9_]+\.(\*|[A-Za-z0-9_]+)|\*\.[A-Za-z0-9_]+)$
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              apiTLSCASecret:
                description: Secret containing ca.crt, the CA bundle for verifying
                  the Zabbix API certificate.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              apiTLSConnect:
                description: |-
                  TLS for requests to the Zabbix API: disabled uses HTTP; required uses HTTPS without certificate verification;
                  verify_ca checks the issuer; verify_full also checks the hostname. Omitted selects disabled for HTTP and required for HTTPS.
                  Use verify_full with apiTLSCASecret for verified HTTPS.
                enum:
                - disabled
                - required
                - verify_ca
                - verify_full
                type: string
              bridgeURL:
                description: Bridge configuration discovery URL. Omitted uses https://config.mobilebridge.zabbix.com/.well-known/bridge-configuration.
                pattern: ^https?://\S+$
                type: string
              dataVolumeClaim:
                description: |-
                  Existing PVC for EULA acceptance records, identity, encryption keys and persistent state.
                  Must be writable by the container user and dedicated to this Adapter. One Pod runs with Recreate updates.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              debugLevel:
                default: 3
                description: Log verbosity from 0 (basic information) through 5 (extended
                  debugging).
                format: int32
                maximum: 5
                minimum: 0
                type: integer
              eulaVersion:
                description: |-
                  Exact version of the bundled Zabbix Mobile App EULA that you have read and agree to.
                  Setting this field authorizes the init container to accept that version and record acceptance on the data PVC.
                  The image verifies the version; there is no automatic acceptance of a newer version on upgrade.
                pattern: ^\S+$
                type: string
              frontendURL:
                description: Frontend URL
                pattern: ^https?://\S+$
                type: string
              globalEnv:
                description: Global environment settings
                properties:
                  debug:
                    description: Enable component debugging
                    type: boolean
                type: object
              image:
                description: Full image reference. When omitted, RELATED_IMAGE_ZBX_BRIDGE_ADAPTER
                  supplies the image.
                pattern: ^\S+$
                type: string
              imagePullPolicy:
                description: Image pull policy for operand containers
                enum:
                - Always
                - IfNotPresent
                - Never
                type: string
              imagePullSecrets:
                description: Image pull secrets
                items:
                  description: LocalResourceName is a name of a Kubernetes resource
                    in the custom resource namespace
                  maxLength: 253
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 32
                type: array
              podMetadata:
                description: Metadata added to managed Pod templates. Operator-managed
                  labels take precedence on conflicts.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Additional annotations
                    maxProperties: 128
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Additional labels
                    maxProperties: 64
                    type: object
                type: object
              serverID:
                description: Server ID shown in Reports > System information in the
                  target Zabbix frontend. It must match that installation.
                pattern: ^\S+$
                type: string
              serviceMetadata:
                description: Metadata added to managed Services. Operator-managed
                  labels take precedence on conflicts.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Additional annotations
                    maxProperties: 128
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Additional labels
                    maxProperties: 64
                    type: object
                type: object
              tlsAllowedCN:
                description: Permitted client certificate Common Names in mtls mode.
                  Omitted allows any client certificate trusted by ca.crt.
                items:
                  pattern: ^[^,\r\n]+$
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              tlsMode:
                description: |-
                  TLS mode for incoming RPC requests from Zabbix server. Omitted uses tls when tlsSecret is set, otherwise none.
                  mtls additionally requires a client certificate trusted by ca.crt in tlsSecret.
                enum:
                - none
                - tls
                - mtls
                type: string
              tlsSecret:
                description: Secret containing tls.crt and tls.key for the RPC listener,
                  plus ca.crt when tlsMode is mtls.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
            required:
            - dataVolumeClaim
            - eulaVersion
            - frontendURL
            - serverID
            type: object
            x-kubernetes-validations:
            - message: 'apiTLSConnect must match the frontendURL scheme: disabled
                for HTTP, required or verify modes for HTTPS'
              rule: '!has(self.apiTLSConnect) || (self.apiTLSConnect == ''disabled''
                ? self.frontendURL.startsWith(''http://'') : self.frontendURL.startsWith(''https://''))'
            - message: apiTLSCASecret is required for verify_ca and verify_full
              rule: '!has(self.apiTLSConnect) || !(self.apiTLSConnect in [''verify_ca'',
                ''verify_full'']) || has(self.apiTLSCASecret)'
            - message: tlsSecret is required when tlsMode is tls or mtls
              rule: '!has(self.tlsMode) || self.tlsMode == ''none'' || has(self.tlsSecret)'
            - message: tlsSecret cannot be combined with tlsMode none
              rule: '!has(self.tlsSecret) || !has(self.tlsMode) || self.tlsMode !=
                ''none'''
            - message: tlsAllowedCN requires tlsMode mtls
              rule: '!has(self.tlsAllowedCN) || size(self.tlsAllowedCN) == 0 || (has(self.tlsMode)
                && self.tlsMode == ''mtls'')'
          status:
            description: ZabbixBridgeAdapterStatus reports the Adapter rollout state.
            properties:
              bridgeAdapterStatus:
                description: Status of the managed Bridge Adapter Deployment.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the resource state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the controller
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be no more than 63 characters because it is
            used as the managed Service and Deployment name
          rule: self.metadata.name.size() <= 63
        - message: metadata.name must be a lowercase DNS label because it is used
            as a Service and Deployment name
          rule: self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

      version: v1alpha1
  description: |
    zTouch.OS deploys and manages a platform for running GPU and radio access network (RAN) workloads on OpenShift:
    a web dashboard with GPU and network monitoring, a resource inventory, CBRS spectrum access (SAS proxy) and
    O-RAN M-plane control for radio units, and Semaphore UI for the Ansible automation behind them. Which components run is decided by your zTouch.OS license.

    ### Before you install
    * **Namespace.** Install the operator into `ztouch-os-operator-system` (suggested), and create the ZTouchOS
      resource in that same namespace: the operator deploys zTouch.OS only into its own namespace. A cluster
      administrator can allow more namespaces with the operator setting `ZTOUCH_OS_NAMESPACES` (comma-separated,
      in the Subscription's `spec.config.env`).
    * **Storage.** A default StorageClass (or set `storageClassName` on the ZTouchOS resource) for the platform's
      persistent volumes.

    ### Getting started
    Create a `ZTouchOS` resource in the operator's namespace (`ztouch-os-operator-system` if you kept the suggested one). The
    operator deploys the dashboard and exposes it through a Route; sign in with your OpenShift account and add your
    license on the License page. The licensed components then deploy on their own.

    The defaults suit most clusters, so an empty `spec` is a complete installation:

    ```yaml
    apiVersion: ztouch.ztouch.net/v1alpha1
    kind: ZTouchOS
    metadata:
      name: ztouch-os
      namespace: ztouch-os-operator-system
    spec: {}
    ```

    Commonly set fields:

    ```yaml
    spec:
      storageClassName: <storage-class>               # overrides the cluster's default StorageClass
      playbookApplyEnabled: true                      # enables the automation engine (license required)
    ```

    Apply it with `oc apply -f ztouchos.yaml`, or use **Create instance** on the zTouch.OS tab of this operator.

    All component images are pinned by digest by the operator release; upgrading the operator upgrades them.
